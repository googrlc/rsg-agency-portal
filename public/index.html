      return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px">'
        + '<div style="text-align:center"><div style="font-family:\'Newsreader\',Georgia,serif;font-size:19px;color:#1B1D22;margin-bottom:6px">Couldn\'t open that client</div>'
        + '<div style="font-size:12.5px;color:#6B7078">'+esc(d.error || 'no record returned')+'</div>'
        + '<div data-client="close" style="margin-top:14px;font-size:12.5px;color:#2563EB;cursor:pointer">‹ Back to clients</div></div></div>';
    }
    var rec = d.client, ovr = rec._overridden || {};
    var dirty = Object.keys(edits.client).length;

    return '<div style="position:absolute;inset:0;overflow:auto;padding:22px 26px '+AI_FAB_CLEARANCE+'">'
      + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">'
        + '<div data-client="close" title="Back (Esc)" style="font-size:12.5px;color:#6B7078;cursor:pointer;font-weight:600">‹ Clients</div>'
        + '<div style="width:1px;height:16px;background:#E2E1DC"></div>'
        + '<span style="font-size:11.5px;color:#96999F">Saving a correction also writes it to NowCerts — it will ask first</span>'
      + '</div>'
      + '<h1 style="font-family:\'Newsreader\',Georgia,serif;font-size:27px;color:#1B1D22;margin:6px 0 2px;font-weight:500">'+esc(rec.insured_name || '—')+'</h1>'
      + '<div style="display:flex;align-items:center;gap:9px;margin-bottom:3px">'
        + '<span style="font-size:12.5px;color:#787C84">'+esc(rec.client_type || '—')
        + ' · '+d.counts.policies+' policies · '+d.counts.cases+' cases · '+d.counts.tasks+' tasks'
        + ' · '+d.counts.opportunities+' opportunities</span>'
        + liveBadge(rec)
      + '</div>'
      + '<div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#A6A9AF;'
        + 'user-select:all;margin-bottom:18px" title="NowCerts insured ID — read-only">'
        + esc(rec.nowcerts_insured_guid || '') + '</div>'
      + '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start">'
        + '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px">'
          + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
            + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">Details</span>'
            + cardActions('client', '', rec.nowcerts_insured_guid)
          + '</div>'
          + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px">'
            + CLIENT_FIELDS.map(function(f){ return editField('client', rec, f[0], f[1], {overridden:ovr}); }).join('')
          + '</div>'
        + '</div>'
        + '<div style="display:flex;flex-direction:column;gap:14px">'
          + renderPolicyCard()
          + renderWorkCard()
          + miniList('Policies', d.policies || [], [['policy_number','Policy #'],['carrier','Carrier'],['lines_of_business','LOB'],['status','Status','chip'],['expiration_date','Expires','date'],['annualized_premium','Premium','money']], 'No policies on this client.',
              function(p){ return p.policy_guid ? 'data-policy="'+esc(p.policy_guid)+'"' : ''; },
              // Adding from here is the sane path: the insured is already known,
              // so the new policy cannot be attached to the wrong client.
              '<span data-policyrow="new" style="font-size:11.5px;font-weight:600;color:#2563EB;cursor:pointer">Add policy +</span>')
          + miniList('Cases', d.cases || [], [['case_number','Case #'],['title','Subject'],['status','Status','chip'],['priority','Priority','chip']], 'No cases.',
              function(k){ return k.id ? 'data-work="case:'+esc(k.id)+'"' : ''; })
          + miniList('Tasks', d.tasks || [], [['title','Task'],['status','Status','chip'],['due_at','Due','date']], 'No tasks.',
              function(t){ return t.id ? 'data-work="task:'+esc(t.id)+'"' : ''; })
          + miniList('Opportunities', d.opportunities || [], [['line_of_business','LOB'],['stage','Stage','chip'],['premium_estimate','Est.','money'],['carrier','Carrier']], 'No open opportunities.')
        + '</div>'
      + '</div>'
    + '</div>';
  }

  function openClient(guid, keepPolicy){
    clientData = { loading:true }; edits.client = {};
    if (!keepPolicy) { policyOpen = null; }
    edits.policy = {};
    setState({ screen:'crm', crmView:'client', client:guid });
    pull('/api/clients/'+encodeURIComponent(guid)).then(function(d){
      clientData = (!d || d._error) ? { error:(d && d._error) || 'no response' } : d;
      render();
    });
  }

  // Closing is always available, but unsaved corrections are never thrown away
  // silently — losing a typed-in phone number to a stray click is how people
  // stop trusting the edit surface.
  function unsavedOk(n){
    return !n || confirm(n+' unsaved correction'+(n===1?'':'s')+' will be discarded. Close anyway?');
  }

  function closePolicy(force){
    // A half-filled new policy counts as unsaved work too — it is the only copy.
    var pending = Object.keys(edits.policy).length
      + (policyOpen === 'new' ? Object.keys(policyDraft).length : 0);
    if (!force && !unsavedOk(pending)) return false;
    policyOpen = null; edits.policy = {}; policyDraft = {}; render();
    return true;
  }

  function closeClient(){
    if (policyOpen) return closePolicy(false);
    if (!unsavedOk(Object.keys(edits.client).length)) return false;
    clientData = null; edits.client = {}; policyOpen = null; edits.policy = {};
    setState({ crmView:'clients', client:null });
    return true;
  }

  function saveClientEdits(){
    var guid = state.client, fields = Object.keys(edits.client);
    if (!guid || !fields.length) return;
    if (!confirmSave('client', guid, edits.client)) return;
    var who = actingAs(), buf = edits.client;
    // One override per field — each is its own named, reversible decision.
    Promise.all(fields.map(function(f){
      return fetch('/api/clients/'+encodeURIComponent(guid)+'/override', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ field_name:f, value:buf[f], approved_by:who,
                               reason:'corrected in the CRM' })
      }).then(function(r){ return r.ok ? null : r.json().then(function(e){ return (e && e.detail) || 'failed'; }); });
    })).then(function(errs){
      var bad = errs.filter(Boolean);
      if (bad.length) alert('Some corrections were refused:\n' + bad.join('\n'));
      return pushToAms('clients', guid, buf);
    }).then(function(){
      edits.client = {};
      openClient(guid, true);  // re-read so the saved values come back from the API
    }).catch(saveUnreachable);
  }

  // ---- Saving, and what it means -------------------------------------------
  // The CRM correction and the AMS write are two different promises, so the
  // confirmation says which one you are making. It also lists the change
  // itself: "Save 3 changes" tells you how many, not which, and the moment
  // something goes to the system of record that difference matters.
  var AMS_PUSHABLE = {
    client: ['insured_name','email','phone','address','city','state','zip'],
    policy: ['carrier','lines_of_business','premium_amount','annualized_premium',
             'effective_date','expiration_date'],
  };
  var amsStatus = null;   // last push outcome, shown on the card

  function confirmSave(kind, id, buf){
    var keys = Object.keys(buf);
    var pushable = keys.filter(function(k){ return AMS_PUSHABLE[kind].indexOf(k) >= 0; });
    var lines = keys.map(function(k){
      var v = buf[k] === '' ? '(blank)' : buf[k];
      return '  · ' + k.replace(/_/g,' ') + ' → ' + v
        + (pushable.indexOf(k) < 0 ? '   [CRM only]' : '');
    }).join('\n');
    var msg = 'Save ' + keys.length + ' change' + (keys.length===1?'':'s') + ' to this ' + kind + '?\n\n'
      + lines + '\n\n'
      + (pushable.length
          ? 'This also writes ' + pushable.length + ' of them to NowCerts, on record\n' + id
            + '\n\nNowCerts is the system of record. This cannot be undone from here.'
          : 'These are held in the CRM only — nothing goes to NowCerts.');
    return confirm(msg);
  }

  // Push after the CRM save, never instead of it: the correction is true either
  // way, and if the AMS is unreachable we want the record fixed here and a
  // retryable queue row there — not a lost edit.
  function pushToAms(collection, id, buf){
    var kind = collection === 'clients' ? 'client' : 'policy';
    var fields = {};
    Object.keys(buf).forEach(function(k){
      if (AMS_PUSHABLE[kind].indexOf(k) >= 0) fields[k] = buf[k];
    });
    if (!Object.keys(fields).length) { amsStatus = null; return Promise.resolve(); }
    amsStatus = { state:'sending', id:id };
    render();
    return fetch('/api/'+collection+'/'+encodeURIComponent(id)+'/push-to-ams', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fields:fields, approved_by:actingAs(), reason:'corrected in the CRM' })
    }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(res){
        if (!res.ok) { amsStatus = { state:'error', id:id, detail:(res.j && res.j.detail) || 'refused' }; return; }
        amsStatus = res.j.pushed
          ? { state: res.j.verified ? 'synced' : 'unverified', id:id,
              detail: (res.j.unverified_fields || []).join(', ') }
          : { state:'error', id:id, detail:res.j.error };
      })
      .catch(function(e){ amsStatus = { state:'error', id:id, detail:String(e) }; });
  }

  // One line on the card saying where the change actually got to.
  function amsBadge(id){
    if (!amsStatus || amsStatus.id !== id) return '';
    var s = amsStatus.state;
    var look = { sending:['#B9822A','#F7EEDB','Writing to NowCerts…'],
                 synced:['#2563EB','#E9EFFC','Synced to NowCerts ✓'],
                 unverified:['#B9822A','#F7EEDB','Sent, not confirmed by NowCerts'],
                 error:['#B4231F','#FBE9E7','Not synced to NowCerts'] }[s];
    if (!look) return '';
    return '<span title="'+esc(amsStatus.detail || '')+'" style="font-size:11px;font-weight:700;border-radius:999px;'
      + 'padding:3px 9px;color:'+look[0]+';background:'+look[1]+'">'+look[2]+'</span>';
  }

  function savePolicyEditsThenPush(){
    var guid = policyOpen, fields = Object.keys(edits.policy);
    if (!guid || guid === 'new' || !fields.length) return;
    if (!confirmSave('policy', guid, edits.policy)) return;
    var who = actingAs(), buf = edits.policy;
    Promise.all(fields.map(function(f){
      return fetch('/api/policies/'+encodeURIComponent(guid)+'/override', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ field_name:f, value:buf[f], approved_by:who,
                               reason:'corrected in the CRM' })
      }).then(function(r){ return r.ok ? null : r.json().then(function(e){ return (e && e.detail) || 'failed'; }); });
    })).then(function(errs){
      var bad = errs.filter(Boolean);
      if (bad.length) alert('Some corrections were refused:\n' + bad.join('\n'));
      return pushToAms('policies', guid, buf);
    }).then(function(){
      edits.policy = {};
      if (state.crmView === 'client' && state.client) openClient(state.client, true);
      else { loadCrmView('policies', true); }
    }).catch(saveUnreachable);
  }

  function createPolicy(){
    var d = Object.assign({}, policyDraft, edits.policy);
    if (!d.insured_id || !d.policy_number) {
      alert('A policy needs a client (NowCerts insured ID) and a policy number.');
      return;
    }
    if (!confirm('Create policy ' + d.policy_number + ' in NowCerts for\n' + d.insured_id
                 + '?\n\nThis writes to the system of record.')) return;
    var body = { insured_id:d.insured_id, policy_number:d.policy_number,
                 carrier:d.carrier || null, lines_of_business:d.lines_of_business || null,
                 effective_date:d.effective_date || null, expiration_date:d.expiration_date || null,
                 premium_amount: d.premium_amount ? parseFloat(String(d.premium_amount).replace(/[^0-9.\-]/g,'')) : null,
                 approved_by: actingAs(), reason:'added in the CRM' };
    fetch('/api/policies', { method:'POST', headers:{'Content-Type':'application/json'},
                             body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(res){
        if (!res.ok) { alert('NowCerts did not create it:\n' + JSON.stringify(res.j.detail || res.j)); return; }
        policyOpen = null; policyDraft = {}; edits.policy = {};
        alert('Created in NowCerts. It appears in the CRM after the next sync.');
        render();
      }).catch(saveUnreachable);
  }

  // ---- Pipeline writes ------------------------------------------------------
  function closeDeal(){
    if (!dealOpen) return true;
    if (!unsavedOk(Object.keys(edits.deal).length)) return false;
    dealOpen = null; edits.deal = {}; dealDraft = {};
    dealEvents = null; dealNoteDraft = '';
    render();
    return true;
  }

  function saveDealEdits(){
    var rec = dealRecord(), fields = Object.keys(edits.deal);
    if (!rec || !fields.length) return;
    var stage = edits.deal.stage;
    var body = {};
    fields.forEach(function(f){ if (f !== 'stage') body[f] = edits.deal[f] === '' ? null : edits.deal[f]; });
    if (body.premium_estimate != null) body.premium_estimate = parseFloat(String(body.premium_estimate).replace(/[^0-9.\-]/g,''));

    var steps = [];
    if (Object.keys(body).length) {
      steps.push(fetch('/api/opportunities/'+encodeURIComponent(rec.id), {
        method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
      }));
    }
    // A stage change has its own endpoint — it is a pipeline move, with the
    // side effects (status, probability) that implies, not a field write.
    if (stage) {
      steps.push(fetch('/api/opportunities/'+encodeURIComponent(rec.id)+'/stage', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ stage:stage, moved_by:actingAs() })
      }));
    }
    Promise.all(steps).then(function(rs){
      var bad = rs.filter(function(r){ return !r.ok; });
      if (bad.length) return bad[0].json().then(function(e){
        alert('That change was refused:\n' + JSON.stringify((e && e.detail) || e));
      });
      edits.deal = {};
      // The stage call is the last step when there is one; it carries whether the
      // AMS filing was queued or blocked.
      var last = stage ? rs[rs.length - 1] : null;
      return (last ? last.json().then(reportAmsOutcome) : Promise.resolve())
        .then(function(){
          loadCrmView('pipeline', true);
          if (stage && dealOpen) loadDealEvents(rec.id);   // the move logged itself
        });
    }).catch(saveUnreachable);
  }

  // ---- Dragging a deal across the board -------------------------------------
  // The board shipped with columns, tiles and a data-stagecol on every column —
  // and nothing that listened for a drag. Moving a deal meant opening it and
  // changing a dropdown, which is not what a kanban is for.
  //
  // The handlers are delegated off #app because render() replaces its innerHTML
  // wholesale: anything bound to a tile would be thrown away on the next paint.
  // The drag itself is deliberately kept out of state — highlighting the column
  // under the cursor by re-rendering the page on every dragover would fight the
  // browser's own drag image.
  var dragDeal = null;

  function stageColumnAt(el){
    return el && el.closest ? el.closest('[data-stagecol]') : null;
  }
  function markDropTarget(col, on){
    if (!col) return;
    col.style.background = on ? '#F0F5F1' : '#FAFAF7';
    col.style.borderColor = on ? '#2563EB' : '#EFEFEB';
  }
  function clearDropTargets(){
    var cols = document.querySelectorAll('[data-stagecol]');
    for (var i=0;i<cols.length;i++) markDropTarget(cols[i], false);
  }

  // The write. Same endpoint the Stage dropdown uses, so a drag and an edit have
  // identical side effects (status, probability, likelihood) on the backend.
  function moveDealToStage(id, stage){
    fetch('/api/opportunities/'+encodeURIComponent(id)+'/stage', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ stage:stage, moved_by:actingAs() })
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if (!res.ok) { alert('That move was refused:\n' + JSON.stringify((res.j && res.j.detail) || res.j)); return; }
        reportAmsOutcome(res.j);
        loadCrmView('pipeline', true);
        // The move just logged itself. If the card that shows the history is
        // open, it has to say so without being reopened.
        if (dealOpen && String(dealOpen) === String(id)) loadDealEvents(id);
      }).catch(function(){
        alert('Couldn\'t reach the server, so the deal did not move.\n\n'
            + 'Check your connection and drag it again.');
      });
  }

  // Winning a deal is the moment it has to exist in NowCerts. The move itself
  // always succeeds — it is a CRM stage — so if the AMS filing could not be
  // queued, that has to be said out loud here or the deal silently never lands.
  function reportAmsOutcome(j){
    if (!j) return;
    if (j.ams_blocked) {
      alert('Moved — but this deal has NOT been filed in NowCerts.\n\n'
          + j.ams_blocked + '\n\n'
          + 'Open the deal, fix that, and move it to Bound / Won again.');
    } else if (j.ams_queued) {
      alert('Won. Queued for NowCerts — the insured and the policy are filed there\n'
          + 'on the next executor run.');
    }
  }

  document.getElementById('app').addEventListener('dragstart', function(e){
    var tile = e.target.closest ? e.target.closest('[data-deal]') : null;
    if (!tile || tile.getAttribute('data-deal') === 'new') return;
    dragDeal = tile.getAttribute('data-deal');
    tile.style.opacity = '.45';
    // Firefox refuses to start a drag unless something is on the dataTransfer.
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragDeal); } catch (err) {}
    }
  });

  document.getElementById('app').addEventListener('dragend', function(e){
    var tile = e.target.closest ? e.target.closest('[data-deal]') : null;
    if (tile) tile.style.opacity = '';
    dragDeal = null;
    clearDropTargets();
  });

  // Without preventDefault on dragover the browser treats the column as a place
  // you cannot drop, and the tile springs back with no explanation.
  document.getElementById('app').addEventListener('dragover', function(e){
    if (!dragDeal) return;
    var col = stageColumnAt(e.target);
    if (!col) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    markDropTarget(col, true);
  });

  document.getElementById('app').addEventListener('dragleave', function(e){
    var col = stageColumnAt(e.target);
    // Moving between children of the same column fires dragleave too; only clear
    // when the cursor has actually left the column's box.
    if (col && !col.contains(e.relatedTarget)) markDropTarget(col, false);
  });

  document.getElementById('app').addEventListener('drop', function(e){
    if (!dragDeal) return;
    var col = stageColumnAt(e.target);
    if (!col) return;
    e.preventDefault();
    var id = dragDeal, stage = col.getAttribute('data-stagecol');
    dragDeal = null;
    clearDropTargets();
    // Dropping a card back where it started is not a move; firing the stage
    // endpoint anyway would re-stamp the row and claim it from the AMS sync.
    var rows = (crmData.pipeline || {}).rows || [];
    for (var i=0;i<rows.length;i++){
      if (String(rows[i].id) === String(id) && rows[i].stage === stage) return;
    }
    moveDealToStage(id, stage);
  });

  // A dropped connection used to land here as an unhandled rejection: no alert,
  // no reload, the typed edits still sitting on screen looking saved. Say so, and
  // leave the buffer alone so Save can simply be pressed again.
  function saveUnreachable(err){
    alert('Couldn\'t reach the server, so nothing was saved.\n\n'
        + 'Your changes are still on the card — check your connection and press Save again.'
        + (err && err.message ? '\n\n(' + err.message + ')' : ''));
  }

  function createDeal(){
    var d = Object.assign({}, dealDraft, edits.deal);
    if (!d.line_of_business) { alert('A deal needs a line of business.'); return; }
    var body = { line_of_business:d.line_of_business, insured_id:d.insured_id || null,
                 insured_name:d.insured_name || null, carrier:d.carrier || null,
                 assigned_to_email:d.assigned_to_email || null,
                 next_action:d.next_action || null, description:d.description || null,
                 expected_close_date:d.expected_close_date || null,
                 stage:d.stage || null, source:'manual', created_by:actingAs() };
    if (d.premium_estimate) body.premium_estimate = parseFloat(String(d.premium_estimate).replace(/[^0-9.\-]/g,''));
    fetch('/api/opportunities', { method:'POST', headers:{'Content-Type':'application/json'},
                                  body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(res){
        if (!res.ok) { alert('That deal was refused:\n' + JSON.stringify(res.j.detail || res.j)); return; }
        dealOpen = null; dealDraft = {}; edits.deal = {};
        loadCrmView('pipeline', true);
      }).catch(saveUnreachable);
  }

  function actingAs(){
    return (state.user === 'gretchen') ? 'gretchen@risksolutionsgroup.net'
                                       : 'lamar@risksolutionsgroup.net';
  }

  // Re-read whichever list the open work item came from, so a saved change is
  // shown as the API returned it rather than as it was typed.
  function reloadWorkFor(item){
    if (state.crmView === 'client' && state.client) { openClient(state.client, true); return; }
    loadCrmView(item && item.kind === 'task' ? 'tasks' : 'cases', true);
  }
  function reloadWork(){ reloadWorkFor(workOpen); }

  function closeWork(){
    if (!workOpen) return true;
    if (!unsavedOk(Object.keys(edits.work).length)) return false;
    workOpen = null; edits.work = {}; render();
    return true;
  }

  function saveWorkEdits(){
    var rec = workRecord(), fields = Object.keys(edits.work);
    if (!rec || !fields.length) return;
    var body = {};
    fields.forEach(function(f){ body[f] = edits.work[f] === '' ? null : edits.work[f]; });
    fetch('/api/'+(workOpen.kind === 'task' ? 'tasks' : 'cases')+'/'+encodeURIComponent(rec.id), {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    }).then(function(r){
      return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; });
    }).then(function(err){
      if (err) { alert('That change was refused:\n' + JSON.stringify(err)); return; }
      edits.work = {};
      reloadWork();
    }).catch(saveUnreachable);
  }

  // Completing a task is a status write. Closing a case is not: it checks the
  // required tasks, records a resolution and pushes a summary to NowCerts — so
  // it asks for the resolution rather than inventing one.
  function finishWork(){
    var rec = workRecord();
    if (!rec) return;
    var isTask = workOpen.kind === 'task';
    var url, body;
    if (isTask) {
      if (!confirm('Mark "'+(rec.title||'this task')+'" complete?')) return;
      url = '/api/tasks/'+encodeURIComponent(rec.id)+'/complete';
      body = {};
    } else {
      var resolution = prompt('How was this case resolved? (goes to NowCerts)');
      if (!resolution) return;
      url = '/api/cases/'+encodeURIComponent(rec.id)+'/close';
      body = { resolution: resolution, resolved_by_email: actingAs() };
    }
    fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
                 body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(res){
        if (!res.ok) {
          var d = res.j && res.j.detail;
          // The backend answers a blocked close with the tasks that are blocking
          // it, which is the only useful thing to show here.
          if (d && d.blocking) {
            alert('Cannot close ' + (d.case_number||'this case') + ' yet:\n\n'
              + d.blocking.map(function(b){ return '· ' + b.title + ' (' + b.status + ')'; }).join('\n')
              + '\n\n' + (d.hint || ''));
          } else {
            alert('That did not go through:\n' + JSON.stringify(d || res.j));
          }
          return;
        }
        edits.work = {};
        // A completed task drops out of the open-task queue, so the card would
        // be left pointing at a row that is no longer in the list. Completing it
        // is also the end of working it — close the card and show the list.
        if (isTask) { var k = workOpen; workOpen = null; reloadWorkFor(k); return; }
        reloadWork();
      }).catch(saveUnreachable);
  }

  function deleteWork(){
    var rec = workRecord();
    if (!rec) return;
    var isTask = workOpen.kind === 'task';
    var what = isTask ? 'task' : 'case';
    var warn = 'Delete this '+what+'?\n\n"'+(rec.title || rec.case_number || rec.id)+'"'
      + (isTask ? '' : '\n\nIts tasks, timeline and document links go with it. The documents themselves stay in Nextcloud.')
      + '\n\nThis cannot be undone.';
    if (!confirm(warn)) return;
    fetch('/api/'+(isTask?'tasks':'cases')+'/'+encodeURIComponent(rec.id), {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ deleted_by: actingAs(), reason:'deleted from the CRM' })
    }).then(function(r){
      return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; });
    }).then(function(err){
      if (err) { alert('That '+what+' was not deleted:\n' + JSON.stringify(err)); return; }
      var kind = workOpen.kind;
      workOpen = null; edits.work = {};
      if (state.crmView === 'client' && state.client) openClient(state.client, true);
      else loadCrmView(kind === 'task' ? 'tasks' : 'cases', true);
    }).catch(saveUnreachable);
  }

  // ---- Renewal detail -------------------------------------------------------
  // Both premiums are editable: the expiring one is often wrong in the mirror,
  // and the renewal one does not exist until a carrier quotes it. The change
  // percentage is not a field — it is computed from the two, so it follows.
  var RENEWAL_RISK = ['SAFE','AT_RISK','CRITICAL','RENEWED','LAPSED'];
  var RENEWAL_FIELDS = [
    ['premium_current','Premium (current)'], ['premium_renewal','Premium (renewal)'],
    ['risk_status','Risk', {options:RENEWAL_RISK}],
    // A DATE column, so a date picker is safe here — unlike a task's due_at,
    // which is a timestamp and would lose its time to one.
    ['last_contact_date','Last contact', {date:true}],
    ['ai_strategy_notes','Strategy note', {wide:true, area:true}],
  ];

  // Saving a renewal is a correction, not a plain write. project_85_renewals is
  // re-projected from the candidate ledger every night, so a value written
  // straight onto the row is replaced by the AMS's version before morning —
  // which is why a premium that came over wrong has always stayed wrong. Each
  // field goes through /override, the same named, reversible decision the client
  // and policy cards make, and that is what the rebuild is made to respect.
  function saveRenewalEdits(){
    var rec = selRenewal, fields = Object.keys(edits.renewal);
    if (!rec || !rec.id || !fields.length) return;
    var who = actingAs(), buf = edits.renewal;
    Promise.all(fields.map(function(f){
      var v = buf[f];
      if (v === '') v = null;
      else if (f.indexOf('premium') === 0) v = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
      return fetch('/api/renewals/'+encodeURIComponent(rec.id)+'/override', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ field_name:f, value:v, approved_by:who,
                               reason:'corrected in the CRM' })
      }).then(function(r){ return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; }); });
    })).then(function(errs){
      var bad = errs.filter(Boolean);
      if (bad.length) alert('Some corrections were refused:\n' + bad.map(function(b){ return typeof b==='string'?b:JSON.stringify(b); }).join('\n'));
      edits.renewal = {};
      // Re-read the cockpit so the recomputed change percentage comes from the
      // database rather than being guessed here.
      reloadRenewals(rec.id);
    }).catch(saveUnreachable);
  }

  // Off the worklist — not out of the database. renewal_actions hangs off this
  // row, so a real delete would erase the record of the work already done on the
  // renewal, and the nightly refresh would rebuild it from the same policy
  // anyway. The backend records a removal on the renewal and on the event
  // underneath it, which is what makes it stick.
  function deleteRenewal(){
    var rec = selRenewal;
    if (!rec || !rec.id) return;
    if (!confirm('Remove this renewal from the worklist?\n\n"'
        + (rec.client_name || rec.policy_number || rec.id) + '"\n\n'
        + 'It stops showing here and the nightly refresh will not put it back.\n'
        + 'The renewal and its history are kept — this can be undone.')) return;
    fetch('/api/renewals/'+encodeURIComponent(rec.id), {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ deleted_by: actingAs(), reason:'removed from the CRM' })
    }).then(function(r){
      return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; });
    }).then(function(err){
      if (err) { alert('That renewal was not removed:\n' + JSON.stringify(err)); return; }
      edits.renewal = {}; selRenewal = null;
      setState({ detail:false });
      // Re-read the removals as well as the list: a renewal that vanished with
      // no way back and no record of who removed it is how a list stops being
      // trusted. Both land in the same render.
      loadRenewalRemovals().then(function(){ reloadRenewals(null); });
    }).catch(saveUnreachable);
  }

  // The removals, and the way back. A delete nobody can undo is a delete people
  // stop pressing — and the renewal it hid is then invisible rather than
  // decided. Each removal is an override, so withdrawing it restores the row.
  var renewalRemoved = [];

  function loadRenewalRemovals(){
    return pull('/api/renewals/overrides?status=active').then(function(d){
      renewalRemoved = (d && !d._error && Array.isArray(d.overrides))
        ? d.overrides.filter(function(o){ return o.field_name === 'dismissed'; })
        : [];
    }).catch(function(){ renewalRemoved = []; });
  }

  function restoreRenewal(id){
    fetch('/api/renewals/overrides/'+encodeURIComponent(id)
          + '?approved_by='+encodeURIComponent(actingAs()), { method:'DELETE' })
      .then(function(r){ return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; }); })
      .then(function(err){
        if (err) { alert('That renewal was not put back:\n' + JSON.stringify(err)); return; }
        loadRenewalRemovals().then(function(){ reloadRenewals(null); });
      }).catch(saveUnreachable);
  }

  // Re-read the list and re-point the open card at the row as the API now
  // returns it. Passing no id closes the card's grip on a row that is gone.
  function reloadRenewals(keepId){
    return pull('/api/renewals').then(function(d){
      if (applyRenewals(d)) {
        selRenewal = null;
        for (var i=0;i<renewalRows.length;i++){
          var raw = renewalRows[i]._raw;
          if (raw && keepId && String(raw.id) === String(keepId)) selRenewal = raw;
        }
      }
      render();
    });
  }

  // ---- Sorting and paging a list -------------------------------------------
  // Both are per-view and held in one place, so every list gets the same
  // behaviour and switching views does not inherit the last one's sort.
  var listState = {};   // view key -> {sort, dir, page}
  var PAGE_SIZE = 50;

  function listFor(key){
    // Finance defaults to this calendar month's closes — the desk works
    // "what closed this month and still needs reconciling" before month-end.
    if (!listState[key]) listState[key] = { sort:null, dir:1, page:0, live:(key==='finance'?'month':'all') };
    return listState[key];
  }

  // ---- Active vs inactive ---------------------------------------------------
  // Read-only, here and in the backend. canonical_clients.active is recomputed
  // by a database trigger from that client's policies whenever one is bound or
  // cancelled, and a policy's active follows its own status. So this filters and
  // labels; it never offers to set the flag. The lever is the policy — cancel a
  // client's last live policy in the AMS and the client goes inactive on its own.
  //
  // Deliberately no client-side recomputation from the policy list. "Active"
  // means one thing, defined in one place, and a second definition in the
  // browser is how the screen and the database start disagreeing.
  //
  // A row with no `active` column counts as active rather than being hidden: a
  // list that silently drops records it cannot classify is worse than one that
  // shows them.
  function isActive(r){ return r.active !== false; }

  function liveFilter(key, rows){
    var st = listFor(key);
    if (st.live === 'active') return rows.filter(isActive);
    if (st.live === 'inactive') return rows.filter(function(r){ return !isActive(r); });
    return rows;
  }

  // Only offered where the data carries the flag — a filter permanently reading
  // "0 inactive" teaches people to ignore it.
  function liveChips(key, rows){
    if (!rows || !rows.length || !rows.some(function(r){ return 'active' in r; })) return '';
    var st = listFor(key);
    var on = rows.filter(isActive).length, off = rows.length - on;
    var chip = function(v, label, n){
      var sel = st.live === v;
      return '<span data-live="'+key+':'+v+'" style="font-size:12px;font-weight:600;border-radius:999px;padding:5px 13px;cursor:pointer;'
        + (sel ? 'color:#fff;background:#3D4149' : 'color:#3D4149;background:#fff;border:1px solid #E6E6E2')+'">'
        + label + ' · ' + n.toLocaleString('en-US') + '</span>';
    };
    return '<div style="display:flex;gap:7px;margin-bottom:12px">'
      + chip('all','All', rows.length) + chip('active','Active', on)
      + chip('inactive','Inactive', off)
      + (off && st.live === 'inactive'
          ? '<span style="font-size:11.5px;color:#96999F;align-self:center;margin-left:4px">No live policy — the win-back list.</span>' : '')
    + '</div>';
  }

  // The flag itself, wherever a record is shown.
  function liveBadge(r){
    if (!r || !('active' in r)) return '';
    return isActive(r)
      ? '<span title="Has at least one live policy. Derived — not editable." style="font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;color:#2563EB;background:#E9EFFC">Active</span>'
      : '<span title="No live policy. Derived from this client\'s policies — not editable." style="font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;color:#6B7078;background:#EFEFEC">Inactive</span>';
  }

  // Sort by what the column MEANS, not by how it reads: money and premiums
  // compare as numbers, dates as time, everything else as text. Sorting a
  // premium column as text puts $9,100 above $40,000.
  // A column may carry an accessor as its 4th entry. The hand-built views render
  // formatted strings — "$1,170", "22 days", "3 days ago" — and sorting those as
  // text is how $9,100 ends up above $40,000. The accessor reaches past the
  // display value to the number or date underneath.
  function sortValue(row, col){
    var v = col[3] ? col[3](row) : row[col[0]], fmt = col[2];
    if (v == null || v === '') return null;
    if (fmt === 'money') { var n = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n) ? null : n; }
    if (fmt === 'date' || fmt === 'closedate') { var t = dateMs(v); return isNaN(t) ? null : t; }
    return String(v).toLowerCase();
  }

  function sortRows(rows, cols, st){
    if (st.sort == null || !cols[st.sort]) return rows;
    var col = cols[st.sort];
    return rows.slice().sort(function(a,b){
      var x = sortValue(a,col), y = sortValue(b,col);
      // Empty cells sort last in both directions — a blank is not "smallest",
      // it is missing, and burying the rows you can act on under the ones you
      // cannot is the opposite of what sorting is for.
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      return (x < y ? -1 : x > y ? 1 : 0) * st.dir;
    });
  }

  // The generic CRM table sorts through sortHeader/sortRows. Renewals, Cases and
  // Finance built their headers by hand as plain <span>s and so could not be
  // sorted at all — on a 50-row renewal worklist that means reading every row to
  // find the biggest premium. Same machinery, same behaviour, same arrows.
  function sortedFor(key, cols, rows){
    return sortRows(rows, cols, listFor(key));
  }

  function sortHeader(key, cols){
    var st = listFor(key);
    return cols.map(function(c, i){
      var on = st.sort === i;
      var arrow = on ? (st.dir === 1 ? ' ▲' : ' ▼') : '';
      return '<span data-sort="'+key+':'+i+'" title="Sort by '+esc(c[1])+'" style="cursor:pointer;user-select:none;'
        + (c[2]==='money'?'text-align:right;':'') + (on?'color:#1B1D22;':'')
        + 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+c[1]+arrow+'</span>';
    }).join('');
  }

  // Page control. Renders nothing for a single page — a pager under 12 rows is
  // furniture, not navigation.
  function pager(key, total){
    var st = listFor(key), pages = Math.ceil(total / PAGE_SIZE);
    if (pages <= 1) return '';
    var from = st.page * PAGE_SIZE + 1, to = Math.min(total, (st.page + 1) * PAGE_SIZE);
    var btn = 'font-size:12px;font-weight:600;border-radius:7px;padding:5px 11px;border:1px solid #E6E6E2;background:#fff;';
    var dead = 'color:#C3C6CB;cursor:default';
    var live = 'color:#3D4149;cursor:pointer';
    return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;border-top:1px solid #F2F2EE;background:#FCFCFA">'
      + '<span style="font-size:12px;color:#787C84">'+from.toLocaleString('en-US')+'–'+to.toLocaleString('en-US')
        + ' of '+total.toLocaleString('en-US')+'</span>'
      + '<div style="display:flex;align-items:center;gap:8px">'
        + '<span'+(st.page>0?' data-page="'+key+':prev"':'')+' style="'+btn+(st.page>0?live:dead)+'">‹ Prev</span>'
        + '<span style="font-size:12px;color:#787C84">Page '+(st.page+1)+' of '+pages+'</span>'
        + '<span'+(st.page<pages-1?' data-page="'+key+':next"':'')+' style="'+btn+(st.page<pages-1?live:dead)+'">Next ›</span>'
      + '</div>'
    + '</div>';
  }


  // ---- Corrections that never reached NowCerts -------------------------------
  // Worth a banner rather than a log line: the CRM shows the corrected value
  // either way, so a push that failed is invisible on the very screen someone
  // would go to to check it. Retrying is safe to repeat — both AMS endpoints
  // upsert on the record's GUID.
  var failedPushes = [];

  function loadFailedPushes(){
    pull('/api/ams/failed-pushes').then(function(d){
      if (!d || d._error || d.unavailable) return;
      var next = d.failed || [];
      var changed = next.length !== failedPushes.length;
      failedPushes = next;
      if (changed) render();
    });
  }

  function renderFailedBanner(){
    if (!failedPushes.length) return '';
    var rows = failedPushes.slice(0, 5).map(function(f){
      var fields = Object.keys(((f.payload || {}).crm_fields) || {}).join(', ');
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #F3E3DC">'
        + '<span style="flex:1;min-width:0;font-size:12.5px;color:#3D4149">'
          + '<b style="font-weight:600">'+esc(f.object_type)+'</b> · '+esc(fields || 'change')
          + '<span style="color:#9A9EA6"> — '+esc(String(f.last_error || 'no reason recorded').slice(0,90))+'</span>'
        + '</span>'
        + '<span style="font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#A6A9AF;white-space:nowrap">'+esc(f.object_id)+'</span>'
        + '<span data-retry="'+esc(f.id)+'" style="font-size:11.5px;font-weight:600;color:#fff;background:#B4231F;border-radius:7px;padding:5px 11px;cursor:pointer;white-space:nowrap">Retry</span>'
      + '</div>';
    }).join('');
    return '<div style="background:#FBE9E7;border:1px solid #F0D4CE;border-radius:12px;padding:12px 15px;margin-bottom:16px">'
      + '<div style="font-size:12.5px;font-weight:700;color:#B4231F">'
        + failedPushes.length + ' correction' + (failedPushes.length===1?'':'s') + " didn't reach NowCerts"
      + '</div>'
      + '<div style="font-size:11.5px;color:#9A6B65;margin-top:2px">Saved in the CRM. NowCerts still shows the old value.</div>'
      + rows
    + '</div>';
  }

  function retryPush(queueId){
    fetch('/api/ams/failed-pushes/'+encodeURIComponent(queueId)+'/retry', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ retried_by: actingAs() })
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if (!res.ok || !res.j.pushed) {
          alert('Still not synced:\n' + ((res.j && (res.j.detail || res.j.error)) || 'unknown'));
        }
        loadFailedPushes();
      });
  }

  // A CRM sub-view: header, then a table of whatever the endpoint returned.
  // Never renders a placeholder row — an empty book says it is empty.
  function crmTable(key){
    var cfg = CRM_VIEWS[key], d = crmData[key] || {};
    var st = listFor(key);
    var grid = 'display:grid;grid-template-columns:repeat('+cfg.cols.length+',minmax(0,1fr));gap:12px;';

    var body, shown = [], total = 0;
    if(d.loading || (!d.rows && !d.error)){
      body = '<div style="padding:26px 18px;font-size:12.5px;color:#96999F">Loading '+cfg.label.toLowerCase()+'…</div>';
    } else if(d.error){
      body = '<div style="padding:26px 18px;font-size:12.5px;color:#B4231F">Couldn\'t load '+cfg.label.toLowerCase()+' — '+esc(d.error)+'</div>';
    } else if(!d.rows.length){
      body = '<div style="padding:26px 18px;font-size:12.5px;color:#96999F">No '+cfg.label.toLowerCase()+' in the book.</div>';
    } else {
      var visible = liveFilter(key, d.rows);
      total = visible.length;
      // Clamp the page: sorting, filtering or a reload can leave you past the end.
      var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (st.page > pages - 1) st.page = pages - 1;
      shown = sortRows(visible, cfg.cols, st).slice(st.page * PAGE_SIZE, (st.page + 1) * PAGE_SIZE);
      body = shown.map(function(r){
        // Clients open a 360; cases, tasks and pipeline rows open the card that
        // edits them. The rest are still read-only lists.
        var open = ' style="';
        if (key === 'clients' && r.nowcerts_insured_guid) {
          open = ' data-client="'+esc(r.nowcerts_insured_guid)+'" style="cursor:pointer;';
        } else if ((key === 'cases' || key === 'tasks') && r.id) {
          open = ' data-work="'+(key === 'tasks' ? 'task' : 'case')+':'+esc(r.id)+'" style="cursor:pointer;';
        } else if (key === 'pipeline' && r.id) {
          open = ' data-deal="'+esc(r.id)+'" style="cursor:pointer;';
        // Only OUR leads open — a NowCerts prospect has no CRM row to edit.
        } else if (key === 'leads' && r.id && r.source !== 'nowcerts') {
          open = ' data-lead="'+esc(r.id)+'" style="cursor:pointer;';
        } else if (key === 'policies' && r.policy_guid) {
          open = ' data-policyrow="'+esc(r.policy_guid)+'" style="cursor:pointer;';
        }
        return '<div class="rowh"'+open+grid+'padding:12px 18px;border-bottom:1px solid #F2F2EE;align-items:center">'
          + cfg.cols.map(function(c){ return crmCell(r, c); }).join('')
        + '</div>';
      }).join('');
    }
    var count = d.rows ? total : null;
    var card = '';
    if (workOpen && (key === 'cases' || key === 'tasks')
        && workOpen.kind === (key === 'tasks' ? 'task' : 'case')) card = renderWorkCard();
    else if (key === 'pipeline') card = renderDealCard();
    else if (key === 'leads' && leadOpen) card = renderLeadCard();
    else if (key === 'policies' && policyOpen) card = renderPolicyCard();
    if (card) card = '<div style="margin-bottom:16px">' + card + '</div>';

    // Anything you can add from a list gets its button next to the count, where
    // you are already looking after finding it is not there.
    var addBtn = '';
    if (key === 'pipeline') {
      // The board is the pipeline's natural shape; the table is still there for
      // sorting and paging, which a board cannot do.
      var tab = 'font-size:12px;font-weight:600;border-radius:8px;padding:6px 12px;cursor:pointer;';
      var sp = splitDeals(d.rows || []);
      // Which pipeline you are looking at comes first — it changes what every
      // column below it means.
      var kindTab = function(k, label, n){
        var on = pipelineKind === k;
        return '<span data-kind="'+k+'" style="'+tab
          + (on ? 'color:#fff;background:#16233F' : 'color:#3D4149;background:#fff;border:1px solid #E6E6E2')
          + '">'+label+' · '+n+'</span>';
      };
      addBtn = '<div style="display:flex;align-items:center;gap:8px">'
        + (pipelineBoard
            ? kindTab('new_business','New business', sp.new_business.length)
              + kindTab('renewal','Renewals', sp.renewal.length)
              + '<span style="width:1px;height:20px;background:#E2E1DC"></span>'
            : '')
        + '<span data-board="board" style="'+tab+(pipelineBoard?'color:#fff;background:#3D4149':'color:#3D4149;background:#fff;border:1px solid #E6E6E2')+'">Board</span>'
        + '<span data-board="table" style="'+tab+(pipelineBoard?'color:#3D4149;background:#fff;border:1px solid #E6E6E2':'color:#fff;background:#3D4149')+'">Table</span>'
        + '<span data-deal="new" style="'+tab+'color:#fff;background:#16233F">Add deal +</span>'
      + '</div>';
    } else if (key === 'policies') {
      addBtn = '<span data-policyrow="new" style="font-size:12px;font-weight:600;color:#fff;background:#16233F;border-radius:8px;padding:7px 13px;cursor:pointer">Add policy +</span>';
    } else if (key === 'leads') {
      // If the NowCerts half of the list failed, say so. A short list that looks
      // complete is worse than a short list that admits what is missing.
      var lerr = (d.rows && d.raw && d.raw.ams_error) ? d.raw.ams_error : null;
      addBtn = '<div style="display:flex;align-items:center;gap:10px">'
        + (lerr ? '<span title="'+esc(lerr)+'" style="font-size:11.5px;color:#B9822A">NowCerts prospects unavailable — showing ours only</span>' : '')
        + '<span data-lead="new" style="font-size:12px;font-weight:600;color:#fff;background:#16233F;border-radius:8px;padding:7px 13px;cursor:pointer">Add lead +</span>'
      + '</div>';
    }

    var listBlock = (key === 'pipeline' && pipelineBoard)
      ? renderKanban()
      : '<div class="crm-table-scroll" style="background:#fff;border:1px solid #E7E7E4;border-radius:13px">'
          + '<div style="'+grid+'padding:11px 18px;background:#FAFAF7;border-bottom:1px solid #EFEFEB;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#96999F;font-weight:700">'
            + sortHeader(key, cfg.cols)
          + '</div>'
          + body
          + pager(key, total)
        + '</div>';

    return '<div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#96999F;font-weight:700">Live from Hermes</div>'
      + '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:5px 0 18px">'
        + '<div>'
          + '<h1 style="font-family:\'Newsreader\',Georgia,serif;font-size:28px;color:#1B1D22;margin:0 0 3px;font-weight:500">'+cfg.label+'</h1>'

          + '</p>'
        + '</div>'
        + addBtn
      + '</div>'
      + renderFailedBanner()
      + liveChips(key, d.rows || [])
      + card
      + listBlock;
  }

  // A panel with no rows says why. The sample datasets that used to fill this
  // gap were removed: invented clients and premiums are indistinguishable from
  // real ones, and this is what the agency works from.
  function panelEmpty(source, label){
    var msg = sources[source]==='live'
      ? 'No '+label+' right now.'
      : 'Loading '+label+'\u2026';
    return '<div style="padding:28px 18px;font-size:12.5px;color:#96999F">'+msg+'</div>';
  }

  function renderCRM(){
    var view = state.crmView || 'workspace';
    var nav = crmNavRaw.map(function(n){
      var on = n.view === view;
      var color = on?'#FFFFFF':'#B9C7DF', bg = on?'rgba(255,255,255,.10)':'transparent', weight = on?600:500;
      // Every entry now carries a handler: a sub-view, a jump to the screen that
      // owns that work, or the assistant. They used to be inert divs.
      var attr = n.view ? ' data-crmview="'+n.view+'"' : (n.go ? ' data-go="'+n.go+'"' : ' data-ai="open"');
      return '<div class="crm-nav-item"'+attr+' role="button" tabindex="0" style="display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;cursor:pointer;color:'+color+';background:'+bg+';font-size:13px;font-weight:'+weight+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+n.d+'"></path></svg><span>'+n.label+'</span></div>';
    }).join('');

    var kpis = crmKpis.map(function(k){
      return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:11px;padding:13px 15px"><div style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#96999F;font-weight:700">'+k.label+'</div><div style="font-family:\'Newsreader\',Georgia,serif;font-size:25px;color:#1B1D22;margin-top:4px;line-height:1">'+k.value+'</div><div style="font-size:11px;color:#9A9EA6;margin-top:3px">'+k.sub+'</div></div>';
    }).join('');

    var cards = crmCardsRaw.map(function(c){
      var openLabel = c.to==='finance'?'Reconcile in Finance ↗':(c.to?'Open '+c.name+' ↗':'Open →');
      var openColor = c.to==='finance'?'#16233F':'#2563EB';
      var go = c.to ? ' data-go="'+c.to+'"' : '';
      return '<div class="tile"'+go+' style="background:#fff;border:1px solid #E7E7E4;border-radius:12px;padding:16px 17px;cursor:pointer"><div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-family:\'Newsreader\',Georgia,serif;font-size:19px;color:#1B1D22">'+c.name+'</span><span style="font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;color:#2563EB;background:#E9EFFC">'+c.count+'</span></div><div style="font-size:12px;color:#868A92;margin:6px 0 14px">'+c.desc+'</div><div style="font-size:12.5px;font-weight:600;color:'+openColor+'">'+openLabel+'</div></div>';
    }).join('');

    return '<div class="crm-shell">'
      + '<div class="crm-sidebar">'
        + '<div class="crm-brand" style="padding:0 8px 14px"><div style="font-family:\'Newsreader\',Georgia,serif;font-size:21px;color:#fff;line-height:1">RSG</div><div style="font-size:9px;letter-spacing:.16em;color:#9FB0CB;font-weight:700;margin-top:3px">AGENCY CRM</div></div>'
        + '<div class="crm-subnav">'+nav+'</div>'
        + '<div class="crm-connection" style="margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px 9px 0;border-top:1px solid rgba(255,255,255,.08)"><span style="width:7px;height:7px;border-radius:50%;background:#3DDC84;display:inline-block"></span><div><div style="font-size:11px;color:#CFE3D6;font-weight:600">Supabase connected</div><div style="font-size:9.5px;color:#6E9179">Hermes mirrors · live</div></div></div>'
      + '</div>'
      // position:relative matters: the client 360 is an inset:0 overlay, and
      // without a positioned parent here it resolves against the CRM root and
      // paints straight over this screen's own sidebar.
      // padding-bottom clears the Ask Hermes button, which floats over the
      // bottom-right of this pane. Without it the last thing on a scrolled list —
      // the pager, whose Next sits in exactly that corner — is unclickable.
      + '<div class="crm-pane">'
        + (view === 'client' ? renderClientDetail()
          : view !== 'workspace' ? crmTable(view)
          : '<div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#96999F;font-weight:700">Live Supabase model</div>'
            + '<h1 style="font-family:\'Newsreader\',Georgia,serif;font-size:28px;color:#1B1D22;margin:5px 0 3px;font-weight:500">Agency workspace</h1>'
            + '<p style="font-size:12.5px;color:#787C84;margin:0 0 20px;max-width:560px;line-height:1.5">Clients and Policies are read-only mirrors; Pipeline, Cases, and Tasks write back to Supabase. Renewals and Commissions have their own workspaces.</p>'
            + '<div class="crm-kpis">'+kpis+'</div>'
            + '<div class="crm-cards">'+cards+'</div>')
      + '</div>'
    + '</div>';
  }

  // What has been taken off the list, and who took it off. Shown only when
  // there is something to show — a permanently empty "Removed" section teaches
  // people to scroll past the one place their mistake is recoverable.
  function removedRenewalsPanel(){
    if (!renewalRemoved.length) return '';
    return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:16px 20px;margin-top:18px">'
      + '<div style="font-family:\'Newsreader\',Georgia,serif;font-size:16px;color:#1B1D22">Removed from the worklist</div>'
      + '<div style="font-size:12px;color:#787C84;margin:3px 0 10px;line-height:1.5">These stay off the list through every nightly refresh. Their history is intact — put one back and it returns to the worklist.</div>'
      + renewalRemoved.map(function(o){
          return '<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #F2F2EE">'
            + '<span style="font-size:13px;color:#25282E;font-weight:500;min-width:130px">'+esc(o.entity_key||'—')+'</span>'
            + '<span style="flex:1;min-width:0;font-size:12px;color:#6B7078;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'

          + '</div>';
        }).join('')
    + '</div>';
  }

  // The filter chips carried hardcoded counts — "All · 38", "Mine · 16" — beside
  // live rows, so the numbers contradicted the list under them and none of them
  // filtered anything. They now count the rows actually loaded and select them.
  // "Mine" is absent deliberately: renewals carry no owner, and a chip that
  // cannot answer its own question is worse than no chip.
  // Sortable columns for the worklist. The accessors read the raw renewal, not
  // the formatted cell: premium as a number, the renewal date as a date, days
  // as an integer.
  var RENEWAL_COLS = [
    ['client','Client', null, function(r){ return (r._raw||{}).client_name; }],
    ['line','Line', null, function(r){ var x=r._raw||{}; return x.lines_of_business || x.policy_number; }],
    ['premium','Premium','money', function(r){ return (r._raw||{}).premium_current; }],
    ['period','Policy period','date', function(r){ var x=r._raw||{}; return x.effective_date || x.expiration_date; }],
    ['days','Renews in','money', function(r){ return (r._raw||{}).days_until; }],
    ['status','Status', null, function(r){ return (r._raw||{}).risk_status; }],
  ];

  var renewalFilter = 'all';
  var RENEWAL_FILTERS = [
    ['all',    'All',        function(){ return true; }],
    ['risk',   'At risk',    function(r){ return /CRITICAL|AT_RISK/.test((r._raw||{}).risk_status||''); }],
    ['week',   'This week',  function(r){ var d=(r._raw||{}).days_until; return d!=null && d<=7; }],
    ['fixed',  'Corrected',  function(r){ return !!((r._raw||{})._overridden); }],
  ];

  function renewalFilterChips(rows){
    return RENEWAL_FILTERS.map(function(f){
      var n = rows.filter(f[2]).length;
      // A filter with nothing behind it stays visible but plainly empty, rather
      // than disappearing and making the set of chips move around.
      var on = renewalFilter === f[0];
      var style = on ? 'color:#fff;background:#C2410C'
                     : 'color:#3D4149;background:#fff;border:1px solid #E6E6E2';
      return '<span data-renfilter="'+f[0]+'" style="font-size:12px;font-weight:600;border-radius:999px;padding:5px 13px;cursor:pointer;'+style+'">'
        + f[1] + ' · ' + n + '</span>';
    }).join('');
  }

  function renderRenewals(){
    var kpis = renewalKpis.map(function(k){
      return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:11px;padding:14px 16px"><div style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#96999F;font-weight:700">'+k.label+'</div><div style="font-family:\'Newsreader\',Georgia,serif;font-size:26px;color:'+k.color+';margin-top:4px;line-height:1">'+k.value+'</div><div style="font-size:11px;color:#9A9EA6;margin-top:3px">'+k.sub+'</div></div>';
    }).join('');

    var chosen = RENEWAL_FILTERS.filter(function(f){ return f[0] === renewalFilter; })[0]
              || RENEWAL_FILTERS[0];
    // The card resolves its record by row index, so what is displayed and what
    // is indexed have to be the same array.
    renewalShown = sortedFor('renewals', RENEWAL_COLS, renewalRows.filter(chosen[2]));

    var rows = renewalShown.map(function(r,i){
      // Live rows carry their own status colors; sample rows look them up.
      var sc = r.statusColor || (rStat[r.status]||['#6B7078','#EFEFEC'])[0];

    }).join('');

    var list = '<div style="position:absolute;inset:0;overflow:auto;padding:26px 30px '+AI_FAB_CLEARANCE+'">'

        + '<div style="display:flex;gap:7px">' + renewalFilterChips(renewalRows)

        + '<span style="font-size:12px;color:#96999F">Sorted by soonest</span>'
      + '</div>'
      + '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;overflow:hidden">'
        + '<div style="display:grid;grid-template-columns:1.5fr 1fr .8fr 1.4fr .8fr .9fr;gap:12px;padding:11px 18px;background:#FAFAF7;border-bottom:1px solid #EFEFEB;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#96999F;font-weight:700">' + sortHeader('renewals', RENEWAL_COLS) + '</div>'

    var detailOn = state.detail;

    var live = selRenewal;
    var dv = live ? {
      client: live.client_name || '—',

      statusColor: (renewalStatusMap[live.risk_status]||['—','#6B7078','#EFEFEC'])[1],
      statusBg: (renewalStatusMap[live.risk_status]||['—','#6B7078','#EFEFEC'])[2],
      renews: (shortDate(live.expiration_date)||live.expiration_date||'—')+(live.days_until!=null?' ('+live.days_until+'d)':''),
      contact:'—', phone:'', email:'',
      address:'Insured detail loads from NowCerts on demand.',
      note: live.ai_strategy_notes || 'No strategy note on file.'
    } : acme;

    var facts;
    if(live){
      // What the desk works: the premiums, the risk call, when we last spoke.
      // Policy number, expiration and the change percentage are not fields —
      // the first two identify the renewal, the third is computed from the two
      // premiums, so it moves when they do.
      var readOnly = [
        { label:'Policy #', value:live.policy_number||'—' },
        { label:'Carrier', value:live.carrier||'—' },
        // Both ends of the term, from the book. Expiration alone cannot tell you
        // whether this is an annual policy up for its first renewal or a
        // six-month one you have already renewed twice.
        { label:'Effective', value:shortDate(live.effective_date)||'—' },
        { label:'Expiration', value:shortDate(live.expiration_date)||live.expiration_date||'—' },
        { label:'Renews in', value:live.days_until!=null?(live.days_until+' days'):'—' },
        { label:'Change', value:live.increase_percentage!=null?((live.increase_percentage>0?'+':'')+Number(live.increase_percentage).toFixed(1)+'%'):'—' },

      facts = '<div style="grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:11px 24px;padding:11px 13px;background:#FAFAF7;border:1px solid #EFEFEB;border-radius:10px">'
        + readOnly.map(function(f){ return '<div><div style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#96999F;font-weight:700">'+f.label+'</div><div style="font-size:13.5px;color:#25282E;margin-top:3px">'+f.value+'</div></div>'; }).join('')
        + '</div>'
        + RENEWAL_FIELDS.map(function(f){
            // What the AMS said before somebody corrected it, so the card shows

            var o = {}; for (var k in (f[2]||{})) o[k] = f[2][k];
            o.overridden = live._overridden || {};
            return editField('renewal', live, f[0], f[1], o);
          }).join('');
    } else {
      facts = detailFacts.map(function(f){ return '<div><div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#96999F;font-weight:700">'+f.label+'</div><div style="font-size:13.5px;color:#25282E;margin-top:3px">'+f.value+'</div></div>'; }).join('');
    }

    var covsCard = live
      ? '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px"><span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">Coverages &amp; activity</span><div style="font-size:13px;color:#6B7078;margin-top:10px;line-height:1.5">Coverage schedule and the full activity timeline load from NowCerts (AMS) on demand — this list view is served live from the Renewals Cockpit.</div></div>'
      : ('<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px">'
          + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">Coverages</span>'
          + '<div style="margin-top:12px;border:1px solid #EFEFEB;border-radius:10px;overflow:hidden"><div style="display:grid;grid-template-columns:1.6fr 1.2fr .7fr;gap:12px;padding:9px 15px;background:#FAFAF7;border-bottom:1px solid #EFEFEB;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#96999F;font-weight:700"><span>Coverage</span><span>Limit</span><span>Deductible</span></div>'
          + detailCoverages.map(function(c){ return '<div style="display:grid;grid-template-columns:1.6fr 1.2fr .7fr;gap:12px;padding:11px 15px;border-bottom:1px solid #F2F2EE;font-size:13px;color:#25282E"><span style="font-weight:500">'+c.name+'</span><span style="color:#6B7078">'+c.limit+'</span><span style="color:#6B7078">'+c.ded+'</span></div>'; }).join('')
          + '</div></div>'
          + '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px">'
          + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">Activity</span>'
          + '<div style="margin-top:12px;display:flex;flex-direction:column">'
          + detailTimeline.map(function(t){ return '<div style="display:flex;gap:12px;padding:9px 0;border-top:1px solid #F2F2EE"><span style="width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:'+t.color+'"></span><div style="flex:1"><div style="font-size:13px;color:#25282E;line-height:1.4">'+t.text+'</div></div><span style="font-size:11.5px;color:#A2A5AC;white-space:nowrap">'+t.when+'</span></div>'; }).join('')

    var detail = '<div style="'+detailStyle+'">'

  function askHermes(text){

    aiBusy = true; render();
    fetch('/api/ask', {

      .then(function(d){ aiThread.push({ who:'hermes', text:(d && (d.message || d.detail)) || 'No answer came back.' }); })
      .catch(function(e){ aiThread.push({ who:'hermes', text:'Couldn\'t reach Hermes — '+((e && e.message) || 'request failed') }); })
      .then(function(){ aiBusy = false; render(); setTimeout(focusAi, 0); });

  // Every editable surface writes through this one handler. A field's
  // data-efield carries "<kind>:<field>", so the only thing that differs per
  // surface is which record the typed value is compared against to decide

  function editSubject(kind){

  document.getElementById('app').addEventListener('input', function(e){

    if(!t || !t.getAttribute) return;
    // The note box is not a record field — it is held on its own so a re-render
    // (which the Add-note button's enabled state triggers) does not lose it.
    var noteBox = t.getAttribute('data-leadnote') ? 'lead'
                : t.getAttribute('data-dealnote') ? 'deal' : null;
    if(noteBox){
      var had = (noteBox === 'lead' ? leadNoteDraft : dealNoteDraft).trim().length > 0;
      if(noteBox === 'lead') leadNoteDraft = t.value; else dealNoteDraft = t.value;
      var now = (noteBox === 'lead' ? leadNoteDraft : dealNoteDraft).trim().length > 0;
      if(now !== had){
        var at = t.selectionStart;
        render();
        var again = document.querySelector('[data-'+noteBox+'note]');
        if(again){ again.focus(); try{ again.setSelectionRange(at, at); }catch(err){} }
      }
      return;
    }
    var id = t.getAttribute('data-efield');
    if(!id) return;
    var parts = id.split(':'), kind = parts[0], f = parts[1];
    var buf = edits[kind];
    if(!buf) return;
    var rec = editSubject(kind);
    var original = rec[f] == null ? '' : String(rec[f]);
    // A date input can only ever hold YYYY-MM-DD. Compared against a stored
    // timestamp the field would read as changed the moment it was rendered, and
    // every card with a date on it would open already dirty.
    if(t.type === 'date') original = original.slice(0, 10);
    var wasDirty = Object.keys(buf).length > 0;
    if(t.value === original) delete buf[f];
    else buf[f] = t.value;
    // Re-render only when the Save button needs to appear or disappear —
    // re-rendering per keystroke would blur the input mid-typing.
    if((Object.keys(buf).length > 0) !== wasDirty){
      var pos = t.selectionStart;
      render();
      var again = document.querySelector('[data-efield="'+id+'"]');
      if(again){ again.focus(); try{ again.setSelectionRange(pos, pos); }catch(err){} }

  // Escape backs out of whatever you are in, innermost first, one layer per
  // press — the keyboard equivalent of the ‹ link, on every panel rather than
  // the three it used to cover. Several of these panels are opened by clicking a
  // row and closed only by a small ‹ in one corner; on the embeds that corner is
  // above an iframe that has swallowed the pointer.
  //
  // On document, not #app: after a save the focused input is gone and the
  // keystroke would otherwise land on <body> and do nothing.
  //
  // The ones with unsaved buffers go through their own close functions, so
  // Escape asks about discarding exactly as the × does.
  function backOut(){
    if(state.aiOpen){ setState({ aiOpen:false }); return true; }
    if(workOpen) return closeWork();
    if(policyOpen) return closePolicy(false);
    if(dealOpen) return closeDeal();
    if(leadOpen) return closeLead();
    // Renewal detail: its own edit buffer, so it asks like the rest.
    if(state.screen === 'renewals' && state.detail){
      if(!unsavedOk(Object.keys(edits.renewal).length)) return false;
      edits.renewal = {}; selRenewal = null;
      setState({ detail:false });
      return true;
    }
    if(state.screen === 'cases' && state.caseDetail){ setState({ caseDetail:false }); return true; }
    if(state.carrierEmbed){ setState({ carrierEmbed:false }); return true; }
    if(state.financeDetail){ selFinance = null; setState({ financeDetail:false }); return true; }
    if(state.financeEmbed){ setState({ financeEmbed:false }); return true; }
    if(state.screen === 'crm' && state.client) return closeClient();
    if(state.screen === 'crm' && state.crmView !== 'workspace'){
      setState({ crmView:'workspace' });
      return true;
    }
    if(state.screen !== 'home'){ setState({ screen:'home' }); return true; }
    return false;
  }

  });

        else if(ek === 'deal') closeDeal();

        else if(ek === 'policy') savePolicyEditsThenPush();

      if(act === 'delete'){

    if(el.hasAttribute('data-caseopen')){

    if(el.hasAttribute('data-client')){

    if(el.hasAttribute('data-policy')){

    if(el.hasAttribute('data-crmview')){
