<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSG Agency Portal</title>
<!-- Installable web app. Requires a secure context, which the tailnet HTTPS URL
     (https://hermes-gretch.tail1cbc83.ts.net:8447) provides; reaching the portal
     over plain http will still work but will not offer to install. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16233F">
<meta name="application-name" content="RSG Portal">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RSG Portal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#F3F4F6;font-family:'Instrument Sans',system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#2563EB;text-decoration:none}a:hover{color:#1d4ed8}
.tile{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,25,40,.10);border-color:#d7d7d2}
.railitem{transition:background .12s ease}
.rowh:hover{background:#FAFAF7}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  // ------------------------------------------------------------------
  // State
  // ------------------------------------------------------------------
  var state = { screen:'home', user:'lamar', done:{}, aiOpen:false, detail:false, caseDetail:false, carrierEmbed:false, financeEmbed:false, crmView:'workspace', client:null };
  function setState(patch){ Object.assign(state, patch); render(); }

  // Per-section data source. Starts 'pending' and only ever becomes 'live' — the
  // sample datasets were deleted, so a panel that hasn't loaded says so rather
  // than showing invented clients and premiums.
  var sources = { renewals:'pending', tasks:'pending', commissions:'pending', cases:'pending', carrier:'pending', workspace:'pending' };
  var financeOwed = null;   // summed from live commission rows
  var taskCount = 0;        // live task count across the team

  // Live records are interpolated straight into markup, and a client name is
  // free text someone typed into an AMS — escape it.
  function esc(v){
    return (v==null?'':String(v)).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var selRenewal = null;  // live renewal row chosen for the detail overlay
  var carrierData = null; // cached carrier directory from carrierhub
  // Full apps embedded in the hybrid workspaces, reachable over the tailnet.
  //
  // These MUST be https. The portal is served at https://…ts.net:8447, and a
  // browser silently refuses to load an http iframe inside an https page (mixed
  // content) — the pane just goes blank with nothing but a console warning. The
  // previous http://100.75.67.72:{3200,3100} values were blocked exactly that
  // way, which is why Carrier and Finance never opened here.
  //
  // `tailscale serve` already publishes both over TLS on this host:
  //   :8445 -> 127.0.0.1:3200  carrierhub
  //   :8446 -> 127.0.0.1:3300  commission tracker (the *tailnet* container,
  //            which auto-logs in on the shared account — :3100 is the
  //            public-facing one and would have stopped at a login screen)
  // Both answer with framing allowed (:8446 sends frame-ancestors *).
  //
  // https embeds are also correct when the portal itself is reached over plain
  // http at 100.75.67.72:3400 — a secure frame in an insecure page is fine.
  var TAILNET_BASE = 'https://hermes-gretch.tail1cbc83.ts.net';
  var CARRIERHUB_EMBED = TAILNET_BASE + ':8445/';
  var COMMISSION_EMBED = TAILNET_BASE + ':8446/';
  // NextCloud (Files + Talk). Framing is allowed only from the tailnet HTTPS
  // origin (frame-ancestors https://*.tail1cbc83.ts.net:*), so these panes load
  // when the portal is opened at https://hermes-gretch.tail1cbc83.ts.net:8447/.
  var NEXTCLOUD_BASE = 'https://nextcloud-x6wle-u69864.vm.elestio.app';
  var STORAGE_EMBED = NEXTCLOUD_BASE + '/apps/files/';
  var TALK_EMBED = NEXTCLOUD_BASE + '/apps/spreed/';
  // Deck — the shared boards. Same origin and same framing allowance as Files
  // and Talk, so it embeds on the tailnet https origin exactly like they do.
  var DECK_EMBED = NEXTCLOUD_BASE + '/apps/deck/';
  // True when the portal itself is served from the tailnet HTTPS origin that
  // NextCloud allows to frame it. Over IP:3400 the NextCloud panes are blocked.
  function onTailnetHttps(){ try { return location.protocol==='https:' && /\.ts\.net$/i.test(location.hostname); } catch(e){ return false; } }

  // Full-pane embed for a top-level workspace (thin header + iframe, no back link).
  function embedScreen(title, src, subtitle, accent){
    var blocked = !onTailnetHttps();
    var note = blocked
      ? '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px"><div style="max-width:460px;text-align:center"><div style="font-family:\'Newsreader\',Georgia,serif;font-size:20px;color:#1B1D22;margin-bottom:8px">'+title+' loads over the secure tailnet URL</div><div style="font-size:13px;color:#6B7078;line-height:1.55">NextCloud only allows embedding from the Tailscale HTTPS address. Open the portal at<br><a href="https://hermes-gretch.tail1cbc83.ts.net:8447/" style="color:#2563EB">https://hermes-gretch.tail1cbc83.ts.net:8447/</a><br>to use '+title+' here, or <a href="'+src+'" target="_blank" rel="noopener" style="color:#2563EB">open '+title+' in a new tab ↗</a>.</div></div></div>'
      : '<iframe src="'+src+'" style="flex:1;width:100%;border:0" title="'+title+'" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"></iframe>';
    return '<div style="position:absolute;inset:0;display:flex;flex-direction:column;background:#fff">'
      + '<div style="height:42px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;background:#FBF9F4;border-bottom:1px solid #ECEAE2">'
        + '<span style="width:8px;height:8px;border-radius:3px;background:'+(accent||'#4B77BE')+'"></span>'
        + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:15px;color:#1B1D22">'+title+'</span>'
        + '<span style="font-size:11.5px;color:#96999F">'+(subtitle||'via NextCloud')+'</span>'
        + '<a href="'+src+'" target="_blank" rel="noopener" style="margin-left:auto;font-size:11.5px;color:#2563EB">Open in new tab ↗</a>'
      + '</div>'
      + note
    + '</div>';
  }

  // An http iframe inside an https page is dropped by the browser with no visible
  // error — the operator just gets a white rectangle. Catch that here and say so,
  // rather than shipping a blank pane and calling it an embed.
  function mixedContent(src){
    try { return location.protocol === 'https:' && /^http:\/\//i.test(src); }
    catch(e){ return false; }
  }
  function blockedNote(title, src){
    return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px">'
      + '<div style="max-width:460px;text-align:center">'
        + '<div style="font-family:\'Newsreader\',Georgia,serif;font-size:20px;color:#1B1D22;margin-bottom:8px">'+title+' can\'t be embedded over http</div>'
        + '<div style="font-size:13px;color:#6B7078;line-height:1.55">This portal is served over https, and the browser blocks an insecure frame inside it. '
          + '<a href="'+src+'" target="_blank" rel="noopener" style="color:#2563EB">Open '+title+' in a new tab ↗</a></div>'
      + '</div></div>';
  }

  // Shared inline-embed pane: header bar (back + open-in-new-tab) + iframe.
  function embedPane(backLabel, src, dataAttr, subtitle){
    var body = mixedContent(src)
      ? blockedNote(backLabel, src)
      : '<iframe src="'+src+'" style="flex:1;width:100%;border:0" title="'+backLabel+'" allow="clipboard-read; clipboard-write; fullscreen"></iframe>';
    return '<div style="position:absolute;inset:0;display:flex;flex-direction:column;background:#fff">'
      + '<div style="height:42px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;background:#FBF9F4;border-bottom:1px solid #ECEAE2">'
        + '<div '+dataAttr+'="close" style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#6B7078;cursor:pointer;font-weight:600">‹ '+backLabel+'</div>'
        + '<div style="width:1px;height:18px;background:#E2E1DC"></div>'
        + '<span style="font-size:11.5px;color:#96999F">'+(subtitle||'Full app · live')+'</span>'
        + '<a href="'+src+'" target="_blank" rel="noopener" style="margin-left:auto;font-size:11.5px;color:#2563EB">Open in new tab ↗</a>'
      + '</div>'
      + body
    + '</div>';
  }
  function anyLive(){ return Object.keys(sources).some(function(k){ return sources[k]==='live'; }); }

  // ------------------------------------------------------------------
  // Static data (ported from the design's renderVals)
  // ------------------------------------------------------------------
  var reg = [
    { key:'crm',      mono:'CR', railLabel:'CRM',      name:'CRM',           accent:'#2F6B4F', tint:'#EAF1EC', desc:'Client book — accounts, policies, cases', stat:'—',     stat2:'—' },
    { key:'renewals', mono:'RN', railLabel:'Renewals', name:'Renewals',      accent:'#C2410C', tint:'#F7EAE1', desc:'Retention & renewal worklist',            stat:'—',          stat2:'—' },
    { key:'carrier',  mono:'CH', railLabel:'Carrier',  name:'Carrier Hub',   accent:'#2563EB', tint:'#E9EFFC', desc:'Appetite, appointments & submissions',    stat:'—',stat2:'—' },
    { key:'intake',   mono:'IG', railLabel:'Intake',   name:'Intake',        accent:'#B9822A', tint:'#F6EEDB', desc:'Evidence in, assessed & verified out',    stat:'—',               stat2:'writes locked' },
    { key:'cases',    mono:'CS', railLabel:'Cases',    name:'Tasks & Cases', accent:'#16233F', tint:'#E7EAF0', desc:'Service work — endorsements, claims, COIs',stat:'—',         stat2:'—' },
    { key:'finance',  mono:'CT', railLabel:'Finance',  name:'Finance',       accent:'#B9822A', tint:'#F7EEDB', desc:'Commissions — expected vs received',      stat:'—',     stat2:'—' },
    { key:'storage',  mono:'ST', railLabel:'Storage',  name:'Storage',       accent:'#4B77BE', tint:'#E9EEF7', desc:'NextCloud files & shared documents',      stat:'NextCloud',       stat2:'synced' },
    { key:'team',     mono:'TM', railLabel:'Team',     name:'Team Chat',     accent:'#0F7B6C', tint:'#E4F1EF', desc:'Chat, questions & document sharing',      stat:'—',               stat2:'channels' },
    { key:'deck',     mono:'DK', railLabel:'Deck',     name:'Deck',          accent:'#6D28D9', tint:'#EDE7FB', desc:'Shared boards — cards, lists & due dates', stat:'—',               stat2:'NextCloud Deck' },
    { key:'sops',     mono:'SO', railLabel:'SOPs',     name:'SOPs',          accent:'#8E3B5B', tint:'#F5E9EE', desc:'Standard operating procedures',           stat:'—',               stat2:'documents' },
  ];

  var people = { lamar:{ name:'Lamar', initial:'L', accent:'#16233F' }, gretchen:{ name:'Gretchen', initial:'G', accent:'#8E3B5B' } };
  // Filled from /api/tasks. Invented work is worse than an empty list: a
  // fabricated "Call Acme Roofing — renewal at risk" is indistinguishable from a
  // real one, and this is the screen someone works from in the morning.
  var tasksByUser = { lamar:[], gretchen:[] };

  // Placeholders until /api/renewals + /api/commissions + /api/tasks land.
  var homeKpis = [
    { label:'Renewals due', value:'—', sub:'need attention this week', color:'#2F6B4F' },
    { label:'Money to chase', value:'—', sub:'commission shorts', color:'#B9822A' },
    { label:'Open cases', value:'—', sub:'agency service work', color:'#16233F' },
    { label:'Open tasks', value:'—', sub:'assigned across the team', color:'#0F7B6C' },
  ];

  // CRM
  // `view` opens a CRM sub-view; `go` jumps to a top-level portal screen that
  // already owns that work. These used to be inert <div>s with a pointer cursor
  // and no handler, which is why clicking anything in here did nothing.
  var crmNavRaw = [
    { label:'Workspace', view:'workspace', d:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
    { label:'Clients',   view:'clients',   d:'M4 20a8 8 0 0 1 16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8' },
    { label:'Policies',  view:'policies',  d:'M7 3h7l5 5v13H7zM14 3v5h5' },
    { label:'Pipeline',  view:'pipeline',  d:'M3 5h18l-7 8v6l-4-2v-4z' },
    { label:'Quotes',    view:'quotes',    d:'M7 3h7l5 5v13H7zM14 3v5h5M9 13h6M9 17h4' },
    { label:'Cases',     view:'cases',     d:'M4 8h16v11H4zM9 8V5h6v3' },
    { label:'Tasks',     view:'tasks',     d:'M5 6h11M5 12h11M5 18h7M18 15l2 2 4-4' },
    { label:'Leads',     view:'leads',     d:'M4 20V10M10 20V4M16 20v-7M22 20H2' },
    { label:'Ask Hermes',ai:true,          d:'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z' },
  ];
  // Placeholders only — every one of these is replaced by /api/workspace-stats on
  // load. They shipped as hardcoded strings (414 clients, 614 policies) against a
  // book that actually holds 441 policies, so the screen read as authoritative
  // while being decorative. Kept solely so the layout has something to draw
  // before the first response lands.
  var crmKpis = [
    { label:'Clients', value:'—', sub:'canonical' }, { label:'Policies', value:'—', sub:'annualized' }, { label:'Renewals', value:'—', sub:'need attention' },
    { label:'Pipeline', value:'—', sub:'open opportunities' }, { label:'Open cases', value:'—', sub:'service work' }, { label:'Open tasks', value:'—', sub:'case-linked' },
  ];
  var crmCardsRaw = [
    { name:'Clients', count:'—', desc:'NowCerts insured records', to:'crm:clients' },
    { name:'Policies', count:'—', desc:'Coverage & premium mirrors', to:'crm:policies' },
    { name:'Renewals', count:'—', desc:'Own workspace ↗', to:'renewals' },
    { name:'Commissions', count:'—', desc:'Reconcile in Finance', to:'finance' },
    { name:'Pipeline', count:'—', desc:'Quote-to-bind workflow', to:'crm:pipeline' },
    { name:'Cases', count:'—', desc:'Agency service work', to:'crm:cases' },
  ];
  // Which CRM sub-view is open. 'workspace' is the overview above; the rest are
  // real tables fed by the endpoints server.js now proxies.
  var CRM_VIEWS = {
    workspace: { label:'Workspace' },
    clients:   { label:'Clients',  endpoint:'/api/clients',  key:'clients',
                 cols:[['insured_name','Client'],['client_type','Type'],['city','City'],['state','State'],['email','Email'],['phone','Phone']] },
    policies:  { label:'Policies', endpoint:'/api/policies', key:'policies',
                 cols:[['insured_name','Client'],['policy_number','Policy #'],['carrier','Carrier'],['lines_of_business','LOB'],['status','Status'],['expiration_date','Expires'],['annualized_premium','Annualized','money']] },
    pipeline:  { label:'Pipeline', endpoint:'/api/pipeline', key:'opportunities',
                 cols:[['insured_name','Client'],['line_of_business','LOB'],['stage','Stage'],['premium_estimate','Est. premium','money'],['carrier','Carrier'],['next_action','Next action']] },
    leads:     { label:'Leads',    endpoint:'/api/leads',    key:'leads',
                 cols:[['name','Lead'],['prospect_type','Type'],['city','City'],['state','State'],['email','Email'],['phone','Phone']] },
    quotes:    { label:'Quotes',   endpoint:'/api/quotes',   key:'quotes',
                 cols:[['insured_name','Client'],['line_of_business','LOB'],['carrier','Carrier'],['premium','Premium','money'],['quote_number','Quote #'],['effective_date','Effective','date'],['status','Status','chip']] },
    cases:     { label:'Cases',    endpoint:'/api/cases',    key:'cases',
                 cols:[['case_number','Case #'],['title','Subject'],['insured_name','Client'],['case_type','Type'],['status','Status','chip'],['priority','Priority','chip'],['owner_email','Owner','person'],['due_at','Due','date']] },
    tasks:     { label:'Tasks',    endpoint:'/api/tasks',    key:'tasks',
                 cols:[['title','Task'],['status','Status','chip'],['priority','Priority','chip'],['assignee','Assignee'],['due_at','Due','date'],['case_id','Scope','scope']] },
  };
  var crmData = {};      // view key -> rows | {_error}
  var clientData = null; // the open client's 360: record, policies, cases, tasks
  var policyOpen = null; // policy_guid of the policy being corrected, if any
  var workOpen = null;   // {kind:'task'|'case', id} — the work item being edited
  var renewalOpen = null;// id of the renewal whose detail is being edited
  // One in-progress buffer per editable surface: field -> typed value, before it
  // is saved. Several can be open at once (a client, one of their policies, and
  // a task on the same screen), so they are kept apart rather than pooled.
  var edits = { client:{}, policy:{}, work:{}, renewal:{} };

  // Renewals
  var renewalKpis = [
    { label:'Due in 30 days', value:'—', sub:'across all lines', color:'#1B1D22' },
    { label:'At risk', value:'—', sub:'no quote yet', color:'#B4231F' },
    { label:'Retention', value:'—', sub:'target 75%', color:'#2F6B4F' },
    { label:'Premium at renewal', value:'—', sub:'annualized', color:'#1B1D22' },
  ];
  var rStat = { 'At risk':['#B4231F','#FBE9E7'],'In progress':['#B9822A','#F7EEDB'],'Quoted':['#2563EB','#E9EFFC'],'Confirmed':['#2F6B4F','#EAF1EC'],'Not started':['#6B7078','#EFEFEC'] };
  var renewalRows = [];
  // Neutral placeholder for the renewal detail overlay before a row is picked.
  // Must keep every key the overlay reads — it dereferences these unguarded.
  var acme = { client:'—', line:'—', status:'—', statusColor:'#6B7078', statusBg:'#EFEFEC',
               renews:'—', priorPremium:'—', address:'Select a renewal to see the insured.',
               contact:'—', phone:'', email:'', note:'Select a renewal to see its strategy note.' };
  var detailFacts = [
    { label:'Open tasks', value:'—', sub:'case-linked', color:'#1B1D22' },
    { label:'Avg age', value:'—', sub:'open cases', color:'#2F6B4F' },
  ];
  var detailCoverages = [
    { name:'General Liability', limit:'$1M / $2M aggregate', ded:'$1,000' },
    { name:'Property (BPP)', limit:'$250,000', ded:'$2,500' },
    { name:'Business Income', limit:'$100,000', ded:'72 hr' },
    { name:'Hired/Non-Owned Auto', limit:'$1,000,000', ded:'—' },
  ];
  var detailTimeline = [
    { when:'Jul 22', text:'Renewal flagged at risk — no quote on file', color:'#B4231F' },
    { when:'Jul 15', text:'Renewal questionnaire emailed to insured', color:'#B9822A' },
    { when:'Jun 30', text:'Loss runs received from The Hartford', color:'#2F6B4F' },
    { when:"Aug 24 '25", text:'Policy bound — 12-month term', color:'#6B7078' },
  ];

  // Cases
  var tcKpis = [
    { label:'Open cases', value:'14', sub:'agency service work', color:'#1B1D22' },
    { label:'Overdue', value:'3', sub:'past target date', color:'#B4231F' },
    { label:'Open tasks', value:'18', sub:'case-linked', color:'#1B1D22' },
    { label:'Avg age', value:'6d', sub:'open cases', color:'#2F6B4F' },
  ];
  var cCat = { 'Endorsement':['#2563EB','#E9EFFC'],'Claim':['#B4231F','#FBE9E7'],'Service':['#2F6B4F','#EAF1EC'],'COI':['#B9822A','#F7EEDB'],'Billing':['#6D28D9','#EDE7FB'] };
  var caseRows = [];
  // Same for the case detail overlay.
  var dcase = { subj:'—', client:'—', cat:'—', catColor:'#6B7078', catBg:'#EFEFEC',
                status:'—', owner:'—', opened:'—', loss:'Select a case to see its detail.' };
  var caseFacts = [];
  var caseTasks = [];
  var caseTimeline = [];

  // Finance
  var finKpis = [
    { label:'Commission owed', value:'—', sub:'expected not received', color:'#B9822A' },
    { label:'Received', value:'—', sub:'reconciled', color:'#2F6B4F' },
    { label:'Variances', value:'—', sub:'expected ≠ received', color:'#B4231F' },
    { label:'Ledger rows', value:'—', sub:'in the book', color:'#1B1D22' },
  ];
  var vStat = { 'Short':['#B4231F','#FBE9E7'],'Received':['#2F6B4F','#EAF1EC'],'Pending':['#B9822A','#F7EEDB'] };
  var finRows = [];

  var headers = {
    home:{ title:'Home', sub:'Risk Solutions Group · agency command center' },
    crm:{ title:'CRM', sub:'Client book — accounts, policies, cases', action:'Open in new tab ↗' },
    renewals:{ title:'Renewals', sub:'Retention & renewal worklist — quote-to-confirm', action:'Open in new tab ↗' },
    cases:{ title:'Tasks & Cases', sub:'Agency service work — endorsements, claims, COIs, billing', action:'New case +' },
    finance:{ title:'Finance', sub:'Commission reconciliation — expected vs received', action:'Import statement +' },
    carrier:{ title:'Carrier Hub', sub:'Appetite, appointments & submissions' },
    intake:{ title:'Intake', sub:'Evidence in, assessed & verified out' },
    storage:{ title:'Storage', sub:'NextCloud files & shared documents' },
    team:{ title:'Team Chat', sub:'Chat, questions & document sharing' },
    sops:{ title:'SOPs', sub:'Standard operating procedures & playbooks' },
  };

  var stubPlanned = {
    carrier:['Carrier appetite search by class & state','Appointment status and login vault','Submission tracking with round-trip status'],
    intake:['Evidence upload with OCR extraction','Automated assessment & verification','Locked write-back to CRM on approval'],
    storage:['NextCloud file browser embedded here','Per-client document folders','Drag-and-drop with version history'],
    team:['Channels for renewals, service & carriers','Threaded questions with @mentions','Share documents straight from Storage'],
    sops:['Searchable playbooks by workflow','Step-by-step checklists','Version history and owners'],
  };
  var stubKeys = ['sops'];

  // The intake gateway's operator UI, proxied onto this origin by server.js at
  // /intake. Same-origin on purpose: the app's API calls are root-relative, so
  // they land back here and are forwarded to the gateway with the credentials
  // attached server-side.
  var INTAKE_EMBED = '/intake';

  // Same-origin embed. Deliberately NOT embedScreen(): that one gates on
  // onTailnetHttps() because NextCloud refuses to be framed from anywhere but
  // the Tailscale HTTPS origin. Intake has no such constraint — it is served by
  // this very process — so reusing that guard would black out a working panel
  // whenever the portal is reached over plain http (e.g. http://100.75.67.72:3400).
  function embedLocalScreen(title, src, subtitle, accent){
    return '<div style="position:absolute;inset:0;display:flex;flex-direction:column;background:#fff">'
      + '<div style="height:42px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;background:#FBF9F4;border-bottom:1px solid #ECEAE2">'
        + '<span style="width:8px;height:8px;border-radius:3px;background:'+(accent||'#B9822A')+'"></span>'
        + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:15px;color:#1B1D22">'+title+'</span>'
        + '<span style="font-size:11.5px;color:#96999F">'+(subtitle||'')+'</span>'
        + '<a href="'+src+'" target="_blank" rel="noopener" style="margin-left:auto;font-size:11.5px;color:#2563EB">Open in new tab ↗</a>'
      + '</div>'
      + '<iframe src="'+src+'" style="flex:1;width:100%;border:0" title="'+title+'" allow="clipboard-read; clipboard-write; fullscreen"></iframe>'
    + '</div>';
  }

  // Status/priority wording differs between cases and tasks (open / not_started

  var crmChip = {
    open:['#B9822A','#F7EEDB'], not_started:['#6B7078','#EFEFEC'], in_progress:['#2563EB','#E9EFFC'],
    waiting:['#B9822A','#F7EEDB'], blocked:['#B4231F','#FBE9E7'], overdue:['#B4231F','#FBE9E7'],
    closed:['#2F6B4F','#EAF1EC'], done:['#2F6B4F','#EAF1EC'], completed:['#2F6B4F','#EAF1EC'], resolved:['#2F6B4F','#EAF1EC'],
    high:['#B4231F','#FBE9E7'], urgent:['#B4231F','#FBE9E7'], medium:['#B9822A','#F7EEDB'], normal:['#6B7078','#EFEFEC'], low:['#6B7078','#EFEFEC'],
  };
  function chipHtml(v){
    if(v==null||v==='') return '—';
    var k = String(v).toLowerCase().replace(/[\s-]+/g,'_');
    var c = crmChip[k] || ['#6B7078','#EFEFEC'];
    var label = String(v).replace(/_/g,' ');
    return '<span style="font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;color:'+c[0]+';background:'+c[1]+'">'+esc(label)+'</span>';
  }
  // A due date is the whole point of a task list, so say when it has passed.
  function dueHtml(v){
    if(!v) return '—';
    var t = new Date(v).getTime();
    if(isNaN(t)) return esc(String(v));
    var d = new Date(t), today = new Date(); today.setHours(0,0,0,0);
    var txt = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    if(t < today.getTime()) return '<span style="color:#B4231F;font-weight:600">'+txt+' · overdue</span>';
    return esc(txt);
  }
  // NowCerts GUIDs are read-only: fine to show — they are how you match a record
  // against the AMS — but never editable. The enforcement is the override
  // allowlist, which carries no identifier, not the renderer.
  function crmCell(r, c){
    var v = r[c[0]], fmt = c[2], txt;
    if(fmt==='money') txt = money(v);
    else if(fmt==='chip') txt = chipHtml(v);
    else if(fmt==='date') txt = dueHtml(v);
    else if(fmt==='person') txt = (v ? esc(nameFromEmail(v)) : '—');
    // A task is case work, client work, or purely internal. Which it is, is the
    // difference between a task list and a pile.
    else if(fmt==='scope') txt = chipHtml(v ? 'case' : (r.insured_database_id ? 'client' : 'internal'));
    else txt = (v==null||v==='' ? '—' : esc(String(v)));
    return '<span style="font-size:12.5px;color:#3D4149;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'

  var CLIENT_FIELDS = [

  // One field renderer for every editable surface. `kind` names the buffer the
  // field writes into ('client', 'policy', 'work', 'renewal'); a field carries
  // its own kind so a single input handler can serve all of them.
  //
  // opts: { overridden, options (a select), wide, area (a textarea), placeholder }
  function editField(kind, rec, key, label, opts){
    opts = opts || {};
    var buf = edits[kind];
    var ovr = opts.overridden || {};
    var pending = Object.prototype.hasOwnProperty.call(buf, key);
    var corrected = Object.prototype.hasOwnProperty.call(ovr, key);
    var val = pending ? buf[key] : (rec[key] == null ? '' : String(rec[key]));
    var id = kind + ':' + key;
    var box = 'border:1px solid '+(pending?'#B9822A':'#E6E6E2')+';border-radius:9px;padding:8px 11px;font:inherit;'
            + 'font-size:13px;color:#25282E;width:100%;box-sizing:border-box;background:'+(pending?'#FFFBF2':'#fff');

    var control;
    if (opts.options) {
      control = '<select data-efield="'+id+'" style="'+box+'">'
        + opts.options.map(function(o){
            var v = (typeof o === 'string') ? o : o[0], t = (typeof o === 'string') ? o : o[1];
            return '<option value="'+esc(v)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(t)+'</option>';
          }).join('')
        + '</select>';
    } else if (opts.area) {
      control = '<textarea data-efield="'+id+'" rows="4" style="'+box+';resize:vertical;line-height:1.45">'+esc(val)+'</textarea>';
    } else {
      control = '<input data-efield="'+id+'" value="'+esc(val)+'"'
        + (opts.placeholder ? ' placeholder="'+esc(opts.placeholder)+'"' : '')
        + ' style="'+box+'"/>';
    }

    return '<div style="display:flex;flex-direction:column;gap:4px;min-width:0'+(opts.wide?';grid-column:1/-1':'')+'">'
      + '<label style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#96999F;font-weight:700">'+label
        + (corrected ? ' <span title="Corrected in the portal. NowCerts still shows the old value." style="color:#B9822A">· corrected</span>' : '')
      + '</label>'
      + control
      + (corrected
          ? '<span style="font-size:11px;color:#9A9EA6">AMS: '+esc(ovr[key]==null?'(blank)':String(ovr[key]))+'</span>' : '')
    + '</div>';
  }

  // Save / Discard / close, rendered the same way on every card.
  function cardActions(kind, extra){
    var dirty = Object.keys(edits[kind]).length;
    return '<div style="display:flex;align-items:center;gap:10px">'

  // `rowAttr` optionally makes rows clickable — it returns the attributes for a

  var POLICY_FIELDS = [

  // An identifier, rendered as what it is: readable, copyable, not an input.
  // A GUID gets the full row — a truncated identifier you have to hover to read
  // is the reason people go back to opening the AMS to check they have the right
  // record.
  function readonlyId(label, value, wide){
    return '<div style="display:flex;flex-direction:column;gap:3px;min-width:0'
      + (wide?';grid-column:1/-1':'')+'">'
      + '<span style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#96999F;font-weight:700">'+label+'</span>'
      + '<span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#6B7078;'
        + 'user-select:all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(String(value||'—'))+'">'
        + esc(value == null || value === '' ? '—' : String(value)) + '</span>'
    + '</div>';
  }

  function renderPolicyCard(){
    var list = (clientData && clientData.policies) || [];
    var rec = null;
    for (var i=0;i<list.length;i++) if (list[i].policy_guid === policyOpen) rec = list[i];
    if (!rec) return '';
    var ovr = rec._overridden || {};

    return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px">'
        + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">Policy '
          + esc(rec.policy_number || '—')+'</span>'
        + cardActions('policy')
      + '</div>'
      + '<div style="font-size:11px;color:#9A9EA6;margin-bottom:13px">Identifiers come from NowCerts and are read-only.</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:11px 13px;background:#FAFAF7;border:1px solid #EFEFEB;border-radius:10px;margin-bottom:14px">'
        + POLICY_IDS.map(function(f){ return readonlyId(f[1], rec[f[0]], f[2]); }).join('')
      + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px">'
        + POLICY_FIELDS.map(function(f){ return editField('policy', rec, f[0], f[1], {overridden:ovr}); }).join('')
      + '</div>'
    + '</div>';
  }

  // ---- Cases and tasks ------------------------------------------------------
  // These are the CRM's own records, not a mirror of NowCerts, so an edit is a
  // real write — not an override. Completing and deleting live on the same card
  // as the fields: a queue you can only add to is a queue nobody trusts.
  var TASK_STATUSES = ['not_started','in_progress','waiting','completed','cancelled'];
  var PRIORITIES = ['low','medium','high','urgent'];
  var TASK_FIELDS = [
    ['title','Title', {wide:true}], ['status','Status', {options:TASK_STATUSES}],
    ['priority','Priority', {options:PRIORITIES}],
    ['assigned_to_email','Assigned to'], ['due_at','Due', {placeholder:'YYYY-MM-DD'}],
    ['description','Notes', {wide:true, area:true}],
  ];
  var CASE_FIELDS = [
    ['title','Title', {wide:true}], ['case_type','Type'],
    ['priority','Priority', {options:PRIORITIES}],
    ['owner_email','Owner'], ['due_at','Due', {placeholder:'YYYY-MM-DD'}],
    ['description','Notes', {wide:true, area:true}],
  ];

  // Whichever list the open work item came from — the client 360 or the CRM
  // table. One lookup so the card does not care which screen opened it.
  //
  // The list for the view you are ON is searched first. Both can hold the same
  // record, and only one of them was just re-read: a client 360 left loaded from
  // earlier will happily answer with the pre-save copy, which is how a card ends
  // up showing "open" next to a row that says "closed".
  function workRecord(){
    if (!workOpen) return null;
    var key = workOpen.kind === 'task' ? 'tasks' : 'cases';
    var fromClient = clientData ? clientData[key] : null;
    var fromTable = (crmData[key] || {}).rows;
    var pools = (state.crmView === 'client') ? [fromClient, fromTable] : [fromTable, fromClient];
    for (var p=0;p<pools.length;p++){
      var rows = pools[p] || [];
      for (var i=0;i<rows.length;i++) if (String(rows[i].id) === String(workOpen.id)) return rows[i];
    }
    return null;
  }

  function renderWorkCard(){
    var rec = workRecord();
    if (!rec) return '';
    var isTask = workOpen.kind === 'task';
    var fields = isTask ? TASK_FIELDS : CASE_FIELDS;
    var closed = isTask
      ? (rec.status === 'completed' || rec.status === 'cancelled')
      : (rec.status === 'closed');

    var btn = 'font-size:12px;font-weight:600;border-radius:8px;padding:7px 13px;cursor:pointer;';
    var extra = '';
    if (!closed) {
      extra += '<span data-edit="work:finish" style="'+btn+'color:#2F6B4F;background:#EAF1EC">'
             + (isTask ? 'Complete' : 'Close case') + '</span>';
    }
    extra += '<span data-edit="work:delete" style="'+btn+'color:#B4231F;background:#FBE9E7">Delete</span>';

    return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px">'
        + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">'
          + (isTask ? 'Task' : 'Case ' + esc(rec.case_number || '')) + '</span>'
        + cardActions('work', extra)
      + '</div>'
      + '<div style="font-size:11px;color:#9A9EA6;margin-bottom:13px">'
        + (isTask
            ? 'Status is a field here — completing is the same write, one click.'
            : 'Closing a case records a resolution and pushes the summary to NowCerts, so it is an action rather than a field.')
      + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:11px 13px;background:#FAFAF7;border:1px solid #EFEFEB;border-radius:10px;margin-bottom:14px">'
        + readonlyId(isTask ? 'Task ID' : 'Case ID', rec.id, true)
        + (isTask ? readonlyId('Case', rec.case_id || '—') : readonlyId('Case number', rec.case_number))
        + readonlyId('Status', rec.status)
      + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px">'
        + fields.map(function(f){ return editField('work', rec, f[0], f[1], f[2]); }).join('')
      + '</div>'
    + '</div>';
  }

  function renderClientDetail(){
    var d = clientData;
    if (!d || d.loading) {
      return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#96999F;font-size:13px">Loading client…</div>';
    }
    if (d.error || !d.client) {
      return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px">'
        + '<div style="text-align:center"><div style="font-family:\'Newsreader\',Georgia,serif;font-size:19px;color:#1B1D22;margin-bottom:6px">Couldn\'t open that client</div>'
        + '<div style="font-size:12.5px;color:#6B7078">'+esc(d.error || 'no record returned')+'</div>'
        + '<div data-client="close" style="margin-top:14px;font-size:12.5px;color:#2563EB;cursor:pointer">‹ Back to clients</div></div></div>';
    }
    var rec = d.client, ovr = rec._overridden || {};
    var dirty = Object.keys(edits.client).length;

    return '<div style="position:absolute;inset:0;overflow:auto;padding:22px 26px">'
      + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">'
        + '<div data-client="close" style="font-size:12.5px;color:#6B7078;cursor:pointer;font-weight:600">‹ Clients</div>'
        + '<div style="width:1px;height:16px;background:#E2E1DC"></div>'
        + '<span style="font-size:11.5px;color:#96999F">Corrections are held in the CRM — they do not write to NowCerts</span>'
      + '</div>'
      + '<h1 style="font-family:\'Newsreader\',Georgia,serif;font-size:27px;color:#1B1D22;margin:6px 0 2px;font-weight:500">'+esc(rec.insured_name || '—')+'</h1>'
      + '<div style="font-size:12.5px;color:#787C84;margin-bottom:3px">'+esc(rec.client_type || '—')
        + ' · '+d.counts.policies+' policies · '+d.counts.cases+' cases · '+d.counts.tasks+' tasks'
        + ' · '+d.counts.opportunities+' opportunities</div>'
      + '<div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#A6A9AF;'
        + 'user-select:all;margin-bottom:18px" title="NowCerts insured ID — read-only">'
        + esc(rec.nowcerts_insured_guid || '') + '</div>'
      + '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start">'
        + '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px">'
          + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
            + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">Details</span>'
            + cardActions('client')
          + '</div>'
          + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px">'
            + CLIENT_FIELDS.map(function(f){ return editField('client', rec, f[0], f[1], {overridden:ovr}); }).join('')
          + '</div>'
        + '</div>'
        + '<div style="display:flex;flex-direction:column;gap:14px">'
          + renderPolicyCard()
          + renderWorkCard()
          + miniList('Policies', d.policies || [], [['policy_number','Policy #'],['carrier','Carrier'],['lines_of_business','LOB'],['status','Status','chip'],['expiration_date','Expires','date'],['annualized_premium','Premium','money']], 'No policies on this client.',
              function(p){ return p.policy_guid ? 'data-policy="'+esc(p.policy_guid)+'"' : ''; })
          + miniList('Cases', d.cases || [], [['case_number','Case #'],['title','Subject'],['status','Status','chip'],['priority','Priority','chip']], 'No cases.',
              function(k){ return k.id ? 'data-work="case:'+esc(k.id)+'"' : ''; })
          + miniList('Tasks', d.tasks || [], [['title','Task'],['status','Status','chip'],['due_at','Due','date']], 'No tasks.',
              function(t){ return t.id ? 'data-work="task:'+esc(t.id)+'"' : ''; })
          + miniList('Opportunities', d.opportunities || [], [['line_of_business','LOB'],['stage','Stage','chip'],['premium_estimate','Est.','money'],['carrier','Carrier']], 'No open opportunities.')
        + '</div>'
      + '</div>'
    + '</div>';
  }

  function openClient(guid, keepPolicy){
    clientData = { loading:true }; edits.client = {};
    if (!keepPolicy) { policyOpen = null; }
    edits.policy = {};
    setState({ screen:'crm', crmView:'client', client:guid });
    pull('/api/clients/'+encodeURIComponent(guid)).then(function(d){
      clientData = (!d || d._error) ? { error:(d && d._error) || 'no response' } : d;
      render();
    });
  }

  // Closing is always available, but unsaved corrections are never thrown away
  // silently — losing a typed-in phone number to a stray click is how people
  // stop trusting the edit surface.
  function unsavedOk(n){
    return !n || confirm(n+' unsaved correction'+(n===1?'':'s')+' will be discarded. Close anyway?');
  }

  function closePolicy(force){
    if (!force && !unsavedOk(Object.keys(edits.policy).length)) return false;
    policyOpen = null; edits.policy = {}; render();
    return true;
  }

  function closeClient(){
    if (policyOpen) return closePolicy(false);
    if (!unsavedOk(Object.keys(edits.client).length)) return false;
    clientData = null; edits.client = {}; policyOpen = null; edits.policy = {};
    setState({ crmView:'clients', client:null });
    return true;
  }

  function savePolicyEdits(){
    var guid = policyOpen, fields = Object.keys(edits.policy);
    if (!guid || !fields.length) return;
    var who = (state.user === 'gretchen') ? 'gretchen@risksolutionsgroup.net'
                                          : 'lamar@risksolutionsgroup.net';
    Promise.all(fields.map(function(f){
      return fetch('/api/policies/'+encodeURIComponent(guid)+'/override', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ field_name:f, value:edits.policy[f], approved_by:who,
                               reason:'corrected in the CRM' })
      }).then(function(r){ return r.ok ? null : r.json().then(function(e){ return (e && e.detail) || 'failed'; }); });
    })).then(function(errs){
      var bad = errs.filter(Boolean);
      edits.policy = {};
      if (bad.length) alert('Some corrections were refused:\n' + bad.join('\n'));
      openClient(state.client, true);   // re-read; keep the policy open
    });
  }

  function saveClientEdits(){
    var guid = state.client, fields = Object.keys(edits.client);
    if (!guid || !fields.length) return;
    var who = (state.user === 'gretchen') ? 'gretchen@risksolutionsgroup.net'
                                          : 'lamar@risksolutionsgroup.net';
    // One override per field — each is its own named, reversible decision.
    Promise.all(fields.map(function(f){
      return fetch('/api/clients/'+encodeURIComponent(guid)+'/override', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ field_name:f, value:edits.client[f], approved_by:who,
                               reason:'corrected in the CRM' })
      }).then(function(r){ return r.ok ? null : r.json().then(function(e){ return (e && e.detail) || 'failed'; }); });
    })).then(function(errs){
      var bad = errs.filter(Boolean);
      edits.client = {};
      if (bad.length) alert('Some corrections were refused:\n' + bad.join('\n'));
      openClient(guid, true);  // re-read so the saved values come back from the API
    });
  }

  function actingAs(){
    return (state.user === 'gretchen') ? 'gretchen@risksolutionsgroup.net'
                                       : 'lamar@risksolutionsgroup.net';
  }

  // Re-read whichever list the open work item came from, so a saved change is
  // shown as the API returned it rather than as it was typed.
  function reloadWorkFor(item){
    if (state.crmView === 'client' && state.client) { openClient(state.client, true); return; }
    loadCrmView(item && item.kind === 'task' ? 'tasks' : 'cases', true);
  }
  function reloadWork(){ reloadWorkFor(workOpen); }

  function closeWork(){
    if (!workOpen) return true;
    if (!unsavedOk(Object.keys(edits.work).length)) return false;
    workOpen = null; edits.work = {}; render();
    return true;
  }

  function saveWorkEdits(){
    var rec = workRecord(), fields = Object.keys(edits.work);
    if (!rec || !fields.length) return;
    var body = {};
    fields.forEach(function(f){ body[f] = edits.work[f] === '' ? null : edits.work[f]; });
    fetch('/api/'+(workOpen.kind === 'task' ? 'tasks' : 'cases')+'/'+encodeURIComponent(rec.id), {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    }).then(function(r){
      return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; });
    }).then(function(err){
      if (err) { alert('That change was refused:\n' + JSON.stringify(err)); return; }
      edits.work = {};
      reloadWork();
    });
  }

  // Completing a task is a status write. Closing a case is not: it checks the
  // required tasks, records a resolution and pushes a summary to NowCerts — so
  // it asks for the resolution rather than inventing one.
  function finishWork(){
    var rec = workRecord();
    if (!rec) return;
    var isTask = workOpen.kind === 'task';
    var url, body;
    if (isTask) {
      if (!confirm('Mark "'+(rec.title||'this task')+'" complete?')) return;
      url = '/api/tasks/'+encodeURIComponent(rec.id)+'/complete';
      body = {};
    } else {
      var resolution = prompt('How was this case resolved? (goes to NowCerts)');
      if (!resolution) return;
      url = '/api/cases/'+encodeURIComponent(rec.id)+'/close';
      body = { resolution: resolution, resolved_by_email: actingAs() };
    }
    fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
                 body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(res){
        if (!res.ok) {
          var d = res.j && res.j.detail;
          // The backend answers a blocked close with the tasks that are blocking
          // it, which is the only useful thing to show here.
          if (d && d.blocking) {
            alert('Cannot close ' + (d.case_number||'this case') + ' yet:\n\n'
              + d.blocking.map(function(b){ return '· ' + b.title + ' (' + b.status + ')'; }).join('\n')
              + '\n\n' + (d.hint || ''));
          } else {
            alert('That did not go through:\n' + JSON.stringify(d || res.j));
          }
          return;
        }
        edits.work = {};
        // A completed task drops out of the open-task queue, so the card would
        // be left pointing at a row that is no longer in the list. Completing it
        // is also the end of working it — close the card and show the list.
        if (isTask) { var k = workOpen; workOpen = null; reloadWorkFor(k); return; }
        reloadWork();
      });
  }

  function deleteWork(){
    var rec = workRecord();
    if (!rec) return;
    var isTask = workOpen.kind === 'task';
    var what = isTask ? 'task' : 'case';
    var warn = 'Delete this '+what+'?\n\n"'+(rec.title || rec.case_number || rec.id)+'"'
      + (isTask ? '' : '\n\nIts tasks, timeline and document links go with it. The documents themselves stay in Nextcloud.')
      + '\n\nThis cannot be undone.';
    if (!confirm(warn)) return;
    fetch('/api/'+(isTask?'tasks':'cases')+'/'+encodeURIComponent(rec.id), {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ deleted_by: actingAs(), reason:'deleted from the CRM' })
    }).then(function(r){
      return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; });
    }).then(function(err){
      if (err) { alert('That '+what+' was not deleted:\n' + JSON.stringify(err)); return; }
      var kind = workOpen.kind;
      workOpen = null; edits.work = {};
      if (state.crmView === 'client' && state.client) openClient(state.client, true);
      else loadCrmView(kind === 'task' ? 'tasks' : 'cases', true);
    });
  }

  // ---- Renewal detail -------------------------------------------------------
  // Both premiums are editable: the expiring one is often wrong in the mirror,
  // and the renewal one does not exist until a carrier quotes it. The change
  // percentage is not a field — it is computed from the two, so it follows.
  var RENEWAL_RISK = ['SAFE','AT_RISK','CRITICAL','RENEWED','LAPSED'];
  var RENEWAL_FIELDS = [
    ['premium_current','Premium (current)'], ['premium_renewal','Premium (renewal)'],
    ['risk_status','Risk', {options:RENEWAL_RISK}],
    ['last_contact_date','Last contact', {placeholder:'YYYY-MM-DD'}],
    ['ai_strategy_notes','Strategy note', {wide:true, area:true}],
  ];

  function saveRenewalEdits(){
    var rec = selRenewal, fields = Object.keys(edits.renewal);
    if (!rec || !rec.id || !fields.length) return;
    var body = {};
    fields.forEach(function(f){
      var v = edits.renewal[f];
      if (v === '') { body[f] = null; return; }
      body[f] = (f.indexOf('premium') === 0) ? parseFloat(String(v).replace(/[^0-9.\-]/g,'')) : v;
    });
    fetch('/api/renewals/'+encodeURIComponent(rec.id), {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    }).then(function(r){
      return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; });
    }).then(function(err){
      if (err) { alert('That change was refused:\n' + JSON.stringify(err)); return; }
      edits.renewal = {};
      // Re-read the cockpit so the recomputed change percentage comes from the
      // database rather than being guessed here.
      pull('/api/renewals').then(function(d){
        if (applyRenewals(d)) {
          for (var i=0;i<renewalRows.length;i++){
            var raw = renewalRows[i]._raw;
            if (raw && String(raw.id) === String(rec.id)) selRenewal = raw;
          }
        }
        render();
      });
    });
  }

  // A CRM sub-view: header, then a table of whatever the endpoint returned.
  // Never renders a placeholder row — an empty book says it is empty.
  function crmTable(key){
    var cfg = CRM_VIEWS[key], d = crmData[key] || {};
    var head = cfg.cols.map(function(c){
      return '<span'+(c[2]==='money'?' style="text-align:right"':'')+'>'+c[1]+'</span>';
    }).join('');
    var grid = 'display:grid;grid-template-columns:repeat('+cfg.cols.length+',minmax(0,1fr));gap:12px;';

    var body;
    if(d.loading || (!d.rows && !d.error)){
      body = '<div style="padding:26px 18px;font-size:12.5px;color:#96999F">Loading '+cfg.label.toLowerCase()+'…</div>';
    } else if(d.error){
      body = '<div style="padding:26px 18px;font-size:12.5px;color:#B4231F">Couldn\'t load '+cfg.label.toLowerCase()+' — '+esc(d.error)+'</div>';
    } else if(!d.rows.length){
      body = '<div style="padding:26px 18px;font-size:12.5px;color:#96999F">No '+cfg.label.toLowerCase()+' in the book.</div>';
    } else {
      body = d.rows.slice(0,200).map(function(r){
        // Clients open a 360; cases and tasks open the card that edits them.
        // The rest are still read-only lists.
        var open = ' style="';
        if (key === 'clients' && r.nowcerts_insured_guid) {
          open = ' data-client="'+esc(r.nowcerts_insured_guid)+'" style="cursor:pointer;';
        } else if ((key === 'cases' || key === 'tasks') && r.id) {
          open = ' data-work="'+(key === 'tasks' ? 'task' : 'case')+':'+esc(r.id)+'" style="cursor:pointer;';
        }
        return '<div class="rowh"'+open+grid+'padding:12px 18px;border-bottom:1px solid #F2F2EE;align-items:center">'
          + cfg.cols.map(function(c){ return crmCell(r, c); }).join('')
        + '</div>';
      }).join('');
    }
    var count = d.rows ? d.rows.length : null;
    var card = (workOpen && (key === 'cases' || key === 'tasks')
                && workOpen.kind === (key === 'tasks' ? 'task' : 'case'))
      ? '<div style="margin-bottom:16px">' + renderWorkCard() + '</div>' : '';
    return '<div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#96999F;font-weight:700">Live from Hermes</div>'
      + '<h1 style="font-family:\'Newsreader\',Georgia,serif;font-size:28px;color:#1B1D22;margin:5px 0 3px;font-weight:500">'+cfg.label+'</h1>'
      + '<p style="font-size:12.5px;color:#787C84;margin:0 0 18px">'
        + (count!=null ? count.toLocaleString('en-US')+' record'+(count===1?'':'s')+(count>200?' · showing first 200':'') : '&nbsp;')
      + '</p>'
      + card
      + '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;overflow:hidden">'
        + '<div style="'+grid+'padding:11px 18px;background:#FAFAF7;border-bottom:1px solid #EFEFEB;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#96999F;font-weight:700">'+head+'</div>'
        + body
      + '</div>';
  }

  // A panel with no rows says why. The sample datasets that used to fill this
  // gap were removed: invented clients and premiums are indistinguishable from
  // real ones, and this is what the agency works from.
  function panelEmpty(source, label){
    var msg = sources[source]==='live'
      ? 'No '+label+' right now.'
      : 'Loading '+label+'\u2026';
    return '<div style="padding:28px 18px;font-size:12.5px;color:#96999F">'+msg+'</div>';
  }

  function renderCRM(){
    var view = state.crmView || 'workspace';
    var nav = crmNavRaw.map(function(n){
      var on = n.view === view;

  // ---- Ask Hermes, for real ------------------------------------------------
  var aiThread = [], aiBusy = false;
  function askHermes(text){
    text = (text||'').trim();
    if(!text || aiBusy) return;
    aiThread.push({ who:'you', text:text });
    aiBusy = true; render();
    fetch('/api/ask', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ prompt:text, hub:state.screen, persona:state.user })
    })
      .then(function(r){ return r.json(); })
      .then(function(d){ aiThread.push({ who:'hermes', text:(d && (d.message || d.detail)) || 'No answer came back.' }); })
      .catch(function(e){ aiThread.push({ who:'hermes', text:'Couldn\'t reach Hermes — '+((e && e.message) || 'request failed') }); })
      .then(function(){ aiBusy = false; render(); setTimeout(focusAi, 0); });
  }
  function focusAi(){
    var i = document.getElementById('aiInput'); if(i && !aiBusy) i.focus();
    var l = document.getElementById('aiLog'); if(l) l.scrollTop = l.scrollHeight;
  }

  // ------------------------------------------------------------------
  // Root render
  // ------------------------------------------------------------------
  function renderScreen(screen){
    // Isolate per-screen failures so one bad screen can never blank the shell.
    try {
      if(screen==='home') return renderHome(people[state.user]);
      if(screen==='crm') return renderCRM();
      if(screen==='renewals') return renderRenewals();
      if(screen==='cases') return renderCases();
      if(screen==='finance') return renderFinance();
      if(screen==='carrier') return renderCarrier();
      if(screen==='storage') return embedScreen('Storage', STORAGE_EMBED, 'NextCloud Files · client documents', '#4B77BE');
      if(screen==='team') return embedScreen('Team Chat', TALK_EMBED, 'NextCloud Talk · channels & DMs', '#0F7B6C');
      if(screen==='deck') return embedScreen('Deck', DECK_EMBED, 'NextCloud Deck · boards & cards', '#6D28D9');
      if(screen==='intake') return embedLocalScreen('Intake', INTAKE_EMBED, 'Evidence in, assessed & verified out', '#B9822A');
      if(stubKeys.indexOf(screen)>=0) return renderStub(screen);
      return renderHome(people[state.user]);
    } catch(e){
      return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px"><div style="max-width:420px;text-align:center"><div style="font-family:\'Newsreader\',Georgia,serif;font-size:20px;color:#1B1D22;margin-bottom:8px">This workspace hit an error</div><div style="font-size:12.5px;color:#9A9EA6;line-height:1.5">'+((e&&e.message)||e)+'</div></div></div>';
    }
  }

  function render(){
    var screen = state.screen;
    var person = people[state.user];
    var html = '<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:#F3F4F6">'
      + renderRail(screen)
      + '<div style="flex:1;display:flex;flex-direction:column;min-width:0">'
        + renderHeader(screen, person)
        + '<div style="flex:1;position:relative;min-height:0">'
          + renderScreen(screen)
          + renderAI(screen)
        + '</div>'
      + '</div>'
    + '</div>';
    document.getElementById('app').innerHTML = html;
    if(state.screen==='carrier' && !state.carrierEmbed) wireCarrier();
    if(state.aiOpen) setTimeout(focusAi, 0);
  }

  // ------------------------------------------------------------------
  // Event delegation
  // ------------------------------------------------------------------
  // Every editable surface writes through this one handler. A field's
  // data-efield carries "<kind>:<field>", so the only thing that differs per
  // surface is which record the typed value is compared against to decide
  // whether it is still a change.
  function editSubject(kind){
    if (kind === 'client') return (clientData && clientData.client) || {};
    if (kind === 'policy') {
      var list = (clientData && clientData.policies) || [];
      for (var i=0;i<list.length;i++) if (list[i].policy_guid === policyOpen) return list[i];
      return {};
    }
    if (kind === 'work') return workRecord() || {};
    if (kind === 'renewal') return selRenewal || {};
    return {};
  }

  document.getElementById('app').addEventListener('input', function(e){
    var t = e.target;
    if(!t || !t.getAttribute) return;
    var id = t.getAttribute('data-efield');
    if(!id) return;
    var parts = id.split(':'), kind = parts[0], f = parts[1];
    var buf = edits[kind];
    if(!buf) return;
    var rec = editSubject(kind);
    var original = rec[f] == null ? '' : String(rec[f]);
    var wasDirty = Object.keys(buf).length > 0;
    if(t.value === original) delete buf[f];
    else buf[f] = t.value;
    // Re-render only when the Save button needs to appear or disappear —
    // re-rendering per keystroke would blur the input mid-typing.
    if((Object.keys(buf).length > 0) !== wasDirty){
      var pos = t.selectionStart;
      render();
      var again = document.querySelector('[data-efield="'+id+'"]');
      if(again){ again.focus(); try{ again.setSelectionRange(pos, pos); }catch(err){} }
    }
  });

  document.getElementById('app').addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target && e.target.id==='aiInput'){
      e.preventDefault();
      var q = e.target.value; e.target.value=''; askHermes(q);
    }
  });

  // Escape closes the innermost surface you are in, one at a time. On document,
  // not #app: after a save the focused input is gone and the keystroke would
  // otherwise land on <body> and do nothing.
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(state.screen !== 'crm') return;
    if(workOpen){ closeWork(); return; }
    if(state.crmView !== 'client') return;
    if(policyOpen){ closePolicy(false); return; }
    if(state.client) closeClient();
  });

  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-client],[data-policy],[data-work],[data-edit],[data-caseopen],[data-go],[data-crmview],[data-aichip],[data-toggle],[data-user],[data-ai],[data-detail],[data-casedetail],[data-carrier],[data-finance]');
    if(!el) return;

    // Card actions, written "<kind>:<action>" so one branch serves every card.
    if(el.hasAttribute('data-edit')){
      var ea = el.getAttribute('data-edit').split(':'), ek = ea[0], act = ea[1];
      if(act === 'discard'){ edits[ek] = {}; render(); return; }
      if(act === 'close'){
        if(ek === 'client') closeClient();
        else if(ek === 'policy') closePolicy(false);
        else if(ek === 'work') closeWork();
        else { edits[ek] = {}; render(); }
        return;
      }
      if(act === 'save'){
        if(ek === 'client') saveClientEdits();
        else if(ek === 'policy') savePolicyEdits();
        else if(ek === 'work') saveWorkEdits();
        else if(ek === 'renewal') saveRenewalEdits();
        return;
      }
      if(act === 'finish'){ finishWork(); return; }
      if(act === 'delete'){ deleteWork(); return; }
      return;
    }
    // A row on the Cases screen: hand it to the CRM's case card, which is the
    // one surface that can actually edit, close or delete it.
    if(el.hasAttribute('data-caseopen')){
      if(!closeWork()) return;
      workOpen = { kind:'case', id: el.getAttribute('data-caseopen') };
      loadCrmView('cases');
      setState({ screen:'crm', crmView:'cases', caseDetail:false, aiOpen:false });
      return;
    }
    // A case or task row: "case:<id>" / "task:<id>".
    if(el.hasAttribute('data-work')){
      var w = el.getAttribute('data-work').split(':');
      var same = workOpen && workOpen.kind === w[0] && String(workOpen.id) === w[1];
      if(same) return;
      if(!closeWork()) return;   // asks about unsaved edits on the previous one
      workOpen = { kind:w[0], id:w[1] };
      render();
      return;
    }
    // CRM sub-view, either from its own rail or from a workspace card whose
    // target is written "crm:<view>".
    if(el.hasAttribute('data-client')){
      var c = el.getAttribute('data-client');
      if(c === 'close'){ closeClient(); }
      else { openClient(c); }
      return;
    }
    if(el.hasAttribute('data-policy')){
      var p = el.getAttribute('data-policy');
      // Switching to a different policy is a close, so it asks about unsaved work.
      if(p !== policyOpen && closePolicy(false)){ policyOpen = p; render(); }
      return;
    }
    if(el.hasAttribute('data-aichip')){
      askHermes(el.getAttribute('data-aichip'));
      return;
    }
    if(el.getAttribute('data-ai')==='send'){
      var box = document.getElementById('aiInput');
      if(box){ var q = box.value; box.value=''; askHermes(q); }
      return;
    }
    if(el.hasAttribute('data-crmview')){
      var v = el.getAttribute('data-crmview');
      loadCrmView(v);
      setState({ screen:'crm', crmView:v, aiOpen:false });
      return;
    }
    if(el.hasAttribute('data-go')){
      var target = el.getAttribute('data-go');
      if(target.indexOf('crm:') === 0){
        var sub = target.slice(4);
        loadCrmView(sub);
        setState({ screen:'crm', crmView:sub, aiOpen:false });
        return;
      }
      selRenewal = null;
      setState({ screen: target, detail:false, caseDetail:false, aiOpen:false, carrierEmbed:false, financeEmbed:false });
      return;
    }
    if(el.hasAttribute('data-carrier')){
      setState({ carrierEmbed: el.getAttribute('data-carrier')==='embed' });
      return;
    }
    if(el.hasAttribute('data-finance')){
      setState({ financeEmbed: el.getAttribute('data-finance')==='embed' });
      return;
    }
    if(el.hasAttribute('data-toggle')){
      var key = el.getAttribute('data-toggle');
      var done = Object.assign({}, state.done);
      done[key] = !done[key];
      setState({ done: done });
      return;
    }
    if(el.hasAttribute('data-user')){
      setState({ user: el.getAttribute('data-user') });
      return;
    }
    if(el.hasAttribute('data-ai')){
      setState({ aiOpen: el.getAttribute('data-ai')==='open' });
      return;
    }
    if(el.hasAttribute('data-detail')){
      var open = el.getAttribute('data-detail')==='open';
      if(open && sources.renewals==='live'){
        var idx = parseInt(el.getAttribute('data-idx'),10);
        var row = renewalRows[idx];
        selRenewal = (row && row._raw) ? row._raw : null;
      } else if(!open){
        selRenewal = null;
      } else {
        selRenewal = null; // sample data → show the sample Acme detail
      }
      setState({ detail: open });
      return;
    }
    if(el.hasAttribute('data-casedetail')){
      setState({ caseDetail: el.getAttribute('data-casedetail')==='open' });
      return;
    }
  });

  // ------------------------------------------------------------------
  // Live data layer — fetch from the server-side proxy (/api/*), map the
  // real Hermes/Command Center shapes onto the render arrays, and flip the
  // per-section source flag. Every section falls back to sample data if its
  // endpoint errors or times out, so a degraded backend never blanks the UI.
  // ------------------------------------------------------------------
  function money(n){ if(n==null||isNaN(n)) return '—'; return '$'+Math.round(n).toLocaleString('en-US'); }

  var renewalStatusMap = {
    CRITICAL:['Critical','#B4231F','#FBE9E7'],
    AT_RISK:['At risk','#B9822A','#F7EEDB'],
    SAFE:['On track','#2F6B4F','#EAF1EC'],
    RENEWED:['Renewed','#2F6B4F','#EAF1EC'],
    LAPSED:['Lapsed','#B4231F','#FBE9E7']
  };

  function applyRenewals(d){
    if(!d || d._error || !Array.isArray(d.upcoming)) return false;
    var up = d.upcoming;
    renewalRows = up.slice(0,14).map(function(r){
      var m = renewalStatusMap[r.risk_status] || ['—','#6B7078','#EFEFEC'];
      return { client:r.client_name||'—', line:r.policy_number||'—', premium:money(r.premium_current),
               days:(r.days_until!=null?(r.days_until+(r.days_until===1?' day':' days')):'—'),
               status:m[0], statusColor:m[1], statusBg:m[2], owner:'—', _raw:r };
    });
    var by=d.by_risk||{}, bk=d.buckets||{};
    var crit=((by.CRITICAL||{}).count)||0, atr=((by.AT_RISK||{}).count)||0;
    var due30=(((bk.past_due||{}).count)||0)+(((bk.le7||{}).count)||0)+(((bk.le30||{}).count)||0);
    var premAtRenewal = up.reduce(function(s,r){ return s+(r.premium_current||0); },0);
    renewalKpis = [
      { label:'Due in 30 days', value:String(due30), sub:'across all lines', color:'#1B1D22' },
      { label:'Critical', value:String(crit), sub:'contact now', color:'#B4231F' },
      { label:'At risk', value:String(atr), sub:'schedule outreach', color:'#B9822A' },
      { label:'Premium at renewal', value:money(premAtRenewal), sub:((d.total||up.length)+' policies'), color:'#1B1D22' }
    ];
    sources.renewals='live'; return true;
  }

  var taskPriColor = { high:'#B4231F', medium:'#16233F', low:'#6B7078' };
  function fmtDue(iso){
    if(!iso) return '';
    var d=new Date(iso); if(isNaN(d.getTime())) return '';
    var today=new Date(); today.setHours(0,0,0,0);
    var due=new Date(d); due.setHours(0,0,0,0);
    var diff=Math.round((due.getTime()-today.getTime())/86400000);
    if(diff<0) return 'Overdue';
    if(diff===0) return 'Today';
    if(diff===1) return 'Tomorrow';
    var mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return mon[d.getMonth()]+' '+d.getDate();
  }
  function applyTasks(d){
    if(!d || d._error) return false;
    // Backend groups tasks by assignee display name ("Lamar"/"Gretchen").
    var by = d.by_assignee || {};
    var list = Array.isArray(d.tasks) ? d.tasks : null;
    function mapList(arr){
      return (arr||[]).slice(0,6).map(function(t){
        var pri = (''+(t.priority||'')).toLowerCase();
        return { color:(taskPriColor[pri]||'#16233F'),
                 text:(t.title||t.text||t.name||'Task'),
                 tag:(pri?pri.toUpperCase():'TASK'),
                 due:fmtDue(t.due_at||t.dateEnd||t.due) };
      });
    }
    function forName(name){
      if(by[name]) return mapList(by[name]);
      if(!list) return [];
      return mapList(list.filter(function(t){ return (((t.assignee||t.assigned_to_email||'')+'').toLowerCase().indexOf(name.toLowerCase())>=0); }));
    }
    var l=forName('Lamar'), g=forName('Gretchen');
    // A successful fetch returning no tasks for someone is a real answer —
    // "nothing due" — not a failure. Only replacing a list when it was non-empty
    // is what left Home showing invented work (Acme Roofing, Example Contracting
    // LLC) to whoever had an empty queue, while the other person saw live data.
    // Replace both once the backend has actually answered; renderHome draws an
    // empty state rather than falling back to fiction.
    tasksByUser.lamar = l;
    tasksByUser.gretchen = g;
    taskCount = l.length + g.length;
    sources.tasks='live'; return true;
  }

  function applyCommissions(d){
    var list = Array.isArray(d)?d:(d&&Array.isArray(d.rows)?d.rows:(d&&Array.isArray(d.commissions)?d.commissions:null));
    if(!list || !list.length) return false;
    finRows = list.slice(0,12).map(function(r){
      var exp=(r.expected_amount!=null?r.expected_amount:r.expected);
      var rec=(r.actual_amount!=null?r.actual_amount:(r.received!=null?r.received:r.paid_amount));
      var st = r.status || ((rec==null||rec===0)?'Pending':(exp!=null&&rec<exp?'Short':'Received'));
      st = (''+st).charAt(0).toUpperCase()+(''+st).slice(1).toLowerCase();
      var sm = vStat[st]||['#6B7078','#EFEFEC'];
      return { carrier:(r.carrier||r.carrier_name||'—'), policy:(r.policy_number||r.policy||'—'), client:(r.client||r.client_name||r.insured||'—'),
               expected:money(exp), received:money(rec), status:st, statusColor:sm[0], statusBg:sm[1] };
    });
    // Finance KPIs from the same live rows, so the tiles can't drift from the table.
    var owed=0, received=0, variances=0;
    list.forEach(function(r){
      var exp=Number(r.expected_commission!=null?r.expected_commission:(r.expected_amount!=null?r.expected_amount:r.expected))||0;
      var rec=Number(r.actual_commission!=null?r.actual_commission:(r.actual_amount!=null?r.actual_amount:(r.received!=null?r.received:r.paid_amount)))||0;
      received += rec;
      if(exp>rec){ owed += (exp-rec); variances++; }
      else if(rec>exp){ variances++; }
    });
    financeOwed = owed;
    finKpis = [
      { label:'Commission owed', value:money(owed), sub:'expected not received', color:'#B9822A' },
      { label:'Received', value:money(received), sub:'reconciled', color:'#2F6B4F' },
      { label:'Variances', value:String(variances), sub:'expected \u2260 received', color:'#B4231F' },
      { label:'Ledger rows', value:String(list.length), sub:'in the book', color:'#1B1D22' },
    ];
    sources.commissions='live'; return true;
  }

  var caseCatMap = { marketing:['Marketing','#6D28D9','#EDE7FB'], claim:['Claim','#B4231F','#FBE9E7'], endorsement:['Endorsement','#2563EB','#E9EFFC'], service:['Service','#2F6B4F','#EAF1EC'], coi:['COI','#B9822A','#F7EEDB'], billing:['Billing','#6D28D9','#EDE7FB'] };
  function nameFromEmail(e){ if(!e) return '—'; var l=(''+e).split('@')[0].split(/[._]/)[0]; return l ? l.charAt(0).toUpperCase()+l.slice(1) : '—'; }
  function daysAgo(iso){ if(!iso) return ''; var ms=Date.now()-new Date(iso).getTime(); if(isNaN(ms)) return ''; var d=Math.max(0,Math.floor(ms/86400000)); return d+'d'; }
  function applyCases(d){
    var list = Array.isArray(d)?d:(d&&Array.isArray(d.cases)?d.cases:(d&&Array.isArray(d.items)?d.items:null));
    if(!list || !list.length) return false;
    caseRows = list.slice(0,10).map(function(r){
      var ct = (''+(r.case_type||r.category||r.type||'service')).toLowerCase();
      var cm = caseCatMap[ct] || [ct.charAt(0).toUpperCase()+ct.slice(1), '#2F6B4F', '#EAF1EC'];
      var raw = (''+(r.status||'open'));
      var due = r.due_at ? new Date(r.due_at).getTime() : null;
      var overdue = raw.toLowerCase().indexOf('overdue')>=0 || (raw.toLowerCase()==='open' && due!=null && due < Date.now());
      var status = overdue ? 'Overdue' : (raw.charAt(0).toUpperCase()+raw.slice(1));
      return { id:r.id, subj:(r.title||r.subject||r.name||'Case'), client:(r.insured_name||r.client||r.client_name||'—'),
               cat:cm[0], catColor:cm[1], catBg:cm[2],
               tasks:'—',
               age:daysAgo(r.opened_at||r.created_at), status:status,
               statusColor:overdue?'#B4231F':'#3D4149', statusWeight:overdue?700:500,
               owner:nameFromEmail(r.owner_email||r.owner||r.assignee) };
    });
    var ages = caseRows.map(function(c){ return parseInt(c.age,10); }).filter(function(v){ return !isNaN(v); });
    var avg = ages.length ? Math.round(ages.reduce(function(a,b){return a+b;},0)/ages.length) : null;
    detailFacts = [
      { label:'Open cases', value:String(caseRows.length), sub:'agency service work', color:'#1B1D22' },
      { label:'Avg age', value:(avg!=null?avg+'d':'\u2014'), sub:'open cases', color:'#2F6B4F' },
    ];
    sources.cases='live'; return true;
  }

  function pull(path, _retried){
    return fetch(path,{headers:{'Accept':'application/json'}})
      .then(function(r){ return r.json(); })
      .catch(function(){ return { _error:'fetch failed' }; })
      .then(function(d){
        // Retry once on a timeout: the backend stalls for ~30s whenever a live
        // AMS read is attempted and fails, and an 8s upstream timeout landing
        // inside that window blanks a panel that would otherwise be fine.
        if(!_retried && d && d._error && /timeout/i.test(d._error)){
          return new Promise(function(res){ setTimeout(res, 1200); }).then(function(){ return pull(path, true); });
        }
        return d;
      });
  }

  function fetchLive(){
    // Tasks are now served from Supabase (agency_crm_tasks) — the dead-Espo path
    // was repointed 2026-07-24, so /api/tasks is safe to call again.
    pull('/api/renewals').then(function(d){ if(applyRenewals(d)){ homeFromLive(); render(); } });
    pull('/api/tasks').then(function(d){ if(applyTasks(d)){ homeFromLive(); render(); } });
    pull('/api/commissions').then(function(d){ if(applyCommissions(d)){ homeFromLive(); render(); } });
    pull('/api/cases').then(function(d){ if(applyCases(d)){ homeFromLive(); render(); } });
    pull('/api/carriers').then(function(d){ if(applyCarriers(d)) render(); });
    pull('/api/workspace-stats').then(function(d){ if(applyWorkspaceStats(d)) render(); });
  }

  // The CRM screen's counts. These were hardcoded — '414' clients and '614'
  // policies against a book that actually holds 441 — so the screen looked
  // authoritative while being decorative.
  function applyWorkspaceStats(d){
    if(!d || d._error) return false;
    var n = function(v){ return v==null ? '—' : Number(v).toLocaleString('en-US'); };
    crmKpis = [
      { label:'Clients', value:n(d.clients), sub:'canonical' },
      { label:'Policies', value:n(d.policies), sub:(d.annualized_premium!=null?money(d.annualized_premium)+' annualized':'annualized') },
      { label:'Renewals', value:n(d.renewals), sub:'need attention' },
      { label:'Pipeline', value:n(d.pipeline), sub:'open opportunities' },
      { label:'Open cases', value:n(d.open_cases), sub:'service work' },
      { label:'Open tasks', value:n(d.open_tasks), sub:'case-linked' },
    ];
    crmCardsRaw = [
      { name:'Clients', count:n(d.clients), desc:'NowCerts insured records', to:'crm:clients' },
      { name:'Policies', count:n(d.policies), desc:'Coverage & premium mirrors', to:'crm:policies' },
      { name:'Renewals', count:n(d.renewals), desc:'Own workspace ↗', to:'renewals' },
      { name:'Commissions', count:n(d.commissions), desc:'Reconcile in Finance', to:'finance' },
      { name:'Pipeline', count:n(d.pipeline), desc:'Quote-to-bind workflow', to:'crm:pipeline' },
      { name:'Cases', count:n(d.open_cases), desc:'Agency service work', to:'crm:cases' },
    ];
    sources.workspace = 'live';
    return true;
  }

  // Home's tiles are a roll-up of what the other panels already fetched, so they
  // only ever show a number that actually came back from the API.
  function homeFromLive(){
    homeKpis = [
      { label:'Renewals due', value:(sources.renewals==='live'?String(renewalRows.length):'—'), sub:'need attention', color:'#2F6B4F' },
      { label:'Money to chase', value:(financeOwed!=null?money(financeOwed):'—'), sub:'commission shorts', color:'#B9822A' },
      { label:'Open cases', value:(sources.cases==='live'?String(caseRows.length):'—'), sub:'agency service work', color:'#16233F' },
      { label:'Open tasks', value:(sources.tasks==='live'?String(taskCount):'—'), sub:'across the team', color:'#0F7B6C' },
    ];
  }

  // ---- CRM sub-views (Clients / Policies / Pipeline / Leads) ----------------
  // `force` re-reads a view that is already loaded — what a save or a delete
  // needs, so the list shows what the API returned rather than what was typed.
  function loadCrmView(key, force){
    var cfg = CRM_VIEWS[key];
    if(!cfg || !cfg.endpoint || (crmData[key] && !force)) return;
    crmData[key] = { loading:true };
    render();
    pull(cfg.endpoint).then(function(d){
      if(!d || d._error){ crmData[key] = { error:(d && d._error) || 'no response' }; }
      else {
        var rows = Array.isArray(d) ? d : (Array.isArray(d[cfg.key]) ? d[cfg.key] : null);
        crmData[key] = rows ? { rows:rows } : { error:'unexpected response shape' };
      }
      render();
    });
  }

  function applyCarriers(d){
    if(!d || d._error) return false;
    var list = Array.isArray(d.carriers) ? d.carriers : (Array.isArray(d) ? d : null);
    if(!list || !list.length) return false;
    carrierData = list;
    sources.carrier = 'live';
    return true;
  }

  render();
  fetchLive();
})();
</script>
<script>
// Register the shell service worker. Wrapped and failure-tolerant on purpose:
// registration throws on an insecure origin, and this portal is also reachable
// over plain http on the tailnet IP. A thrown error there would surface in the
// console on every load without changing anything the user can act on.
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){ /* non-fatal */ });
  });
}
</script>
