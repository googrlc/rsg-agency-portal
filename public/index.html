<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSG Agency Portal — Clients, Renewals & Operations</title>
<meta name="description" content="Risk Solutions Group's private agency workspace for clients, policies, renewals, pipeline, service work, intake, and commissions.">
<!-- Installable web app. Requires a secure context, which the tailnet HTTPS URL
     (https://hermes-gretch.tail1cbc83.ts.net:8447) provides; reaching the portal
     over plain http will still work but will not offer to install. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16233F">
<meta name="application-name" content="RSG Portal">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RSG Portal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#F3F4F6;font-family:'Instrument Sans',system-ui,sans-serif;color:#1B1D22}
*{box-sizing:border-box}
a{color:#2563EB;text-decoration:none}a:hover{color:#1d4ed8}
.site-shell{display:flex;height:100dvh;width:100%;overflow:hidden;background:#F3F4F6}
.site-sidebar{width:184px;flex:none;background:#F7F4EC;border-right:1px solid #E7E2D5;display:flex;flex-direction:column;padding:14px 12px 12px;gap:6px;overflow:auto}
.site-brand{display:flex;align-items:center;gap:10px;padding:2px 4px 12px;margin-bottom:2px;border-bottom:1px solid #E7E2D5}
.site-nav{display:contents}
.site-nav-item{appearance:none;font:inherit;text-align:left}
.site-sidebar-foot{margin-top:auto;flex:none;padding:10px 10px 2px;border-top:1px solid #E7E2D5;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9A9384;font-weight:700}
.site-main{flex:1;display:flex;flex-direction:column;min-width:0}
.site-header{height:68px;flex:none;background:rgba(251,249,244,.94);backdrop-filter:blur(14px);border-bottom:1px solid #ECEAE2;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:5}
.site-content{flex:1;position:relative;min-height:0}
.home-page{position:absolute;inset:0;overflow:auto;padding:30px clamp(22px,3vw,42px) 96px}
.home-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px;padding:4px 2px}
.home-eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#2563EB;font-weight:800;margin-bottom:7px}
.home-title{font-family:'Newsreader',Georgia,serif;font-size:clamp(28px,3vw,38px);line-height:1.05;color:#16233F;margin:0;font-weight:500;letter-spacing:-.02em}
.home-subtitle{font-size:14px;color:#6B7078;margin:7px 0 0;line-height:1.5}
.quick-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.quick-action{appearance:none;border:1px solid #DFDED8;background:#fff;color:#30343A;border-radius:10px;padding:9px 12px;font:600 11.5px 'Instrument Sans',system-ui,sans-serif;cursor:pointer;box-shadow:0 1px 1px rgba(20,25,40,.03);white-space:nowrap}
.quick-action.primary{background:#16233F;color:#fff;border-color:#16233F}
.quick-action:hover{border-color:#B8B7B1;transform:translateY(-1px)}
.home-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}
.home-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.section-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#2563EB;font-weight:800;margin-bottom:12px}
.workspace-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.task-panel{background:#fff;border:1px solid #E7E7E4;border-radius:16px;padding:18px 19px;box-shadow:0 10px 30px rgba(22,35,63,.04)}
.service-chip{display:inline-flex;align-items:center;gap:5px;margin-left:auto;border-radius:999px;padding:3px 7px;font-size:9.5px;font-weight:700;white-space:nowrap;background:#F1F3F7;color:#6B7078}
.service-chip i{width:6px;height:6px;border-radius:50%;background:#A8ABB1}
.service-chip.online,.service-chip.connected{background:#E9EFFC;color:#2563EB}.service-chip.online i,.service-chip.connected i{background:#2563EB}
.service-chip.attention{background:#F7EEDB;color:#B9822A}.service-chip.attention i{background:#B9822A}
.service-chip.offline{background:#FBE9E7;color:#B4231F}.service-chip.offline i{background:#B4231F}
.crm-shell{position:absolute;inset:0;display:flex;min-height:0}
.crm-sidebar{width:196px;flex:none;background:#16233F;display:flex;flex-direction:column;padding:18px 12px;overflow:auto}
.crm-subnav{display:flex;flex-direction:column;gap:1px}
.crm-pane{flex:1;min-width:0;position:relative;overflow:auto;padding:24px 26px 86px}
.crm-kpis,.crm-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.crm-kpis{margin-bottom:20px}.crm-cards{padding-bottom:20px}
.crm-table-scroll{overflow:auto;border-radius:13px}
.tile{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,25,40,.10);border-color:#d7d7d2}
.railitem{transition:background .12s ease}
.rowh:hover{background:#FAFAF7}
[role="button"]:focus-visible,.quick-action:focus-visible,.railitem:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(37,99,235,.28);outline-offset:2px}
@media(max-width:1080px){
  .site-sidebar{width:160px}
  .home-layout{grid-template-columns:minmax(0,1fr) 300px;gap:16px}
}
@media(max-width:820px){
  html,body{overflow:hidden}
  .site-shell{flex-direction:column}
  .site-sidebar{width:100%!important;height:auto;max-height:68px;flex-direction:row!important;align-items:center;padding:8px 10px!important;border-right:0!important;border-bottom:1px solid #E7E2D5;overflow-x:auto;overflow-y:hidden;gap:6px!important;scrollbar-width:none}
  .site-sidebar::-webkit-scrollbar{display:none}
  .site-brand{position:sticky;left:0;z-index:3;flex:none;margin:0!important;padding:0 10px 0 0!important;border:0!important;background:#F7F4EC}
  .site-brand-copy{display:none}
  .site-nav{display:flex;gap:6px}
  .site-nav-item{flex:none!important;padding:8px 11px!important}
  .site-sidebar-foot{display:none!important}
  .site-header{height:62px;padding:0 18px}
  .site-header-sub{display:none}
  .home-page{padding:22px 18px 94px}
  .home-hero{align-items:flex-start;flex-direction:column;gap:16px}
  .quick-actions{justify-content:flex-start}
  .home-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-layout{grid-template-columns:1fr}
  .task-panel{width:auto!important}
  .crm-shell{flex-direction:column}
  .crm-sidebar{width:100%;height:auto;max-height:53px;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .crm-sidebar::-webkit-scrollbar{display:none}
  .crm-brand,.crm-connection{display:none!important}
  .crm-subnav{flex-direction:row;gap:4px}
  .crm-nav-item{flex:none!important;white-space:nowrap}
  .crm-pane{padding:18px 16px 88px}
  .crm-kpis,.crm-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  .site-header{height:58px;padding:0 14px}
  .site-header-title{font-size:20px!important}
  .live-badge-copy{display:none}
  .home-page{padding:18px 13px 90px}
  .home-title{font-size:29px}
  .quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
  .quick-action{text-align:center;padding:10px 8px}
  .home-kpi-grid{gap:9px}
  .workspace-grid{grid-template-columns:1fr}
  .crm-kpis,.crm-cards{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){.tile,.railitem,.quick-action{transition:none!important}.tile:hover,.quick-action:hover{transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  // ------------------------------------------------------------------
  // State
  // ------------------------------------------------------------------
  var state = { screen:'home', user:'lamar', done:{}, aiOpen:false, detail:false, caseDetail:false, carrierEmbed:false, financeEmbed:false, financeDetail:false, crmView:'workspace', client:null };
  function setState(patch){ Object.assign(state, patch); render(); }

  // Per-section data source. Starts 'pending' and only ever becomes 'live' — the
  // sample datasets were deleted, so a panel that hasn't loaded says so rather
  // than showing invented clients and premiums.
  var sources = { renewals:'pending', tasks:'pending', commissions:'pending', cases:'pending', carrier:'pending', workspace:'pending' };
  var serviceStates = {}; // id -> browser-safe health returned by /api/services
  var financeOwed = null;   // summed from live commission rows
  var taskCount = 0;        // live task count across the team
  // Pending re-poll of the KPI tiles while the backend is still on the mirror.
  // Held so a burst of renders cannot stack timers on top of each other.
  var workspaceStatsRepoll = null;
  var workspaceStatsTries = 0;

  // Live records are interpolated straight into markup, and a client name is
  // free text someone typed into an AMS — escape it.
  function esc(v){
    return (v==null?'':String(v)).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var selRenewal = null;  // live renewal row chosen for the detail overlay
  var carrierData = null; // cached carrier directory from carrierhub
  // Full apps embedded in the hybrid workspaces, reachable over the tailnet.
  //
  // These MUST be https. The portal is served at https://…ts.net:8447, and a
  // browser silently refuses to load an http iframe inside an https page (mixed
  // content) — the pane just goes blank with nothing but a console warning. The
  // previous http://100.75.67.72:{3200,3100} values were blocked exactly that
  // way, which is why Carrier and Finance never opened here.
  //
  // `tailscale serve` already publishes both over TLS on this host:
  //   :8445 -> 127.0.0.1:3200  carrierhub
  //   :8446 -> 127.0.0.1:3300  commission tracker (the *tailnet* container,
  //            which auto-logs in on the shared account — :3100 is the
  //            public-facing one and would have stopped at a login screen)
  // Both answer with framing allowed (:8446 sends frame-ancestors *).
  //
  // https embeds are also correct when the portal itself is reached over plain
  // http at 100.75.67.72:3400 — a secure frame in an insecure page is fine.
  var TAILNET_BASE = 'https://hermes-gretch.tail1cbc83.ts.net';
  var CARRIERHUB_EMBED = TAILNET_BASE + ':8445/';
  var COMMISSION_EMBED = TAILNET_BASE + ':8446/';
  // NextCloud (Files + Talk). Framing is allowed only from the tailnet HTTPS
  // origin (frame-ancestors https://*.tail1cbc83.ts.net:*), so these panes load
  // when the portal is opened at https://hermes-gretch.tail1cbc83.ts.net:8447/.
  var NEXTCLOUD_BASE = 'https://nextcloud-x6wle-u69864.vm.elestio.app';
  var STORAGE_EMBED = NEXTCLOUD_BASE + '/apps/files/';
  var TALK_EMBED = NEXTCLOUD_BASE + '/apps/spreed/';
  // Deck — the shared boards. Same origin and same framing allowance as Files
  // and Talk, so it embeds on the tailnet https origin exactly like they do.
  var DECK_EMBED = NEXTCLOUD_BASE + '/apps/deck/';
  // True when the portal itself is served from the tailnet HTTPS origin that
  // NextCloud allows to frame it. Over IP:3400 the NextCloud panes are blocked.
  function onTailnetHttps(){ try { return location.protocol==='https:' && /\.ts\.net$/i.test(location.hostname); } catch(e){ return false; } }

  // Full-pane embed for a top-level workspace (thin header + iframe, no back link).
  function embedScreen(title, src, subtitle, accent){
    var blocked = !onTailnetHttps();
    var note = blocked
      ? '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px"><div style="max-width:460px;text-align:center"><div style="font-family:\'Newsreader\',Georgia,serif;font-size:20px;color:#1B1D22;margin-bottom:8px">'+title+' loads over the secure tailnet URL</div><div style="font-size:13px;color:#6B7078;line-height:1.55">NextCloud only allows embedding from the Tailscale HTTPS address. Open the portal at<br><a href="https://hermes-gretch.tail1cbc83.ts.net:8447/" style="color:#2563EB">https://hermes-gretch.tail1cbc83.ts.net:8447/</a><br>to use '+title+' here, or <a href="'+src+'" target="_blank" rel="noopener" style="color:#2563EB">open '+title+' in a new tab ↗</a>.</div></div></div>'
      : '<iframe src="'+src+'" style="flex:1;width:100%;border:0" title="'+title+'" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"></iframe>';
    return '<div style="position:absolute;inset:0;display:flex;flex-direction:column;background:#fff">'
      + '<div style="height:42px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;background:#FBF9F4;border-bottom:1px solid #ECEAE2">'
        + '<span style="width:8px;height:8px;border-radius:3px;background:'+(accent||'#4B77BE')+'"></span>'
        + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:15px;color:#1B1D22">'+title+'</span>'
        + '<span style="font-size:11.5px;color:#96999F">'+(subtitle||'via NextCloud')+'</span>'
        + '<a href="'+src+'" target="_blank" rel="noopener" style="margin-left:auto;font-size:11.5px;color:#2563EB">Open in new tab ↗</a>'
      + '</div>'
      + note
    + '</div>';
  }

  // An http iframe inside an https page is dropped by the browser with no visible
  // error — the operator just gets a white rectangle. Catch that here and say so,
  // rather than shipping a blank pane and calling it an embed.
  function mixedContent(src){
    try { return location.protocol === 'https:' && /^http:\/\//i.test(src); }
    catch(e){ return false; }
  }
  function blockedNote(title, src){
    return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px">'
      + '<div style="max-width:460px;text-align:center">'
        + '<div style="font-family:\'Newsreader\',Georgia,serif;font-size:20px;color:#1B1D22;margin-bottom:8px">'+title+' can\'t be embedded over http</div>'
        + '<div style="font-size:13px;color:#6B7078;line-height:1.55">This portal is served over https, and the browser blocks an insecure frame inside it. '
          + '<a href="'+src+'" target="_blank" rel="noopener" style="color:#2563EB">Open '+title+' in a new tab ↗</a></div>'
      + '</div></div>';
  }

  // Shared inline-embed pane: header bar (back + open-in-new-tab) + iframe.
  function embedPane(backLabel, src, dataAttr, subtitle){
    var body = mixedContent(src)
      ? blockedNote(backLabel, src)
      : '<iframe src="'+src+'" style="flex:1;width:100%;border:0" title="'+backLabel+'" allow="clipboard-read; clipboard-write; fullscreen"></iframe>';
    return '<div style="position:absolute;inset:0;display:flex;flex-direction:column;background:#fff">'
      + '<div style="height:42px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;background:#FBF9F4;border-bottom:1px solid #ECEAE2">'
        + '<div '+dataAttr+'="close" title="Back (Esc)" style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#6B7078;cursor:pointer;font-weight:600">‹ '+backLabel+'</div>'
        + '<div style="width:1px;height:18px;background:#E2E1DC"></div>'
        + '<span style="font-size:11.5px;color:#96999F">'+(subtitle||'Full app · live')+'</span>'
        + '<a href="'+src+'" target="_blank" rel="noopener" style="margin-left:auto;font-size:11.5px;color:#2563EB">Open in new tab ↗</a>'
      + '</div>'
      + body
    + '</div>';
  }
  function anyLive(){ return Object.keys(sources).some(function(k){ return sources[k]==='live'; }); }

  // ------------------------------------------------------------------
  // Static data (ported from the design's renderVals)
  // ------------------------------------------------------------------
  // Finance leads the rail: chasing what's owed is the daily job, so it is the
  // first thing on screen rather than something to scroll past.
  var reg = [
    { key:'finance',  service:'finance',  mono:'CT', railLabel:'Finance',  name:'Finance',       accent:'#B9822A', tint:'#F7EEDB', desc:'Commissions — expected vs received', stat:'—', stat2:'—' },
    { key:'crm',      service:'hermes',   mono:'CR', railLabel:'CRM',      name:'CRM',           accent:'#2563EB', tint:'#E9EFFC', desc:'Client book — accounts, policies, cases', stat:'—', stat2:'—' },
    { key:'renewals', service:'renewals', mono:'RN', railLabel:'Renewals', name:'Renewals',      accent:'#C2410C', tint:'#F7EAE1', desc:'Retention & renewal worklist', stat:'—', stat2:'—' },
    { key:'carrier',  service:'carrier',  mono:'CH', railLabel:'Carrier',  name:'Carrier Hub',   accent:'#2563EB', tint:'#E9EFFC', desc:'Appetite, appointments & submissions', stat:'—', stat2:'—' },
    { key:'intake',   service:'intake',   mono:'IG', railLabel:'Intake',   name:'Intake',        accent:'#B9822A', tint:'#F6EEDB', desc:'Evidence in, assessed & verified out', stat:'—', stat2:'writes locked' },
    { key:'cases',    service:'cases',    mono:'CS', railLabel:'Cases',    name:'Tasks & Cases', accent:'#16233F', tint:'#E7EAF0', desc:'Service work — endorsements, claims, COIs', stat:'—', stat2:'—' },
    { key:'storage',  service:'nextcloud',mono:'ST', railLabel:'Storage',  name:'Storage',       accent:'#4B77BE', tint:'#E9EEF7', desc:'NextCloud files & shared documents', stat:'NextCloud', stat2:'synced' },
    { key:'team',     service:'nextcloud',mono:'TM', railLabel:'Team',     name:'Team Chat',     accent:'#2563EB', tint:'#E9EFFC', desc:'Chat, questions & document sharing', stat:'—', stat2:'channels' },
    { key:'deck',     service:'nextcloud',mono:'DK', railLabel:'Deck',     name:'Deck',          accent:'#6D28D9', tint:'#EDE7FB', desc:'Shared boards — cards, lists & due dates', stat:'—', stat2:'NextCloud Deck' },
    { key:'sops',     service:'nextcloud',mono:'SO', railLabel:'SOPs',     name:'SOPs',          accent:'#8E3B5B', tint:'#F5E9EE', desc:'Standard operating procedures', stat:'—', stat2:'documents' },
  ];

  var people = { lamar:{ name:'Lamar', initial:'L', accent:'#16233F' }, gretchen:{ name:'Gretchen', initial:'G', accent:'#8E3B5B' } };
  // Filled from /api/tasks. Invented work is worse than an empty list: a
  // fabricated "Call Acme Roofing — renewal at risk" is indistinguishable from a
  // real one, and this is the screen someone works from in the morning.
  var tasksByUser = { lamar:[], gretchen:[] };

  // Placeholders until /api/renewals + /api/commissions + /api/tasks land.
  var homeKpis = [
    { label:'Renewals due', value:'—', sub:'need attention this week', color:'#2563EB' },
    { label:'Money to chase', value:'—', sub:'commission shorts', color:'#B9822A' },
    { label:'Open cases', value:'—', sub:'agency service work', color:'#16233F' },
    { label:'Open tasks', value:'—', sub:'assigned across the team', color:'#2563EB' },
  ];

  // CRM
  // `view` opens a CRM sub-view; `go` jumps to a top-level portal screen that
  // already owns that work. These used to be inert <div>s with a pointer cursor
  // and no handler, which is why clicking anything in here did nothing.
  var crmNavRaw = [
    { label:'Workspace', view:'workspace', d:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
    { label:'Clients',   view:'clients',   d:'M4 20a8 8 0 0 1 16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8' },
    { label:'Policies',  view:'policies',  d:'M7 3h7l5 5v13H7zM14 3v5h5' },
    { label:'Pipeline',  view:'pipeline',  d:'M3 5h18l-7 8v6l-4-2v-4z' },
    { label:'Quotes',    view:'quotes',    d:'M7 3h7l5 5v13H7zM14 3v5h5M9 13h6M9 17h4' },
    { label:'Cases',     view:'cases',     d:'M4 8h16v11H4zM9 8V5h6v3' },
    { label:'Tasks',     view:'tasks',     d:'M5 6h11M5 12h11M5 18h7M18 15l2 2 4-4' },
    { label:'Leads',     view:'leads',     d:'M4 20V10M10 20V4M16 20v-7M22 20H2' },
    { label:'Ask Hermes',ai:true,          d:'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z' },
  ];
  // Placeholders only — every one of these is replaced by /api/workspace-stats on
  // load. They shipped as hardcoded strings (414 clients, 614 policies) against a
  // book that actually holds 441 policies, so the screen read as authoritative
  // while being decorative. Kept solely so the layout has something to draw
  // before the first response lands.
  var crmKpis = [
    { label:'Clients', value:'—', sub:'canonical' }, { label:'Policies', value:'—', sub:'annualized' }, { label:'Renewals', value:'—', sub:'need attention' },
    { label:'Pipeline', value:'—', sub:'open opportunities' }, { label:'Open cases', value:'—', sub:'service work' }, { label:'Open tasks', value:'—', sub:'case-linked' },
  ];
  var crmCardsRaw = [
    { name:'Clients', count:'—', desc:'NowCerts insured records', to:'crm:clients' },
    { name:'Policies', count:'—', desc:'Coverage & premium mirrors', to:'crm:policies' },
    { name:'Renewals', count:'—', desc:'Own workspace ↗', to:'renewals' },
    { name:'Commissions', count:'—', desc:'Reconcile in Finance', to:'finance' },
    { name:'Pipeline', count:'—', desc:'Quote-to-bind workflow', to:'crm:pipeline' },
    { name:'Cases', count:'—', desc:'Agency service work', to:'crm:cases' },
  ];
  // Which CRM sub-view is open. 'workspace' is the overview above; the rest are
  // real tables fed by the endpoints server.js now proxies.
  var CRM_VIEWS = {
    workspace: { label:'Workspace' },
    clients:   { label:'Clients',  endpoint:'/api/clients',  key:'clients',
                 cols:[['insured_name','Client'],['client_type','Type'],['city','City'],['state','State'],['email','Email'],['phone','Phone']] },
    policies:  { label:'Policies', endpoint:'/api/policies', key:'policies',
                 cols:[['insured_name','Client'],['policy_number','Policy #'],['carrier','Carrier'],['lines_of_business','LOB'],['status','Status'],['expiration_date','Expires'],['annualized_premium','Annualized','money']] },
    pipeline:  { label:'Pipeline', endpoint:'/api/pipeline', key:'opportunities',
                 // Carrier came off to make room for the two dates: it is on the
                 // board tile and the deal card, and a pipeline you cannot date is

          + '<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#A2A5AC;margin:4px 0 13px"><svg width="12" height="12" viewBox="0 0 24 24" fill="#0082C9"><circle cx="12" cy="12" r="11"></circle></svg>via NextCloud Tasks</div>'
          + '<div style="display:flex;gap:4px;background:#F1F1ED;border-radius:9px;padding:3px;margin-bottom:6px">'
            + '<div data-user="lamar" style="'+pill(u==='lamar')+'">Lamar</div>'
            + '<div data-user="gretchen" style="'+pill(u==='gretchen')+'">Gretchen</div>'
          + '</div>'
          + '<div style="display:flex;flex-direction:column">'
            + (tasks || '<div style="padding:18px 2px;font-size:12.5px;color:#96999F">'
                 + (sources.tasks==='live' ? 'Nothing due — queue is clear.'
                                           : 'Loading tasks…') + '</div>')
          + '</div>'
        + '</aside>'
      + '</div>'
    + '</main>';
  }

  // Status/priority wording differs between cases and tasks (open / not_started
  // / in_progress / high…), so colour by meaning rather than by exact string.
  var crmChip = {
    open:['#B9822A','#F7EEDB'], not_started:['#6B7078','#EFEFEC'], in_progress:['#2563EB','#E9EFFC'],
    waiting:['#B9822A','#F7EEDB'], blocked:['#B4231F','#FBE9E7'], overdue:['#B4231F','#FBE9E7'],
    closed:['#2563EB','#E9EFFC'], done:['#2563EB','#E9EFFC'], completed:['#2563EB','#E9EFFC'], resolved:['#2563EB','#E9EFFC'],
    high:['#B4231F','#FBE9E7'], urgent:['#B4231F','#FBE9E7'], medium:['#B9822A','#F7EEDB'], normal:['#6B7078','#EFEFEC'], low:['#6B7078','#EFEFEC'],
  };
  function chipHtml(v){
    if(v==null||v==='') return '—';
    var k = String(v).toLowerCase().replace(/[\s-]+/g,'_');
    var c = crmChip[k] || ['#6B7078','#EFEFEC'];
    var label = String(v).replace(/_/g,' ');
    return '<span style="font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;color:'+c[0]+';background:'+c[1]+'">'+esc(label)+'</span>';
  }
  // A due date is the whole point of a task list, so say when it has passed.
  //
  // A bare date-only string parses as UTC midnight, which in Eastern time is the
  // evening BEFORE — an x-date of the 1st rendered as "Sep 30". Read those as
  // local dates instead; timestamps (which carry a zone) are left alone.
  function dateMs(v){
    var s = String(v);
    var ymd = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if(ymd) return new Date(+ymd[1], +ymd[2]-1, +ymd[3]).getTime();
    return new Date(s).getTime();
  }
  function dueHtml(v, overdueWord){
    if(!v) return '—';
    var t = dateMs(v);
    if(isNaN(t)) return esc(String(v));
    var d = new Date(t), today = new Date(); today.setHours(0,0,0,0);
    // The year matters on a renewal or an x-date — "Sep 3" is a different call
    // depending on whether it is this year's or next.
    var opts = {month:'short',day:'numeric'};
    if(d.getFullYear() !== today.getFullYear()) opts.year = 'numeric';
    var txt = d.toLocaleDateString('en-US',opts);
    if(t < today.getTime()) return '<span style="color:#B4231F;font-weight:600">'+txt+' · '+(overdueWord||'overdue')+'</span>';
    return esc(txt);
  }
  function sourceChip(v){
    var ams = String(v||'') === 'nowcerts';
    return '<span title="'+(ams ? 'A prospect created in NowCerts. Read-only here.'
                                : 'A lead the agency holds in the CRM. Never sent to NowCerts.')
      + '" style="font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;'
      + (ams ? 'color:#B9822A;background:#F7EEDB' : 'color:#2563EB;background:#E9EFFC')+'">'
      + (ams ? 'NowCerts' : 'CRM') + '</span>';
  }

  // A policy's term, as a period. "Renews in 30 days" reads very differently on a
  // policy written last month than on one that has been in force a year, and the
  // renewal list has never shown the start of the term at all.
  function shortDate(v){
    if (!v) return null;
    var t = dateMs(v);
    if (isNaN(t)) return null;
    return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }
  function policyPeriod(eff, exp){
    var a = shortDate(eff), b = shortDate(exp);
    if (a && b) return a + ' → ' + b;
    return b ? 'ends ' + b : (a ? 'from ' + a : '—');
  }
  // A projected close date, with where it came from. "Slipped" rather than
  // "overdue": a close date in the past is a deal that did not land when it was
  // meant to, which is a conversation, not a missed chore.
  function closeHtml(r, v){
    if(!v) return '—';
    var basis = r.projected_close_basis;
    var html = dueHtml(v, 'slipped');
    if(basis && basis !== 'set'){
      html += '<span title="No close date set — showing the '+esc(basis)+' date."'
            + ' style="color:#B9822A;font-size:11px"> ~</span>';
    }
    return html;
  }
  // NowCerts GUIDs are read-only: fine to show — they are how you match a record
  // against the AMS — but never editable. The enforcement is the override
  // allowlist, which carries no identifier, not the renderer.
  function crmCell(r, c){
    var v = r[c[0]], fmt = c[2], txt;
    if(fmt==='money') txt = money(v);
    else if(fmt==='chip') txt = chipHtml(v);
    else if(fmt==='date') txt = dueHtml(v);
    // A projected close nobody set is the backend's fallback (needed by, or the
    // quote's effective date). Shown, because a dated pipeline beats an empty
    // one — but marked, because a date nobody chose is not a commitment.
    else if(fmt==='closedate') txt = closeHtml(r, v);
    else if(fmt==='person') txt = (v ? esc(nameFromEmail(v)) : '—');
    // Where a lead is held. Ours can be worked; a NowCerts prospect is read-only
    // here, and saying so is kinder than a card that refuses to save.
    else if(fmt==='source') txt = sourceChip(v);
    // Renewal work vs acquisition work — the table's version of the board's
    // two ladders, so the distinction survives when you sort or page.
    else if(fmt==='dealtype') txt = (v ? dealTypeChip(r) : '—');
    // A task is case work, client work, or purely internal. Which it is, is the
    // difference between a task list and a pile.
    else if(fmt==='scope') txt = chipHtml(v ? 'case' : (r.insured_database_id ? 'client' : 'internal'));
    else txt = (v==null||v==='' ? '—' : esc(String(v)));
    return '<span style="font-size:12.5px;color:#3D4149;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'
         + (fmt==='money'?';text-align:right;font-variant-numeric:tabular-nums':'')+'">'+txt+'</span>';
  }

  // ---- Client 360 -----------------------------------------------------------
  // The CRM was a set of read-only lists; this is the "open a client and work on
  // them" surface. Edits are corrections (overrides) held in the portal, NOT
  // writes to NowCerts — AMS write-back is a separate decision.
  var CLIENT_FIELDS = [
    ['insured_name','Name'], ['client_type','Type'], ['email','Email'], ['phone','Phone'],
    ['address','Address'], ['city','City'], ['state','State'], ['zip','ZIP'], ['notes','Notes'],
  ];

  // One field renderer for every editable surface. `kind` names the buffer the
  // field writes into ('client', 'policy', 'work', 'renewal'); a field carries
  // its own kind so a single input handler can serve all of them.
  //
  // opts: { overridden, options (a select), wide, area (a textarea), placeholder,
  //         date (a date picker), hint (a line under the input) }
  function editField(kind, rec, key, label, opts){
    opts = opts || {};
    var buf = edits[kind];
    var ovr = opts.overridden || {};
    var pending = Object.prototype.hasOwnProperty.call(buf, key);
    var corrected = Object.prototype.hasOwnProperty.call(ovr, key);
    var val = pending ? buf[key] : (rec[key] == null ? '' : String(rec[key]));
    // A DATE column comes back as YYYY-MM-DD, but a corrected or synced value can
    // arrive as a full timestamp; <input type="date"> silently shows nothing for
    // anything longer, so the field would read as empty on a row that has a date.
    if (opts.date) val = String(val).slice(0, 10);
    var id = kind + ':' + key;
    var box = 'border:1px solid '+(pending?'#B9822A':'#E6E6E2')+';border-radius:9px;padding:8px 11px;font:inherit;'
            + 'font-size:13px;color:#25282E;width:100%;box-sizing:border-box;background:'+(pending?'#FFFBF2':'#fff');

    var control;
    if (opts.options) {
      control = '<select data-efield="'+id+'" style="'+box+'">'
        + opts.options.map(function(o){
            var v = (typeof o === 'string') ? o : o[0], t = (typeof o === 'string') ? o : o[1];
            return '<option value="'+esc(v)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(t)+'</option>';
          }).join('')
        + '</select>';
    } else if (opts.area) {
      control = '<textarea data-efield="'+id+'" rows="4" style="'+box+';resize:vertical;line-height:1.45">'+esc(val)+'</textarea>';
    } else {
      control = '<input data-efield="'+id+'"'+(opts.date?' type="date"':'')+' value="'+esc(val)+'"'
        + (opts.placeholder ? ' placeholder="'+esc(opts.placeholder)+'"' : '')
        + ' style="'+box+'"/>';
    }

    return '<div style="display:flex;flex-direction:column;gap:4px;min-width:0'+(opts.wide?';grid-column:1/-1':'')+'">'
      + '<label style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#96999F;font-weight:700">'+label
        + (corrected ? ' <span title="Corrected in the portal. NowCerts still shows the old value." style="color:#B9822A">· corrected</span>' : '')
      + '</label>'
      + control
      + (opts.hint ? '<span style="font-size:11px;color:#9A9EA6">'+esc(opts.hint)+'</span>' : '')
      + (corrected
          ? '<span style="font-size:11px;color:#9A9EA6">AMS: '+esc(ovr[key]==null?'(blank)':String(ovr[key]))+'</span>' : '')
    + '</div>';
  }

  // Save / Discard / close, rendered the same way on every card.
  //
  // Save is always on the card, greyed until there is something to save. It used
  // to appear only once a field went dirty, which meant the answer to "where do
  // I save this?" was "type something and find out".
  function cardActions(kind, extra, recId){
    var dirty = Object.keys(edits[kind]).length;
    var save = dirty
      ? 'color:#fff;background:#2563EB;cursor:pointer'
      : 'color:#B7BAC0;background:#F1F1EE;cursor:default';
    return '<div style="display:flex;align-items:center;gap:10px">'
      + (recId ? amsBadge(recId) : '')
      + (extra || '')
      + (dirty ? '<span data-edit="'+kind+':discard" style="font-size:12px;color:#6B7078;cursor:pointer">Discard</span>' : '')
      + '<span'+(dirty?' data-edit="'+kind+':save"':'')+' style="font-size:12px;font-weight:600;border-radius:8px;padding:7px 13px;'+save+'">'
        + (dirty ? 'Save '+dirty+' change'+(dirty===1?'':'s') : 'Save') + '</span>'
      + '<span data-edit="'+kind+':close" title="Close (Esc)" style="font-size:16px;line-height:1;color:#9A9EA6;cursor:pointer;padding:0 2px">×</span>'
    + '</div>';
  }

  // `rowAttr` optionally makes rows clickable — it returns the attributes for a
  // row (e.g. which policy to open). Lists without one stay read-only.
  // `action` is a button in the list's header, for adding to it.
  function miniList(title, rows, cols, empty, rowAttr, action){
    var head = cols.map(function(c){ return '<span>'+c[1]+'</span>'; }).join('');
    var grid = 'display:grid;grid-template-columns:repeat('+cols.length+',minmax(0,1fr));gap:10px;';
    var body = rows.length
      ? rows.map(function(r){
          var a = rowAttr ? rowAttr(r) : '';
          return '<div'+(a?' class="rowh" '+a:'')+' style="'+grid+'padding:9px 14px;border-top:1px solid #F2F2EE'
            + (a?';cursor:pointer':'')+'">'
            + cols.map(function(c){ return crmCell(r, c); }).join('') + '</div>';
        }).join('')
      : '<div style="padding:16px 14px;font-size:12.5px;color:#96999F">'+empty+'</div>';
    return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:12px;overflow:hidden">'
      + '<div style="padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px">'
        + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:15px;color:#1B1D22">'+title
          + ' <span style="font-size:11.5px;color:#9A9EA6">'+rows.length+'</span></span>'
        + (action || '')
      + '</div>'
      + (rows.length ? '<div style="'+grid+'padding:8px 14px;background:#FAFAF7;border-top:1px solid #EFEFEB;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#96999F;font-weight:700">'+head+'</div>' : '')
      + body
    + '</div>';
  }

  // ---- Policy corrections ---------------------------------------------------
  // Same override mechanism as the client record, one rule tighter: everything
  // NowCerts uses to identify the policy — its GUID, the insured's GUID, the
  // renewed_policy link, the policy number — is shown but never editable. Those
  // are how the row is matched back to the AMS and how a renewal is tied to the
  // term it replaced; changing one detaches the record instead of fixing it.
  var POLICY_FIELDS = [
    ['carrier','Carrier'], ['lines_of_business','Line of business'],
    ['status','Status'], ['effective_date','Effective date'],
    ['expiration_date','Expiration date'],
    ['premium_amount','Premium'], ['annualized_premium','Annualized premium'],
  ];
  var POLICY_IDS = [
    ['policy_number','Policy number'], ['renewed_policy','Renews'],
    ['policy_guid','NowCerts policy ID', true],
  ];

  // An identifier, rendered as what it is: readable, copyable, not an input.
  // A GUID gets the full row — a truncated identifier you have to hover to read
  // is the reason people go back to opening the AMS to check they have the right
  // record.
  function readonlyId(label, value, wide){
    return '<div style="display:flex;flex-direction:column;gap:3px;min-width:0'
      + (wide?';grid-column:1/-1':'')+'">'
      + '<span style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#96999F;font-weight:700">'+label+'</span>'
      + '<span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#6B7078;'
        + 'user-select:all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(String(value||'—'))+'">'
        + esc(value == null || value === '' ? '—' : String(value)) + '</span>'
    + '</div>';
  }

  // A policy can be opened from the client 360 or from the Policies list, and
  // "new" is a policy that does not exist yet — same card, empty record.
  function policyRecord(){
    if (policyOpen === 'new') return policyDraft;
    var fromClient = clientData ? clientData.policies : null;
    var fromTable = (crmData.policies || {}).rows;
    var pools = (state.crmView === 'client') ? [fromClient, fromTable] : [fromTable, fromClient];
    for (var p=0;p<pools.length;p++){
      var rows = pools[p] || [];
      for (var i=0;i<rows.length;i++) if (rows[i].policy_guid === policyOpen) return rows[i];
    }
    return null;
  }

  function renderPolicyCard(){
    if (policyOpen === 'new') return renderNewPolicyCard();
    var rec = policyRecord();
    if (!rec) return '';
    var ovr = rec._overridden || {};

    return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px">'
        + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">Policy '
          + esc(rec.policy_number || '—')+'</span>'
        + cardActions('policy', '', rec.policy_guid)
      + '</div>'
      + '<div style="font-size:11px;color:#9A9EA6;margin-bottom:13px">Identifiers come from NowCerts and are read-only.</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:11px 13px;background:#FAFAF7;border:1px solid #EFEFEB;border-radius:10px;margin-bottom:14px">'
        + POLICY_IDS.map(function(f){ return readonlyId(f[1], rec[f[0]], f[2]); }).join('')
      + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px">'
        + POLICY_FIELDS.map(function(f){ return editField('policy', rec, f[0], f[1], {overridden:ovr}); }).join('')
      + '</div>'
    + '</div>';
  }

  // ---- Adding a policy ------------------------------------------------------
  // A new policy is created in NowCerts, not in the mirror: the AMS owns what a
  // client has bound, and a row invented in canonical_policies would be
  // tombstoned by the next import. It therefore needs a client that the AMS can
  // confirm — pre-filled when you started from that client's page.
  var NEW_POLICY_FIELDS = [
    ['policy_number','Policy number', {wide:true}], ['carrier','Carrier'],
    ['lines_of_business','Line of business'],
    ['effective_date','Effective date', {placeholder:'YYYY-MM-DD'}],
    ['expiration_date','Expiration date', {placeholder:'YYYY-MM-DD'}],
    ['premium_amount','Premium'],
  ];

  function renderNewPolicyCard(){
    var known = policyDraft.insured_id;
    return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px">'
        + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">New policy</span>'
        + '<div style="display:flex;align-items:center;gap:10px">'
          + '<span data-edit="policy:create" style="font-size:12px;font-weight:600;color:#fff;background:#2563EB;border-radius:8px;padding:7px 13px;cursor:pointer">Create in NowCerts</span>'
          + '<span data-edit="policy:close" title="Close (Esc)" style="font-size:16px;line-height:1;color:#9A9EA6;cursor:pointer;padding:0 2px">×</span>'
        + '</div>'
      + '</div>'
      + '<div style="font-size:11px;color:#9A9EA6;margin-bottom:13px">This writes to NowCerts. The CRM will show it after the next sync.</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px">'
        + (known
            ? '<div style="grid-column:1/-1">'+readonlyId('Client',
                (policyDraft.insured_name || '') + ' · ' + policyDraft.insured_id, true)+'</div>'
            : editField('policy', policyDraft, 'insured_id', 'Client (NowCerts insured ID)',
                        {wide:true, placeholder:'open a client and add from there, or paste the insured GUID'}))
        + NEW_POLICY_FIELDS.map(function(f){ return editField('policy', policyDraft, f[0], f[1], f[2]); }).join('')
      + '</div>'
    + '</div>';
  }

  // ---- Pipeline -------------------------------------------------------------
  // Opportunities are the CRM's own records — an edit is a real write, not an
  // override. The board's columns come from the backend so they cannot drift
  // from what a stage move will be allowed to set.
  //
  // The three dates are the forecast and its bounds. Projected close is ours to
  // set; needed-by and the x-date come from NowCerts and say when the client
  // needs cover in force and when their current cover runs out — which is what
  // makes a close date credible or not.
  var DEAL_FIELDS = [
    ['insured_name','Client', {wide:true}], ['line_of_business','Line of business'],
    ['carrier','Carrier'], ['premium_estimate','Premium estimate'],
    ['assigned_to_email','Owner'], ['next_action','Next action', {wide:true}],
    // Required before a won deal can be filed in NowCerts — a policy cannot be
    // recorded in the AMS without its number, and inventing one is not an option.
    ['policy_number','Policy # (once bound)'],
    ['expected_close_date','Projected close', {date:true}],
    ['needed_by','Needed by', {date:true}],
    ['expiration_date','X-date (current cover expires)', {date:true}],
    ['description','Notes', {wide:true, area:true}],
  ];

  // What the card shows under "Projected close" when nobody has set one.
  function closeHint(rec){
    if (!rec || rec.expected_close_date) return '';
    if (!rec.projected_close_date) return 'Not set — this deal has no date on the board.';
    return 'Not set. The board is showing the ' + (rec.projected_close_basis || '')
         + ' date, ' + rec.projected_close_date + '.';
  }

  function dealRecord(){
    if (dealOpen === 'new') return dealDraft;
    var rows = (crmData.pipeline || {}).rows || (clientData && clientData.opportunities) || [];
    for (var i=0;i<rows.length;i++) if (String(rows[i].id) === String(dealOpen)) return rows[i];
    return null;
  }

  // Renewal work and acquisition work are two different pipelines that happen to
  // share a table: different stage ladders, different questions, often different
  // people. Mixed on one board they read as one funnel, and a renewal sitting in
  // "Sent For Quoting" means nothing.
  //
  // Which types count as renewal comes from the backend — the same list that
  // validates a stage move. A substring test here would sweep in "Remarket",
  // which is a third thing again.
  function isRenewalDeal(r){
    var types = (pipelineStages && pipelineStages.renewal_types) || ['Renewals'];
    return types.indexOf(String(r.opportunity_type || '').trim()) >= 0;
  }

  function stageOptions(rec){
    var s = pipelineStages;
    if (!s) return null;
    return isRenewalDeal(rec) ? s.renewal : s.new_business;
  }

  function splitDeals(rows){
    var ren = [], nb = [];
    (rows || []).forEach(function(r){ (isRenewalDeal(r) ? ren : nb).push(r); });
    return { renewal: ren, new_business: nb };
  }

  // On any mixed list — the table, a client's opportunities — say which is which.
  function dealTypeChip(r){
    if (!r || !r.opportunity_type) return '';
    var ren = isRenewalDeal(r);
    return '<span style="font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;'
      + (ren ? 'color:#C2410C;background:#F7EAE1' : 'color:#2563EB;background:#E9EFFC')+'">'
      + esc(ren ? 'Renewal' : r.opportunity_type) + '</span>';
  }

  function renderDealCard(){
    if (!dealOpen) return '';
    var rec = dealRecord();
    if (!rec) return '';
    var isNew = dealOpen === 'new';
    var stages = stageOptions(rec);

    return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px">'
        + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">'
          + (isNew ? 'New deal' : esc(rec.insured_name || rec.line_of_business || 'Deal')) + '</span>'
        + (isNew
            ? '<div style="display:flex;align-items:center;gap:10px">'
              + '<span data-edit="deal:create" style="font-size:12px;font-weight:600;color:#fff;background:#2563EB;border-radius:8px;padding:7px 13px;cursor:pointer">Create deal</span>'
              + '<span data-edit="deal:close" title="Close (Esc)" style="font-size:16px;line-height:1;color:#9A9EA6;cursor:pointer;padding:0 2px">×</span>'
            + '</div>'
            : cardActions('deal'))
      + '</div>'
      + (isNew ? '' : '<div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:11px 13px;background:#FAFAF7;border:1px solid #EFEFEB;border-radius:10px;margin:9px 0 14px">'
          + readonlyId('Deal ID', rec.id, true)
          + readonlyId('Stage', rec.stage) + readonlyId('Status', rec.status)
        + '</div>')
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px">'
        + (isNew ? editField('deal', rec, 'insured_id', 'Client (NowCerts insured ID)', {wide:true}) : '')
        + DEAL_FIELDS.map(function(f){
            // The projected-close field says, under itself, which date the board is
            // falling back to — otherwise an empty box next to a dated tile reads
            // as a bug.
            var o = f[2];
            if (f[0] === 'expected_close_date') {
              o = Object.assign({}, o || {}, { hint: closeHint(rec) });
            }
            return editField('deal', rec, f[0], f[1], o);
          }).join('')
        + (pipelineStages && pipelineStages.types
            ? editField('deal', rec, 'opportunity_type', 'Pipeline', {options:pipelineStages.types}) : '')
        + (stages ? editField('deal', rec, 'stage', 'Stage', {options:stages}) : '')
      + '</div>'
      // The deal's history. Partly written here, partly by the backend: stage
      // moves and AMS filings log themselves, so this is the one place that can
      // answer "who moved this to Lost, and when, and why".
      + (isNew ? ''
          : dealEvents === null
            ? '<div style="margin-top:16px;padding-top:14px;border-top:1px solid #EFEFEB;font-size:12px;color:#96999F">Loading history…</div>'
            : timelineBlock('History', dealEvents.map(function(e){
                return { text:e.summary, who:e.actor_email, when:e.created_at, kind:e.event_type };
              }), 'data-dealnote="1"', dealNoteDraft, 'deal:note'))
    + '</div>';
  }

  // The board. One column per stage, cards in it, click to open — the same card
  // the list view opens, so there is one editor rather than two.
  function renderKanban(){
    var d = crmData.pipeline || {};
    if (d.loading || (!d.rows && !d.error)) return '<div style="padding:26px 2px;font-size:12.5px;color:#96999F">Loading pipeline…</div>';
    if (d.error) return '<div style="padding:26px 2px;font-size:12.5px;color:#B4231F">Couldn\'t load the pipeline — '+esc(d.error)+'</div>';
    var split = splitDeals(d.rows || []);
    var rows = split[pipelineKind] || [];
    var stages = (pipelineStages && pipelineStages[pipelineKind]) || [];
    if (!stages.length) return '<div style="padding:26px 2px;font-size:12.5px;color:#96999F">Loading stages…</div>';
    if (!rows.length) {
      return '<div style="padding:26px 2px;font-size:12.5px;color:#96999F">No '
        + (pipelineKind === 'renewal' ? 'renewal' : 'new-business') + ' deals on the board.</div>';
    }

    // Anything whose stage is not on the board still has to appear somewhere —
    // a deal you cannot see is a deal nobody works.
    var known = {}; stages.forEach(function(s){ known[s] = []; });
    var stray = [];
    rows.forEach(function(r){ (known[r.stage] ? known[r.stage] : stray).push(r); });

    var cols = stages.map(function(s){
      var items = known[s], sum = items.reduce(function(a,r){ return a + (parseFloat(r.premium_estimate)||0); }, 0);
      return '<div data-stagecol="'+esc(s)+'" style="flex:0 0 262px;display:flex;flex-direction:column;background:#FAFAF7;border:1px solid #EFEFEB;border-radius:12px;max-height:100%">'
        + '<div style="padding:11px 13px;border-bottom:1px solid #EFEFEB">'
          + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">'
            + '<span style="font-size:12px;font-weight:700;color:#3D4149">'+esc(s)+'</span>'
            + '<span style="font-size:11px;font-weight:700;color:#6B7078;background:#EFEFEC;border-radius:999px;padding:2px 8px">'+items.length+'</span>'
          + '</div>'
          + '<div style="font-size:11px;color:#9A9EA6;margin-top:3px">'+(sum ? money(sum) : '—')+'</div>'
        + '</div>'
        + '<div style="flex:1;overflow:auto;padding:9px;display:flex;flex-direction:column;gap:8px">'
          + (items.length ? items.map(dealTile).join('')
              : '<div style="font-size:11.5px;color:#B4B7BD;padding:8px 4px">Nothing here.</div>')
        + '</div>'
      + '</div>';
    }).join('');

    // The board is eight stages wide and the window fits about four. It has always
    // scrolled, but nothing said so: no visible scrollbar on macOS, no grab
    // cursor, and the only gesture that worked was a two-finger swipe most people
    // never tried on a desktop app. So half the pipeline was invisible — including
    // Bound/Won, which is the end everyone wants to see.
    //
    // Three ways through it now: the arrows, a click-drag on the background, and
    // the arrow keys. The drag deliberately ignores anything starting on a card —
    // cards are draggable to move a deal between stages, and stealing that gesture
    // would break the board's main interaction to fix its navigation.
    return '<div style="position:relative">'
      + '<span data-boardpan="-1" title="Earlier stages" style="'+BOARD_ARROW+'left:-6px">‹</span>'
      + '<span data-boardpan="1" title="Later stages" style="'+BOARD_ARROW+'right:-6px">›</span>'
      + '<div id="pipeBoard" tabindex="0" style="display:flex;gap:12px;align-items:stretch;overflow-x:auto;padding-bottom:10px;min-height:0;scroll-behavior:smooth;cursor:grab;outline:none">'
      + cols
      + (stray.length
          ? '<div style="flex:0 0 262px;display:flex;flex-direction:column;background:#FBF4E9;border:1px solid #F0E2CB;border-radius:12px">'
            + '<div style="padding:11px 13px;border-bottom:1px solid #F0E2CB"><span style="font-size:12px;font-weight:700;color:#B9822A">Off the board</span>'
            + '<div style="font-size:11px;color:#B9822A;margin-top:3px">'+stray.length+' on a stage the '
              + (pipelineKind === 'renewal' ? 'renewal' : 'new-business') + ' ladder does not use</div></div>'
            + '<div style="flex:1;overflow:auto;padding:9px;display:flex;flex-direction:column;gap:8px">'+stray.map(dealTile).join('')+'</div>'
          + '</div>'
          : '')
      + '</div>'
    + '</div>';
  }

  var BOARD_ARROW = 'position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:30px;height:30px;'
    + 'display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;'
    + 'border:1px solid #E2E1DC;box-shadow:0 2px 8px rgba(0,0,0,.10);cursor:pointer;'
    + 'font-size:17px;color:#3D4149;user-select:none;';

  // One column per press, so a click lands somewhere legible instead of halfway
  // between two stages.
  var BOARD_STEP = 274;   // 262px column + 12px gap

  function panBoard(dir){
    var b = document.getElementById('pipeBoard');
    if (b) b.scrollLeft += dir * BOARD_STEP;
  }

  // Click-drag to pan, but only from the background. A drag that starts on a card
  // is the card's — that gesture moves a deal to another stage.
  function wireBoardDrag(){
    var b = document.getElementById('pipeBoard');
    if (!b || b.dataset.panWired) return;
    b.dataset.panWired = '1';
    var down = false, startX = 0, startLeft = 0, moved = false;
    b.addEventListener('pointerdown', function(e){
      if (e.target.closest('[data-deal]')) return;      // the card's drag, not ours
      down = true; moved = false; startX = e.clientX; startLeft = b.scrollLeft;
      b.style.scrollBehavior = 'auto'; b.style.cursor = 'grabbing';
    });
    b.addEventListener('pointermove', function(e){
      if (!down) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 3) moved = true;
      b.scrollLeft = startLeft - dx;
    });
    var end = function(){
      if (!down) return;
      down = false; b.style.cursor = 'grab'; b.style.scrollBehavior = 'smooth';
    };
    b.addEventListener('pointerup', end);
    b.addEventListener('pointerleave', end);
    // A pan that moved should not also count as a click on whatever is under the
    // cursor when you let go.
    b.addEventListener('click', function(e){ if (moved) { e.stopPropagation(); moved = false; } }, true);
    b.addEventListener('keydown', function(e){
      if (e.key === 'ArrowRight') { panBoard(1); e.preventDefault(); }
      if (e.key === 'ArrowLeft')  { panBoard(-1); e.preventDefault(); }
    });
  }

  function dealTile(r){
    var prem = r.premium_estimate != null ? money(r.premium_estimate) : '';
    // The date belongs on the card, not one click away: a column of tiles with no
    // dates cannot answer "what lands this month", which is the question a board
    // exists to answer. Renewals are dated by the policy they renew, everything
    // else by its projected close.
    var ren = isRenewalDeal(r);
    var when = ren ? r.expiration_date : r.projected_close_date;
    var dateLine = when
      ? '<div style="font-size:11px;color:#6B7078;margin-top:5px">'
        + (ren ? 'Expires ' : 'Close ') + (ren ? dueHtml(when) : closeHtml(r, when)) + '</div>'
      : '';
    return '<div class="tile" draggable="true" data-deal="'+esc(r.id)+'" style="background:#fff;border:1px solid #E7E7E4;border-radius:10px;padding:10px 11px;cursor:grab">'
      + '<div style="font-size:12.5px;color:#1B1D22;font-weight:500;line-height:1.35">'+esc(r.insured_name || '—')+'</div>'
      + '<div style="font-size:11.5px;color:#787C84;margin-top:3px">'+esc(r.line_of_business || '—')+'</div>'
      + (prem ? '<div style="font-size:12px;color:#2563EB;font-weight:600;margin-top:5px">'+prem+'</div>' : '')
      + dateLine
      + (r.carrier ? '<div style="font-size:11px;color:#9A9EA6;margin-top:2px">'+esc(r.carrier)+'</div>' : '')
      + (r.opportunity_type && r.opportunity_type !== 'New Business' && !isRenewalDeal(r)
          ? '<div style="margin-top:6px">'+dealTypeChip(r)+'</div>' : '')
    + '</div>';
  }

  // ---- The lead station -----------------------------------------------------
  // A lead is someone worth calling who is not yet a deal. They are held HERE and
  // never sent to NowCerts: a name from a networking event is not a record of
  // insurance. A lead reaches the AMS by becoming a deal and that deal being won.
  var LEAD_STATUSES = ['new','working','quoted','converted','lost'];
  var LEAD_TYPES = ['', 'Personal', 'Commercial'];
  var LEAD_FIELDS = [
    ['name','Name', {wide:true}], ['company','Company'], ['lead_type','Type', {options:LEAD_TYPES}],
    ['phone','Phone'], ['email','Email'],
    ['city','City'], ['state','State'],
    ['lines_of_business','Lines wanted'], ['premium_estimate','Premium estimate'],
    // The x-date is the whole reason a lead has a deadline.
    ['x_date','X-date (current cover expires)', {date:true}],
    ['status','Status', {options:LEAD_STATUSES}],
    ['owner_email','Owner'], ['lead_source','Source'],
    ['next_action','Next action'], ['next_action_date','Next action on', {date:true}],
  ];

  function leadRecord(){
    if (leadOpen === 'new') return leadDraft;
    return (leadData && leadData.lead) || null;
  }

  function openLead(id){
    leadOpen = id; leadData = null; edits.lead = {}; leadNoteDraft = '';
    render();
    pull('/api/leads/'+encodeURIComponent(id)).then(function(d){
      if (d && !d._error) leadData = d;
      render();
    });
  }

  function closeLead(){
    if (!leadOpen) return true;
    var pending = Object.keys(edits.lead).length
      + (leadOpen === 'new' ? Object.keys(leadDraft).length : 0);
    if (!unsavedOk(pending)) return false;
    leadOpen = null; leadData = null; edits.lead = {}; leadDraft = {}; leadNoteDraft = '';
    render();
    return true;
  }

  function leadBody(src){
    var body = {};
    Object.keys(src).forEach(function(k){ body[k] = src[k] === '' ? null : src[k]; });
    if (body.premium_estimate != null) {
      body.premium_estimate = parseFloat(String(body.premium_estimate).replace(/[^0-9.\-]/g,''));
    }
    return body;
  }

  function saveLeadEdits(){
    var rec = leadRecord(), fields = Object.keys(edits.lead);
    if (!rec || !rec.id || !fields.length) return;
    fetch('/api/leads/'+encodeURIComponent(rec.id), {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(leadBody(edits.lead))
    }).then(function(r){
      return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; });
    }).then(function(err){
      if (err) { alert('That change was refused:\n' + JSON.stringify(err)); return; }
      edits.lead = {};
      openLead(rec.id);
      loadCrmView('leads', true);
    }).catch(saveUnreachable);
  }

  function createLead(){
    var d = Object.assign({}, leadDraft, edits.lead);
    if (!String(d.name || '').trim()) { alert('A lead needs a name.'); return; }
    var body = leadBody(d);
    body.created_by_email = actingAs();
    fetch('/api/leads', { method:'POST', headers:{'Content-Type':'application/json'},
                          body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if (!res.ok) { alert('That lead was refused:\n' + JSON.stringify(res.j.detail || res.j)); return; }
        leadDraft = {}; edits.lead = {};
        loadCrmView('leads', true);
        openLead(res.j.lead.id);
      }).catch(saveUnreachable);
  }

  function addLeadNote(){
    var rec = leadRecord();
    var text = String(leadNoteDraft || '').trim();
    if (!rec || !rec.id || !text) return;
    fetch('/api/leads/'+encodeURIComponent(rec.id)+'/notes', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ body:text, author_email:actingAs() })
    }).then(function(r){
      return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; });
    }).then(function(err){
      if (err) { alert('That note was refused:\n' + JSON.stringify(err)); return; }
      leadNoteDraft = '';
      openLead(rec.id);
    }).catch(saveUnreachable);
  }

  function convertLead(){
    var rec = leadRecord();
    if (!rec || !rec.id) return;
    var lob = prompt('Open a deal on ' + (rec.company || rec.name) + '.\n\n'
                   + 'Which line of business?', rec.lines_of_business || '');
    if (!lob || !lob.trim()) return;
    fetch('/api/leads/'+encodeURIComponent(rec.id)+'/convert', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ line_of_business: lob.trim(), created_by: actingAs(),
                             assigned_to_email: rec.owner_email || actingAs() })
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if (!res.ok) { alert('That conversion was refused:\n' + JSON.stringify(res.j.detail || res.j)); return; }
        // Say what happened and where it went — a deal that vanishes into another
        // screen with no acknowledgement reads as a failure.
        alert('Deal opened on the pipeline for ' + lob.trim() + '.\n\n'
            + 'The lead stays here with its notes. Nothing has been sent to NowCerts —\n'
            + 'the deal reaches the AMS if and when it is won.');
        loadCrmView('leads', true);
        openLead(rec.id);
      }).catch(saveUnreachable);
  }

  function deleteLead(){
    var rec = leadRecord();
    if (!rec || !rec.id) return;
    if (!confirm('Delete ' + (rec.name || 'this lead') + '?\n\n'
               + 'Their notes go too. If they simply bought elsewhere, set the status to\n'
               + '"lost" instead — the x-date is next year\'s call.\n\nThis cannot be undone.')) return;
    fetch('/api/leads/'+encodeURIComponent(rec.id), {
      method:'DELETE', headers:{'Content-Type':'application/json'}
    }).then(function(r){
      return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; });
    }).then(function(err){
      if (err) { alert('That lead was not deleted:\n' + JSON.stringify(err)); return; }
      leadOpen = null; leadData = null; edits.lead = {};
      loadCrmView('leads', true);
    }).catch(saveUnreachable);
  }

  // One timeline renderer for both working surfaces. A lead's history and a deal's
  // history answer the same question and should not look like two different
  // features — the only difference is that a deal's is partly written by the
  // backend (stage moves, AMS filings) rather than entirely by a person.
  //
  // `entries` are normalised to {text, who, when, kind} by the caller.
  var EVENT_LOOK = {
    stage: ['#2563EB', '#E9EFFC'],
    ams:   ['#B9822A', '#F7EEDB'],
    created: ['#6B7078', '#EFEFEC'],
    note:  null,                      // a note needs no chip; it is the default
  };
  function timelineBlock(title, entries, noteAttr, draft, noteAction){
    var list = entries.length
      ? entries.map(function(e){
          var look = EVENT_LOOK[e.kind];
          return '<div style="padding:9px 0;border-top:1px solid #F2F2EE">'
            // The trailing space is deliberate: the chip and the text are adjacent
            // inline spans, and a margin separates them visually but not in the
            // text layer — copied or read aloud it came out as "stageMoved from".
            + (look ? '<span style="font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;margin-right:7px;'
                      + 'color:'+look[0]+';background:'+look[1]+'">'+esc(e.kind)+'</span> ' : '')
            + '<span style="font-size:12.5px;color:#25282E;line-height:1.45;white-space:pre-wrap">'+esc(e.text)+'</span>'
            + '<div style="font-size:11px;color:#9A9EA6;margin-top:3px">'
              + esc(e.who ? nameFromEmail(e.who) : 'Hermes') + ' · ' + dueHtml(e.when)
            + '</div>'
          + '</div>';
        }).join('')
      : '<div style="padding:10px 0;font-size:12px;color:#B4B7BD">Nothing recorded yet.</div>';

    return '<div style="margin-top:16px;padding-top:14px;border-top:1px solid #EFEFEB">'
      + '<div style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#96999F;font-weight:700;margin-bottom:6px">'
        + title + ' <span style="color:#B7BAC0">'+entries.length+'</span></div>'
      + '<div style="display:flex;gap:8px;align-items:flex-start">'
        + '<textarea '+noteAttr+' rows="2" placeholder="What happened?" style="flex:1;border:1px solid #E6E6E2;border-radius:9px;padding:8px 11px;font:inherit;font-size:13px;color:#25282E;resize:vertical;line-height:1.45">'+esc(draft)+'</textarea>'
        + '<span data-edit="'+noteAction+'" style="font-size:12px;font-weight:600;border-radius:8px;padding:8px 13px;cursor:pointer;'
          + (draft.trim() ? 'color:#fff;background:#2563EB' : 'color:#B7BAC0;background:#F1F1EE')+'">Add note</span>'
      + '</div>'
      + list
    + '</div>';
  }

  function loadDealEvents(id){
    dealEvents = null;
    pull('/api/opportunities/'+encodeURIComponent(id)+'/events').then(function(d){
      dealEvents = (d && !d._error && Array.isArray(d.events)) ? d.events : [];
      render();
    });
  }

  function addDealNote(){
    var rec = dealRecord();
    var text = String(dealNoteDraft || '').trim();
    if (!rec || !rec.id || !text) return;
    fetch('/api/opportunities/'+encodeURIComponent(rec.id)+'/notes', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ body:text, author_email:actingAs() })
    }).then(function(r){
      return r.ok ? null : r.json().then(function(e){ return (e && (e.detail || e._error)) || 'failed'; });
    }).then(function(err){
      if (err) { alert('That note was refused:\n' + JSON.stringify(err)); return; }
      dealNoteDraft = '';
      loadDealEvents(rec.id);
    }).catch(saveUnreachable);
  }

  function renderLeadCard(){
    if (!leadOpen) return '';
    var isNew = leadOpen === 'new';
    var rec = leadRecord();
    if (!rec && !isNew) {
      return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px;'
        + 'font-size:12.5px;color:#96999F">Loading lead…</div>';
    }
    var converted = rec && rec.status === 'converted';

    var actions = isNew
      ? '<div style="display:flex;align-items:center;gap:10px">'
        + '<span data-edit="lead:create" style="font-size:12px;font-weight:600;color:#fff;background:#2563EB;border-radius:8px;padding:7px 13px;cursor:pointer">Add lead</span>'
        + '<span data-edit="lead:close" title="Close (Esc)" style="font-size:16px;line-height:1;color:#9A9EA6;cursor:pointer;padding:0 2px">×</span>'
      + '</div>'
      : cardActions('lead',
          '<span data-edit="lead:convert" title="Open a pipeline deal on this lead"'
          + ' style="font-size:12px;font-weight:600;border-radius:8px;padding:7px 13px;cursor:pointer;'
          + (converted ? 'color:#6B7078;background:#F1F1EE' : 'color:#fff;background:#16233F')+'">'
          + (converted ? 'Convert again' : 'Convert to deal →') + '</span>'
          + '<span data-edit="lead:delete" style="font-size:12px;color:#B4231F;cursor:pointer">Delete</span>');

    var notes = (leadData && leadData.notes) || [];
    var notesBlock = isNew ? '' : timelineBlock('Notes', notes.map(function(n){
      return { text:n.body, who:n.author_email, when:n.created_at, kind:'note' };
    }), 'data-leadnote="1"', leadNoteDraft, 'lead:note');

    var linked = (rec && rec.converted_opportunity_id)
      ? '<div style="grid-column:1/-1;font-size:11.5px;color:#2563EB;background:#E9EFFC;border-radius:8px;padding:8px 11px">'
        + 'Converted — this lead is on the pipeline. It stays here with its notes, so the '
        + 'cross-sell next year has something to work from.</div>'
      : '';

    return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px">'
        + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">'
          + (isNew ? 'New lead' : esc(rec.name || 'Lead')) + '</span>'
        + actions
      + '</div>'
      + '<div style="font-size:11.5px;color:#9A9EA6;margin-bottom:12px">'
        + 'Held in the CRM. Nothing here is sent to NowCerts.</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px">'
        + linked
        + LEAD_FIELDS.map(function(f){ return editField('lead', rec || {}, f[0], f[1], f[2]); }).join('')
      + '</div>'
      + notesBlock
    + '</div>';
  }

  // ---- Cases and tasks ------------------------------------------------------
  // These are the CRM's own records, not a mirror of NowCerts, so an edit is a
  // real write — not an override. Completing and deleting live on the same card
  // as the fields: a queue you can only add to is a queue nobody trusts.
  var TASK_STATUSES = ['not_started','in_progress','waiting','completed','cancelled'];
  var PRIORITIES = ['low','medium','high','urgent'];
  var TASK_FIELDS = [
    ['title','Title', {wide:true}], ['status','Status', {options:TASK_STATUSES}],
    ['priority','Priority', {options:PRIORITIES}],
    ['assigned_to_email','Assigned to'], ['due_at','Due', {placeholder:'YYYY-MM-DD'}],
    ['description','Notes', {wide:true, area:true}],
  ];
  var CASE_FIELDS = [
    ['title','Title', {wide:true}], ['case_type','Type'],
    ['priority','Priority', {options:PRIORITIES}],
    ['owner_email','Owner'], ['due_at','Due', {placeholder:'YYYY-MM-DD'}],
    ['description','Notes', {wide:true, area:true}],
  ];

  // Whichever list the open work item came from — the client 360 or the CRM
  // table. One lookup so the card does not care which screen opened it.
  //
  // The list for the view you are ON is searched first. Both can hold the same
  // record, and only one of them was just re-read: a client 360 left loaded from
  // earlier will happily answer with the pre-save copy, which is how a card ends
  // up showing "open" next to a row that says "closed".
  function workRecord(){
    if (!workOpen) return null;
    var key = workOpen.kind === 'task' ? 'tasks' : 'cases';
    var fromClient = clientData ? clientData[key] : null;
    var fromTable = (crmData[key] || {}).rows;
    var pools = (state.crmView === 'client') ? [fromClient, fromTable] : [fromTable, fromClient];
    for (var p=0;p<pools.length;p++){
      var rows = pools[p] || [];
      for (var i=0;i<rows.length;i++) if (String(rows[i].id) === String(workOpen.id)) return rows[i];
    }
    return null;
  }

  function renderWorkCard(){
    var rec = workRecord();
    if (!rec) return '';
    var isTask = workOpen.kind === 'task';
    var fields = isTask ? TASK_FIELDS : CASE_FIELDS;
    var closed = isTask
      ? (rec.status === 'completed' || rec.status === 'cancelled')
      : (rec.status === 'closed');

    var btn = 'font-size:12px;font-weight:600;border-radius:8px;padding:7px 13px;cursor:pointer;';
    var extra = '';
    if (!closed) {
      extra += '<span data-edit="work:finish" style="'+btn+'color:#2563EB;background:#E9EFFC">'
             + (isTask ? 'Complete' : 'Close case') + '</span>';
    }
    extra += '<span data-edit="work:delete" style="'+btn+'color:#B4231F;background:#FBE9E7">Delete</span>';

    return '<div style="background:#fff;border:1px solid #E7E7E4;border-radius:13px;padding:18px 20px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px">'
        + '<span style="font-family:\'Newsreader\',Georgia,serif;font-size:17px;color:#1B1D22">'
          + (isTask ? 'Task' : 'Case ' + esc(rec.case_number || '')) + '</span>'
        + cardActions('work', extra)
      + '</div>'
      + '<div style="font-size:11px;color:#9A9EA6;margin-bottom:13px">'
        + (isTask
            ? 'Status is a field here — completing is the same write, one click.'
            : 'Closing a case records a resolution and pushes the summary to NowCerts, so it is an action rather than a field.')
      + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:11px 13px;background:#FAFAF7;border:1px solid #EFEFEB;border-radius:10px;margin-bottom:14px">'
        + readonlyId(isTask ? 'Task ID' : 'Case ID', rec.id, true)
        + (isTask ? readonlyId('Case', rec.case_id || '—') : readonlyId('Case number', rec.case_number))
        + readonlyId('Status', rec.status)
      + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px">'
        + fields.map(function(f){ return editField('work', rec, f[0], f[1], f[2]); }).join('')
      + '</div>'
    + '</div>';
  }

  function renderClientDetail(){
    var d = clientData;
    if (!d || d.loading) {
      return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#96999F;font-size:13px">Loading client…</div>';
    }
